#
# WHAT IT DOES. A project may bind an approved CHG to the repositories, paths, documentary
# obligations and tests it authorizes, in .framework/contribution-policy.json committed
# before the work it governs. The strict profile reads Git objects at full commit ids --
# not the working tree, not the PR body -- and fails closed when history, access, policy or
