#     problem-statement      initiatives/<i>/PRB-NNN.md        -> PRB-NNN-slug.md
#     hypothesis             initiatives/<i>/HYP-NNN.md        -> HYP-NNN-slug.md
#     evidence-brief         initiatives/<i>/EVD-NNN.md        -> EVD-NNN-slug.md
