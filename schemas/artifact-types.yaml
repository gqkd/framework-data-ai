# their files and exactly one of them said so; the other twelve declared `PREFIX-NNN.md` while
# real files carry `PREFIX-001-some-words.md`. One convention, written out by hand thirteen
# times, wrong twelve. `-slug` is one token now and it is optional, because nothing here
# forbids a human tail on a numbered file and nothing requires one.
