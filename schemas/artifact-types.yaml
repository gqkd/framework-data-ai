# and `met` are closed conversations; and `unsatisfiable`, or a `feasibility` of
# `out-of-reach`, is a promise this project has already judged it will not deliver -- owed a
# conversation with whoever received it, and not a boundary on the build. Those get cited,
# with the risk that owns the exposure, and the candidate gets classified.
#
# THE CHECK IS WHAT MAKES THAT SAFE TO WRITE, WHICH IS WHY THEY SHIP TOGETHER. A carve-out
# for written-off rows makes `out-of-reach` the cheapest way to take a promise out of the
# triage's attention, and out of everybody's -- the customer still planning around it.
# `XP007` reports a commitment that is `out-of-reach` or `unsatisfiable` and that no live
# risk names: `COMMITMENTS.md` §Owed a conversation asked as a question a script can ask.
# Not "is it mitigated", because the remedy is a conversation and not a mitigation, but who
# is answerable for it until that conversation happens. `closed` and `expired` risks are not
# owners, the same pair `REF006` excludes. `feasibility` was declared in 2.5.0 and until now
# no check read it.
#
# What an adopting repository sees: nothing stops validating, and one new `warn` per promise
# that is out of reach with no risk naming it. The repair is a row in the risk register of a
# product it binds with `commitment: CMT-NNN`, which two other documents already ask for
# -- `RSK.md` calls an out of reach commitment the biggest risk in the project, and the
# `requirement` skill's cascade opens that row -- or `status: renegotiated` once the
# conversation has happened. The second pass of `audit` keeps the half no check reaches: is
# the `OPEN.md` entry there, does the risk say something true, was the call actually made.
# 2.8.10 -> 2.8.11. A seventh skill, `business`, and one line in `scan.skip_dirs` so that
# what it writes is legal in a repository. The skill produces a weekly business SAL; no type,
# field or check moves.
#
# WHAT IT ANSWERS, WHICH IS THE QUESTION `FRAMEWORK.md` §1 puts to every proposal. What the
# product is, what changed, where it is going, which challenges matter and what non-development
# actors must do -- written for weekly steering rather than engineering. `PBR` says what a product is, `REL` what changed in one
# release, `RMP` in what order, `product.index.yaml` composes them for machines, and every one
# of them is addressed to a reader who can check it. The market cannot: it acts on the document
# and repeats it, which is why the register is commercial and why a commitment appears in it as
# a claim with an exposure and never as a capability. The suite had it worse: at the root there
# are four registers and no business status view at all.
#
# IT IS A SKILL AND NOT A TYPE, AND THE DIRECTORY IS THE INTERESTING HALF. Every fact in the
# document is a retelling of one that lives in an artifact, so storing it as a source would
# be the single principle broken in the one document nobody in the team rereads. It is a
# dated snapshot -- `_meta/business/SAL-NNN-<product>-YYYY-MM-DD.md`, never edited once
# written -- and the series answers something no artifact does: what the business could see
# at each checkpoint. It has no owner: its sources retain theirs. The exclusion is a path and not a bare `business`, for the reason `extract`
# already carries: a project may keep a directory of that name for artifacts of its own.
#
# What an adopting repository does: nothing. No document changes, no field is required, and a
# project that never invokes the skill never grows the directory. The one thing to know is
# that a file under `_meta/business/` is not validated by anything -- which is the trade the
# choice makes, and the skill carries the rules the schema would otherwise have carried.
# 2.8.11 -> 3.0.0. TWO FORMAT BREAKS ON DOCUMENTS, ONE BUMP, ONE NOTE. MAJOR by the rule at
# the top of this file: documents that validated stop validating. They ship together because
# they are the same mistake seen twice -- a fact written in two places, and a reference that
# does not say enough to resolve -- and because a project should be asked to migrate once.
#
# ONE · THE MAP IS THE ONLY SOURCE FOR THE FIELDS IT CARRIES. `OPEN.md`, `RSK.md` and
# `COMMITMENTS.md` each carried a map in front matter and repeated its fields in the body: a
# risk's category, likelihood, impact and state were in `risks:` and in the columns of
# §state, a commitment's status, feasibility, products and recipient were in `commitments:`
# and in its body table. The body keeps what the map does not hold -- the risk itself, the
# mitigation, the owner, the words the promise was made in, who said it and what it would
# take to build -- and nothing else.
#
# WHAT THE REPAIR IS, CORRECTED IN 3.5.2 AND WRONG UNTIL THEN. This note said the repair is a
# deletion. That is true of the shape it was written against, a column of values under a
# header, where dropping the column loses nothing because the map holds the value. It was
# applied to a shape it was not written for: a register that writes one row per field, the
# label on the left and prose on the right, where the right-hand cell begins with the map's
# value and goes on to say something the map has no field for. Deleting that deletes an
# argument. Counted in one commitments register: 68 cells, 38 the value alone, 27 the value
# plus reasoning, 3 where the map's field is deliberately empty and the body carries the only
# assessment there is.
#
# `REG016` DISTINGUISHES THE THREE NOW, AND THIS NOTE IS A DESCRIPTION OF WHAT IT REPORTS
# RATHER THAN A SECOND STATEMENT OF THE RULE:
#
#   the label and the value    the body names the field and carries what the map holds. This
#                              is the deletion, and it is the only one.
#   the label alone            the body names the field and writes something else underneath.
#                              Two claims, not one repeated. Which is true is not decidable by
#                              any check: decide, then delete one.
#   the value alone            the body carries the value under a name the check cannot
#                              recognise. Same duplication, and the finding carries the lines
#                              because nothing else will find them.
#
# The third case of the count above, a map field left empty on purpose, has had a declared form
# since 3.2.0: `unanswerable`, with the reason and the event that would settle it.
#
# NOT A CHECK THAT THE TWO HALVES AGREE, WHICH IS WHAT WAS PROPOSED AND IS THE WRONG REPAIR.
# The framework's own rule is that a fact has one authoritative place; a check comparing two
# copies accepts the duplication and polices it forever. It also failed in the direction
# nobody looks: `risks: {}` with a full §state table validated clean, every join that reads
# the map went quiet, `XP005` was satisfied because the *file* existed, and the second pass
# of `audit` enumerates from what is generated -- which comes from the map -- so the semantic
# reading was looking at the empty half too. The template had already made this move for one
# field, and said so: "The default itself is a field in `entries:` above, not a line here".
# This is that sentence applied to the rest of them.
#
# `REG015` is what is left of the comparison, and it is deliberately small: the same set of
# ids in the map and in the body, both directions, nothing about the fields. A row in one
# half and not the other is a row somebody half-wrote; the fields cannot disagree any more
# because they are not in two places. `REG004` now reports an absent map on all three
# registers rather than on the open register alone, and `XP005` asks whether a risk register
# says anything rather than whether the file is there.
#
# On the one field where the duplication was left: §1 of an open register groups entries
# under `## Cost to reverse HIGH | MEDIUM | LOW`, which repeats `cost_to_reverse`. The
# heading is navigation and the reading order of the document, and the generated §5 at the
# root is the composed view of the same field across three registers. Removing it would
# leave §1 an unordered list to solve a duplication nobody has ever got wrong. The templates
# now say which of the two a check reads.
#
# TWO · A REFERENCE TO A PER-PRODUCT IDENTIFIER NAMES THE PRODUCT. `atlas:SIG-041`, and a
# bare `SIG-041` in an `id_fields` field stops validating -- `FM002`, at the schema, because
# the reference pattern and the declaration pattern are two patterns now and only the first
# one narrowed. `REF007` reports the qualifier naming a product the repository does not have,
# and `REF008` the qualifier naming a product the referencing document does not declare in
# `products:`. See `qualified_reference_prefixes` for why the list is two prefixes and not
# every per-product register, and for why declarations stay bare.
#
# WHY NOW AND NOT AFTER THE FIRST REAL PROJECT, WHICH IS THE ONLY REASON THIS IS A GOOD
# TRADE. A semantic break costs what the installed base costs, and today that is zero. The
# same change made after a project outside this repository has written its documents is the
# same change made against somebody. `CHG` also gains `id_fields: [derives_from]`, which it
# should have had since `CHG001` started reading the field.
#
# What an adopting repository does, in this order. `migrate.py` splits its findings into the
# ones the move created and the ones that were already there; it does not rewrite documents,
# and it is not going to for either of these. The column removal is mechanical but the
# framework does not have tools that edit bodies. The reference qualification cannot be
# automated where it matters: a `CHG` under `products/atlas/` could have its product read off
# the path, but a `DEC` at the root naming `SIG-041` does not say which product's signal it
# is, and that missing information is precisely what this change adds. Guessing it would
# write the ambiguity down as a fact.
# 3.0.0 -> 3.0.1. TWO DESCRIPTIONS, AND THE NUMBER THEY INVALIDATE. `requirement` and
# `cycle` say more accurately what they already did; no document changes, no field moves, no
# check arrives, so it is a PATCH by the rule at the top -- and MINOR is suspended anyway.
#
# WHAT IT COSTS, WHICH IS THE HALF THAT IS EASY TO LEAVE OUT. Triggering depends on the
# `description:` fields and on nothing else, so `evals/README.md` says in as many words that
