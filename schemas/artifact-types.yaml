# ─────────────────────────────────────────────────────────────────────────────
# Findings from the recovery
#
# Every one of the 28 types above was checked against the template that declares it. The
# `status` value in each template's front matter is a member of that type's enum, and
# every declared `lifecycle` matches. The recovery turned up two gaps, both in files the
# validator had never looked at, because `templates/` is in `skip_dirs` and so the
# validator has never checked the templates it validates everything else against. Both
# are now closed, and the reasoning is recorded here because this repository has no
# `decisions/` of its own:
#
# 1. `templates/RLM.yaml` carried neither `status` nor `owners`. `status` was added.
#    `owners` was not: the file also carries `approvals`, with who, which role and when,
#    so a second field answering "who is accountable for this release" would have put the
#    same fact in two places inside one file. What no field said was that nobody writes
#    this file at all, which is why `generated_by` took the slot instead. See the note on
#    `generated` above.
#
# 2. `templates/RLM.yaml` and `templates/product.yaml` used `product:` in the singular
#    while every other artifact used `products:` as a list, and the cross-product checks
#    read the plural. The product manifest, the one file that most authoritatively says a
#    product exists, was invisible to the check that looks for products with no `PBR`.
#    Both were renamed to `products:`, and "exactly one" moved from being implied by the
#    field name to being a constraint a machine can check.
#
# Not recovered here, still only in git at `acaded9^`, and needed when the validator is
# rebuilt: the check catalog with its codes and messages (FM001-FM008, LC001-LC004,
# ID001, REF001-REF004, SEC001, XP001-XP003, CHG001-CHG002, RLM001-RLM002, REG001-REG003),
# the `last_review` instant parsing with its refusal to treat a half filled timestamp as
# midnight, and the index generators. Those are implementation. This file is the part
# that was specification with nowhere to live.
  roadmap:
    id: RMP
    name: Progressive implementation roadmap
    axis: product
    born_in: F4
    template: templates/RMP.md
    path: products/<p>/RMP.md
    lifecycle: living
    status: [active]

  impact-classification:
    id: ICG
    name: Impact classification gate
    axis: product
    born_in: loop
    template: templates/ICG.md
    path: products/<p>/cycles/ICG-NNN.md
    lifecycle: immutable
    status: [proposed, accepted, superseded]
    id_fields: [supersedes]
    sections: [intake, classification, open-questions]
    # One document per cycle, one row per candidate. `routing` is where each candidate
    # goes and there is exactly one answer per candidate; `impacts` is what it touches on
    # the way and a candidate can touch several, which is why the two are separate fields
    # and not one longer enum. `templates/CHG.md` already carried the four impacts as
    # separate flags while the gate upstream could only emit a single verdict, so a data
    # contract breaking with no product or architecture movement had to be filed as
    # something it was not.
    maps:
    # Every candidate looked at goes in `routing`, including the ones that turned out not
    # to be candidates. That is what makes triage state a question you can ask the
    # documents: `LOG` is append-only and could never carry a "handled" column, so without
    # this every cycle re-reads the whole log and guesses which signals are new.
      routing:
        required: true
        one_of: [none, product, architecture, both,
                 hypothesis-invalidated, problem-invalidated,
                 not-classifiable, not-a-candidate]
      impacts:
        any_of: [architecture, data, ai, risk-compliance]

  change-contract:
    id: CHG
    name: Change contract
    axis: product
    born_in: loop
    template: templates/CHG.md
    path: products/<p>/changes/CHG-NNN.md
    lifecycle: immutable
    status: [draft, approved, implemented, verified, rolled-back]
    # DECLARED IN 3.0.0, AND READ BY THE VALIDATOR SINCE LONG BEFORE. `CHG002` and `CHG001`
    # both read this field -- they look in it for the `DEC` and the `EVR` a classification
    # demands -- and it was in no schema, so `derives_from: 12` was as legal here as it was
    # on a `DEC` before 2.8.x closed the same hole there. It is also the field that names a
    # `SIG` more often than any other in the framework, which is what made the omission
    # matter once references had a shape: the type most likely to carry a qualified
    # reference was the one type whose reference field nothing was checking.
    id_fields: [derives_from]
    sections: [what-changes, what-must-not-change, how-we-know-it-worked]

  cycle-plan:
    id: IMP
    name: Cycle implementation plan
    axis: product
    born_in: loop
    template: templates/IMP.md
    path: products/<p>/IMP.md
    class_note: replaced
    lifecycle: living
    status: [active]

  risk-register:
    id: RSK
    name: 'Risks: state / acceptances / events'
    axis: product
    born_in: F3
    template: templates/RSK.md
    path: products/<p>/RSK.md
    lifecycle: living
    status: [active]
    sections: [state, acceptances, events]
    # §state in front matter, for the same reason as the commitments beside it: the rows
    # were a markdown table and nothing could read one. `commitment` is the field that pair
    # was missing -- a risk about a promise names the promise, and in a real repository a
    # commercial risk tracked a claim that `COMMITMENTS.md` did not contain at all, which
    # is a risk nobody can renegotiate because there is no promise to renegotiate.
    #
    # `commitment: none` is the declared absence, and it exists because the first version of
    # the check was wrong about a whole class of risk. A commercial risk is not always about
    # a promise: an untested market hypothesis, a comparison drawn against the wrong
    # competitor set, an intellectual property transfer nobody completed are all commercial
    # exposures and none of them was said to anybody. `category` cannot answer this -- the
    # vocabulary there is where a risk comes from, not whether somebody promised something --
    # so without `none` the only way to stop `REF006` asking was to file the risk under a
    # category that was false. A check whose cheapest repair is a lie is a check that
    # teaches the habit its own skill spends half a page warning against.
    #
    # The body keeps the mitigation, the owner and the argument. §acceptances and §events
    # stay prose entirely: an acceptance is somebody's signature under a sentence, and an
    # event is a story with a date.
    #
    # From 3.0.0 that sentence is the whole rule rather than an intention: the category, the
    # likelihood, the impact and the state were columns of §state and fields of the map at
    # once, and they are fields only now. `body_ids` is the first cell of each §state row,
    # which `REG015` compares against the keys of the map. §events also names risks, and it
    # is not read here: it is a history, and a closed risk keeps its events.
    body_ids:
      from: table
      section: state
      map: risks
    maps:
      risks:
        may_be_empty: true
        keys: "^RSK-(\\d{3,}|NNN)$"
        fields:
          required: [category, state]
          optional: [likelihood, impact, commitment]
          # `decided_in` names the decision this row follows from, and it is the same field
          # `STACK.md` carries on a stack row -- same name, same shape. A list, because the
          # exposure is created by one decision and the guard against it can come from
          # another: `RSK-033`, the row this field came from, follows from two. Adoption is
          # forward only: existing rows do not carry it, and no check asks for it until they
          # do.
          lists: [decided_in]
          enums:
            # `security` is not `compliance`: one is whether a rule is broken, the other is
            # whether somebody gets in, and a framework with `ai` and no `security` is a
            # list that grew by accident.
            #
            # `organisational` is the risk that the person is not there. This framework is
            # built around a human in the loop -- half its decisions are about who reads
            # what before what happens -- and it had no way to file the risk that the shift
            # is unstaffed. The first repository to try wrote it in the register's prose,
            # which is where things go when the vocabulary has no room.
            category: [technical, data, ai, security, compliance, commercial,
                       organisational, vendor]
            state: [open, mitigated, accepted, transferred, closed, expired]
            # `C` is not a fourth degree of likely, it is the end of the scale: the thing has
            # happened, or the estimate that contradicts the claim is already written down.
            # A scale whose maximum is "high" forces the honest answer to be no answer, and
            # a risk with no likelihood drops out of every ordering that reads one -- which
            # is a worse outcome than a wrong letter, because it is an invisible one.
            likelihood: [L, M, H, C]
            impact: [L, M, H]
