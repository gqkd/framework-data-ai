# Artifact type registry
#
# WHAT THIS IS. One machine-readable record of what each artifact type is allowed to be:
# its maintenance class, its legal `status` values, the front matter fields it requires,
# and the sections its body must contain.
#
# WHY IT EXISTS AS A FILE. FRAMEWORK.md §8 states that `status` and `artifact_type` are
# defined by "the artifact's own schema". That schema had no home. The 28 `schema:`
# identifiers carried by the templates point at nothing, and the values themselves lived
# only inside `skills/framework-audit/scripts/validate.py`, deleted in commit acaded9.
# Three templates out of 29 state their enum in the body (CHG, DEC-ADR, HYP). The other
# 26 stated it nowhere at all. This file is where they now live.
#
# WHERE IT CAME FROM. Recovered from `acaded9^:skills/framework-audit/scripts/validate.py`
# and checked field by field against the current templates. Every value here was verified
# to be consistent with the template that carries it, with one exception recorded at the
# bottom of this file.
#
# WHAT IS GENERATED FROM IT. `generate.py` writes three things, and `--check` exits
# non-zero when any of them has drifted from this file:
#
#   framework/<artifact_type>/v1.json   one JSON Schema per type, which is what makes the
#                                       `schema:` identifier each template carries resolve
#   FRAMEWORK.md §7                     the artifact catalog
#   templates/README.md                 the same catalog, with the naming conventions
#
# The last two were written by hand, in two places, and had already drifted: `DC` was
# "living, versioned" in one and "living" in the other, and so were `EVP` and `IMP`. The
# framework broke its own single rule inside its own reference document within five
# commits. Do not edit any of the three: edit this, then regenerate.
#
# The schema covers the front matter only. `sections` stays here because it is about the
# markdown body and no JSON Schema can express it, and so does `scan`, which is about
# which files get looked at in the first place. Passing the schema is not passing the
# gate.
#
# The schema identifier of a type is `framework/<artifact_type>/v1`. It is derivable from
# the key, so it is not repeated on every entry.

# The number a project pins in its own `framework.yaml` as `framework_version`, and the
# same number the plugin ships under. One version and not two, by decision: this repository
# is the framework and the plugin both, and two numbers on one artifact means somebody has
# to be told which of them answers "what am I running".
#
# This reverses what stood here, and the reversal is the interesting half. The note said an
# integer, deliberately, because "the only question a project has is do I have to do
# something, and three components invite an argument about which one moved". It also said
# the number was not the plugin's, because a release that rewords a skill changes nothing
# about whether a document still validates. Both arguments were sound and both are now
# paid for: with one number, a reworded skill does move the version a project reads, and
# the middle and last components are where that lands. Which is what the components are
# for -- MAJOR is the answer to "do I have to do something", and the other two are the
# answer to "no".
#
#   MAJOR   a document that validated stops validating, or starts meaning something else:
#           a new required field, a narrowed enum, a type removed, a check promoted to
#           error. This is the one that asks a project to migrate.
#   MINOR   something arrived and nothing broke: a new type, an optional field, a check at
#           `warn`, a skill that does more than it did. Suspended while the model is frozen:
#           see the note under `version` for what is shipping as a patch instead, and why a
#           number a consumer can pin against is worth more right now than a number that
#           announces every check.
#   PATCH   wording, a message, a fixture. Nothing about the framework moved.
#
# AN OPEN QUESTION ABOUT THIS RULE, REGISTERED AND NOT ANSWERED. The three levels are decided
# by one question -- does a document stop validating -- and everything that answers no falls
# through MAJOR into MINOR, and while MINOR is suspended, into PATCH. 3.0.1 went there: it
# changed which skill fires on which sentence, and it added ~195 always-on tokens to every
# session of every project, whether or not a skill runs. No document stopped validating, so
# by the rule it is a patch. It reached PATCH by exclusion rather than by anybody judging it
# small.
#
# What the rule cannot currently say: a version can change agent behaviour and cost without
# touching a document, and there is no level that means that. The reason to leave it alone
# for now is that inventing a fourth level, or moving the boundary, on a framework with one
# consumer is the kind of change this file spends its notes warning against -- and the answer
# should come from the first project that is surprised by one of these, not from here.
#
# A three part string, so `1.10.0` sorts after `1.9.0` rather than before it. Quoted here
# because YAML reads a bare `1.1` as a decimal and a bare `2` as a whole number, and both
# of those stop being comparable with a version -- which `FW001` says in as many words when
# it finds one in a project.
#
# 1 -> 1.1.0. The open register became one per product. Under the old integer that was a 2,
# because an entry in `products/<p>/OPEN.md` naming no product used to bind every product
# and now binds that one, so `open_decisions` changes in every `product.index.yaml` without
# the register being touched. Under three components it is a MINOR: nothing stops
# validating, and the only repositories whose documents change meaning are the ones that
# already kept a register under a product -- which the framework asked for as an exception
# and which is the arrangement being made standard, not one being taken away. `REG006`,
# `REG007` and `REG008` are all `warn`. A repository that kept a single register at the root
# means exactly what it meant.
#
# 1.1.0 -> 2.0.0. `deadline` on an open entry became `trigger`, and a register still
# carrying the old key stops validating: `additionalProperties` is `false` on an entry, so
# this is a MAJOR by the definition four paragraphs up, and the one that asks a project to
# migrate. The migration is a rename plus, for any entry whose deadline was a bare date,
# a sentence saying what happens on that date.
#
# WHY, AND IT IS NOT A RENAME FOR TIDINESS. A date on a decision nobody has taken is a
# number nobody derived. What actually closes the window is the default in force becoming
# expensive to unwind, or an event: the second customer, the first line of code written
# against it, the signature. The framework already said so on the low-cost tier, where the template has
# always read "there is no date by which to decide it, there is an event after which it can
# no longer be deferred", and `trigger` is that rule applied to all three tiers.
#
# The name was the defect. A field called `deadline` is filled in with an event by whoever
# knows what actually closes the window, and with a plausible end of quarter by whoever does
# not -- and the second is indistinguishable from the first once it is written down, which
# is the failure this framework keeps arranging itself against. `trigger` cannot be answered
# with a number nobody derived without the answer looking like what it is.
#
# There is no fallback parser and no alias, which is a change of position: the note under
# `entries:` used to say an old-format register does not exist to protect, and one does
# now. It is migrated instead, because an alias would mean two spellings of the field
# forever and a register where both appear, which is the ambiguity this file exists to
# refuse. `REG009` reports a date in a trigger, at `warn`, and it
# reports every date: an entry still open has no calendar, not even beside an event. "The
# external audit" is a trigger; "the external audit, 2026-10-31" is the same trigger with a
# commitment glued to it, and the commitment is the half that gets quoted back later by
# somebody who never opened the register.
#
# `decide_with` arrives with it, so that the only sequencing this register can express is
# between decisions: `depends_on` is this one before that one, `decide_with` is these two
# in the same sitting, because deciding either alone decides the other by implication.
# 2.0.0 -> 2.1.0. Six checks and four fields arrived and nothing stopped validating, which
# is what MINOR is for. `decide_with` on an entry, `terms` on the glossary, `leaves_open` on
# a decision, and the two registers that were markdown tables until now -- `commitments:` and
# `risks:` -- are all optional in the schema, and the checks that ask for them are `warn`:
# `REG010`, `REG011`, `REG012`, `FM005`, `LC005`, `REF005`, `REF006`, `XP005`. A repository
# written against 2.0.0 keeps validating and starts being told what it is missing, which is
# the difference between a version that asks you to migrate and one that asks you to catch
# up. `dropped` joined the stack vocabulary the same way: a value added takes nothing away.
# 2.1.0 -> 2.2.0. `REG013` at `warn`: an entry at the root that binds one product belongs
# beside that product. The rule is not new -- `FRAMEWORK.md` has always said the root keeps
# what belongs to no single product, and `REG008` says it from the other side -- but nothing
# enforced it, because `REG008` only looks inside `products/<p>/` and at the root there is no
# directory to contradict. `REG011` going green meant the question had been answered, which
# is not the same as the answer putting the entry where it belongs.
#
# Also here, and a PATCH rather than a MINOR: `--emit-index` was printing `all` as a product
# heading and selecting the "bound to no single product" section on entries that named
# nothing, which is the state `REG011` removes. The two shipped in 2.1.0 and worked against
# each other.
# 2.2.0 -> 2.3.0. `leaves_open` gains a third state and `REG014` reports it.
# `[unregistered]` says a decision left something open whose entry nobody has written --
# usually because the register it lived in was withdrawn and never reimported -- and until
# now that had to be written as absence, which produced the finding for "nobody looked" on
# decisions where somebody had looked and said so. `product.index.yaml` grows
# `open_unregistered` for the same reason: a question with no entry cannot appear in a view
# built from registers, which is the complaint that produced the state.
# 2.3.0 -> 2.4.0. `commitment: none` on a risk, and `REF006` narrowed to match. The check
# asserted that a commercial risk naming no commitment was a claim promised nowhere, which
# is false of every commercial exposure that is not a promise -- and `category` cannot say
# which is which, because that vocabulary is about where a risk comes from. With no way to
# answer honestly, the only way to silence the check was a category that was untrue.
# 2.4.0 -> 2.5.0. Three vocabularies grew, and the values they were missing were all the
# same shape. `security` and `organisational` on a risk; `not-yet-assessable` and
# `not-applicable` on a commitment's feasibility; `C` on likelihood, for what has already
# happened. Values added, nothing narrowed, so every document that validated still does --
# and `blocked_by` joins a commitment to the entry that has to be decided before its
# feasibility can be judged at all.
# 2.5.0 -> 2.6.0. `kind` on a glossary term is required unless `blocked_by` is there, and
# `XP005` stops counting commitments nobody has received. Both are the same mistake in two
# places: a field that exists to describe what is not known yet, asking you to know something
# -- and a count that included the rows with no exposure behind them, which is a number that
# does not survive being checked. Nothing narrowed; a term that validated still does.
# 2.6.0 -> 2.6.1. `REF005` reported two shapes that are not findings: a citation written
# inside a table cell, where the match ran to the end of the row, and one naming a section of
# the glossary instead of a term. Both were found by a repository, and both produced the
# worst kind of finding -- one that sends somebody to check a document that was right.
# 2.6.1 -> 2.6.2. Documentation drift, and `FW001` learning to ignore a patch. A reference
# document carrying its own version two majors behind, a count of checks wrong by fifteen, a
# diagram presented as current that had not been redrawn in two weeks, a sentence saying
# tooling was still to be built after it was built. All four were found by a reading and none
# by a check, which is the honest measure of what a self-check covers. The count is generated
# now; the rest were sentences and are gone.
# 2.6.2 -> 2.7.0. Four checks and two files that are not artifacts. `PR001` to `PR004` read
# a change set -- the text of a pull request and the list of files it touches -- against the
# `CHG` that authorizes it, and `ci/` holds the pull request template and the workflow that
# supply that context. The first three are `error`, in a catalog whose rule is that almost
# everything starts at `warn`, and this is still a MINOR: they do not run at all without
# `--pr-text`, so no pipeline that exists today can start failing because of them. The
# argument for `warn` -- checks turned on before the artifacts exist are a factory built
# before the product -- is about checks a repository cannot avoid. These fire only where
# somebody wired them in on purpose, and a gate that does not block is a comment.
#
# `PR004` is the one that recovers something. "Touch data or a schema and the `DC` is
# versioned and its consumers are told" was written in a process document that was folded
# into another one, and the rule went with it: the `ICG` already records that a candidate
# touches `data`, and nothing compared that with what the change set did.
#
# `skills/audit/scripts/migrate.py` arrives with them and adds no check. It runs the
# validator a project pinned and the one it is moving to over the same repository and
# splits the findings into already there, new, and gone -- which is the question `FW001`
# asks and cannot answer. The old validator is reconstructed from this repository's git
# history at the commit where this file last declared that version, so nothing has to have
# been tagged or released for a migration to be executable.
# 2.7.0 -> 2.7.1. Five defects in the tooling, found by the first real migration and by
# running it against arguments nobody had tried. Nothing in the rules moved -- no check, no
# field, no vocabulary -- so no document that validated stops validating, and no repository
# has anything to do about this. That is what a PATCH is.
#
# One of them changes an exit code, which is the only reason a project could notice. A
# `--root` that is not a directory used to be scanned as an empty repository: nothing found,
# a note saying the framework version was not declared, exit 0. `audit/SKILL.md` had warned
# about exactly this from its first version -- a clean report on the wrong repository is
# worse than an error -- and nothing enforced it. Both tools refuse now. A pipeline that
# goes red on this was checking nothing before it went red.
#
# The rest are `migrate.py`: findings keyed on (code, path) collapsed the repeats of one
# check on one file, so a version that made a check noisier would have reported "nothing
# new"; `FW001` was filed as migration work while `--adopt` was already skipping it; a
# repository already on the current version exited 1; and an unparseable `framework.yaml`
# or a framework that was unpacked rather than cloned came back as a traceback instead of a
# sentence.
# 2.7.1 -> 2.8.0. `framework_commit` in a project's `framework.yaml`, and `FW003` reading it.
# An optional field and a check at `warn`: a repository that validated still does, and one
# that does not pin sees nothing, which is what MINOR is for.
#
# The two fields answer different questions and the difference is the reason both exist.
# `framework_version` says which rules a repository was written against, and binds nothing:
# two machines can declare the same number and run different code, so a green report cannot
# be reproduced from anything the repository records. `framework_commit` is the project
# writing down the commit it is checked by, and `FW003` is what stops that from being a
# comment. It is silent when the field is absent -- pinning costs a deliberate bump for every
# fix the framework ships, which a project with one developer and no CI has no reason to pay
# -- and silent when the framework was installed rather than cloned, because there is no
# history to ask and unverifiable is not the same claim as violated.
#
# `migrate.py --adopt` moves both lines together, and only rewrites the pin when the file
# already carries one. A migration that moved the version and left the pin naming the code it
# had just stopped running would produce `FW003` for the rest of the week, out of the tool
# whose whole job is to tell a migration from a mistake.
#
# Versions are tagged from here: `v2.8.0` is the first. Nothing in the framework needs the
# tags -- `migrate.py` reconstructs an old validator from the history, which is why it never
# needed them -- but a project pinning a commit reads a tag to find out which one, and a CI
# job checking the framework out names a ref rather than a hash. Earlier versions are not
# retro-tagged: inventing the tags after the fact would put a release label on commits that
# were never released.
#
# FROM 3.0.0 EVERY BUMP IS TAGGED, AND THE RULE IS HERE BECAUSE THE OMISSION HAD A COST. The
# sentence above was written at 2.8.0 and then ten versions shipped without a tag, so
# `ci/pull-request.yml` -- which tells a project to pin `ref:` to "the commit, or the tag of
# the version it declares" -- was giving an instruction that could not be followed for any
# version a project was actually on. A bump is already a commit of its own: tagging it is one
# command, and skipping it makes the other half of the instruction the only half that works.
# `2.8.1` to `2.8.10` stay untagged for the reason above, and that gap is stated in the CI
# template rather than papered over.
#
# NOT ASSERTED IN `tests/selfcheck.py`, DELIBERATELY. A check that the current version has a
# tag goes red on the bump commit itself -- before anybody can tag it, since the tag names
# that commit -- so the suite would fail during the one operation it exists to police, and
# the way to get a green run would be to stop bumping. It is the shape of the `FW003` and
# `--adopt` deadlock two notes down, where pinning made adopting impossible.
# 2.8.0 -> 2.8.1. Three bugs in checks two days old, found by probing them: `terms`,
# `commitments` and `risks` written as a list took the validator down with an
# `AttributeError` and nothing at all was reported; `REF005` exempted every heading in the
# glossary instead of only its sections, which handed back the hole `terms:` was added to
# close; `REG010` read a `#` comment inside a fenced block as a heading.
# 2.8.1 -> 2.9.0. DECLARED AND WITHDRAWN: it existed for the eleven minutes between two
# commits and never left as a release: what it carried shipped as 2.8.2, for the reason in
# the note below. The note stays because the number is in the history of this file, and every
# version this framework has declared has to stay reconstructible -- including one that was
# a mistake, since the tool that rebuilds a validator does not know which is which.
#
# 2.8.1 -> 2.8.2. BY THE RULE ABOVE THIS SHOULD HAVE BEEN A MINOR. `XP006` is a check that
# arrived, which is what MINOR is for. It is a patch here deliberately: the model has moved
# nine times in three days, every move driven by one repository meeting it, and a consumer
# cannot pin against that. The minor stays where it is until the freeze ends, and what
# arrived is written here, which is the only place it was ever written.
#
# WHAT THAT COSTS, SO THAT NOBODY DISCOVERS IT INSTEAD. `FW001` is silent on a patch, so a
# project running this validator gets `XP006` findings with no version saying the rules moved.
# The finding itself is legible -- it names the field and what depends on it -- but the signal
# that would have told a team "this is new, you did not break it" is not there. That trade is
# taken knowingly: during a freeze, being able to trust the number is worth more than being
# told about each check, and every bump here carries a note saying what came with it.
#
# What came with this one: `XP006` at `warn`, a commitment that names no products. And three
# silent holes closed beside it -- `[all]` on a commitment was read as a product called
# `all`, so a promise about the whole suite bound nothing; `LC005` tested for midnight and
# was blind to `00:00` and to any value carrying seconds, which is the shape a script writes;
# `REG010` knew backtick fences and not tilde ones.
# 2.8.2 -> 2.8.3. Four faults in what arrived with 2.8.0, found by probing the new surface.
# The worst: the pull request template ships `no-chg: typo in a comment` inside an HTML
# comment as the instruction for writing one, so a pull request that kept the template
# matched the exemption and `PR001` was off in every repository using the template it comes
# with. `FW003` refused an uppercase hash git resolves, and told a pin that was never true
# that the checkout had moved. `PR004` claimed a version had not moved when all it read was
# whether the file was in the diff.
# 2.8.3 -> 2.8.4. Two more from the same hunt, both where the framework meets CI rather
# than a document. `FW003` told a shallow checkout that its pin had never been true --
# `actions/checkout` clones one commit, so almost nothing is present and the confident
# message was the wrong one. And the workflow wrote the pull request body with `printf %b`,
# which expands escapes in text somebody else wrote: a body carrying `\c` loses everything
# after it, including the line naming the contract.
# 2.8.4 -> 2.8.5. Pinning made adopting impossible, which is a deadlock aimed exactly at the
# projects taking this framework most seriously. `FW003` is what a pin produces the moment the
# framework moves past it; it counted as migration work; `--adopt` refuses while migration
# work is outstanding; and the only thing that clears `FW003` is `--adopt` writing the pin. So
# the way out was to delete the pin -- the field's own purpose, undone by the tool that exists
# to move it. `FW003` joins the two findings `--adopt` clears by writing a number.
# 2.8.5 -> 2.8.6. `supersedes` is declared. It was read by the validator and written in a
# template for weeks and was in no schema, so `supersedes: 12` and `supersedes: {id: DEC-004}`
# were as legal as the thing anybody meant. `id_fields` on a type generates the shape --
# absent, one id, or several, with the id pattern -- and it is declared on all seven types
# whose `status` can reach `superseded`.
#
# STRICTLY THIS IS A MAJOR AND IT SHIPS AS A PATCH, which is the freeze talking. It narrows
# what validates: a document carrying a `supersedes` of the wrong shape used to pass and now
# does not. What breaks is exactly that -- a number, a map, a malformed id, a list with a
# duplicate or an empty one. `null`, one id, several ids and the `NNN` of a template all stay
# legal, and in the one repository written against this framework all nineteen decisions
# carry `supersedes: null` and are unaffected.
#
# It types the value and not the key. No type here closes `additionalProperties`, because real
# front matter carries `approvers`, `classification`, `icg` and others nobody should have to
# enumerate -- so `supercedes:` spelled wrong is still an unknown field that nothing reports.
# 2.8.6 -> 2.8.7. `FM006` at `warn`: a front matter key one letter from one that is read.
# Declaring `supersedes` in 2.8.6 typed its value and not its name, and an unknown key is
# silence -- the document validates, every check reading the real field sees nothing, and the
# line sits in the file looking right. It catches `supercedes` for `supersedes`, `owner` for
# `owners`, `product` for `products`, and the vocabulary is the framework's rather than one
# type's: `products` is declared on the manifest, so with a single decision in a repository
# `product:` used to be one edit from nothing.
#
# 2.8.7 -> 2.8.8. Three changes to the registry, and the third is the only one in the whole
# freeze that asks an adopting repository to edit a document.
#
# `derives_from` is declared, on the eight types that carry it. Same case as `supersedes` in
# 2.8.6, item for item: read by the validator in seven places, written for weeks, in no
# schema, so `derives_from: 12` was as legal as the thing anybody meant. `may_be_empty` and
# `id_forms` are new and they *widen* what validates -- `derives_from: []` is a statement on a
# decision that closes no register entry, and `ING-C03` is a real identifier the general form
# could not express. Neither breaks anything: verified against the one repository written
# against this framework, zero documents change.
#
# THE THIRD ONE BREAKS A LINE THAT WAS CORRECT, AND IT IS THE ONLY ONE OF THE FIVE PATCHES
# SHIPPED UNDER THE FREEZE THAT DOES. `decided_in` becomes a list, on `operational-stack` as
# well as on the `risk-register` that needed it, because `tests/selfcheck.py` enforces one
# shape per field name across the whole framework -- a snippet copied from a template must
# not produce an `FM002` in somebody's project, which is what `depends_on` and `used_by`
# already cost once. Widening on `STACK` rather than narrowing on `RSK` is the choice on the
# merits: a tool can be ratified by more than one decision, as a risk row can follow from
# more than one.
#
# WHAT TO CHANGE, WITHOUT OPENING THE SCHEMA. In `STACK.md`, every stack entry that carries
# the field:
#
#     decided_in: DEC-004        ->   decided_in: [DEC-004]
#
# Grep for `decided_in:` and bracket every scalar value. `null` and an absent field stay
# legal. Nothing in the report will point you here: the finding is an `FM002` saying a row
# has the wrong type, not a line saying a field changed shape.
#
# The count that makes this a patch rather than a major: in the one repository written
# against this framework, ZERO stack entries carry `decided_in` -- it is named there only in
# prose -- and the two occurrences in `templates/STACK.md` are fixed in this same change. If
# yours carries the field, this is one edit per entry and it is the whole migration.

# 2.8.8 -> 2.8.9. This is 2.8.8 finished. That change declared `decided_in` a list and told an
# adopting repository to bracket every value it had written. The one check that reads the
# field, `STK001`, kept reading the raw value and reached it through `in` against a set of
# decision ids -- and a set hashes its operand, so a list raises `TypeError` inside `main()`.
# Not a finding: a traceback, no report at all, and `--emit-index` with it, since the index,
# the traceability matrix, the open register section and the per-product views are generated
# through that same entry point. A repository that followed the migration note above lost the
# gate and the generator on the first row it wrote.
#
# It stayed invisible for the reason it was allowed to be a patch. Zero stack entries carried
# the field, so nothing in any repository exercised it -- and `tests/selfcheck.py` exercised
# it seven times, in the scalar shape the schema had just stopped allowing. A test that writes
# a field in a form no document may carry is not testing that field. The fixtures are
# bracketed now, one of them names two decisions, and one keeps the pre-2.8.8 scalar to hold
# the other half of the contract: a document caught mid-migration gets an `FM002` and never a
# traceback.
#
# The fix is the idiom that was already in the function, two blocks below on `used_by`:
# `as_list`, then one membership test per id, and a non-string skipped rather than hashed. It
# widens nothing and narrows nothing. No document changes, in this repository or any other.
# 2.8.9 -> 2.8.10. `XP007` at `warn`, and the paragraph in `ICG` §3 that it exists to make
# honest. Both are one change and it is about who an impossible promise is allowed to stop.
#
# The `ICG` stops a triage on a candidate that contradicts a `CMT`, which is right and was
# unscoped: it said `CMT` and not "a promise still standing". In a company that sells before
# it builds -- the case this framework opens by naming -- a small share of what the decks
# promised was never buildable, and every one of those rows sat in the register reading
# exactly like a signed contract. So the same candidates got stopped in every cycle, for a
# call that has to be made once, and stopping them never made any promise more possible.
# `ICG` §3 and `cycle` Step 2 now say which rows stop a classification: the ones still
# standing, issued and not written off. `not-yet-issued` was said to nobody; `renegotiated`
# and `met` are closed conversations; and `unsatisfiable`, or a `feasibility` of
# `out-of-reach`, is a promise this project has already judged it will not deliver -- owed a
# conversation with whoever received it, and not a boundary on the build. Those get cited,
# with the risk that owns the exposure, and the candidate gets classified.
#
# THE CHECK IS WHAT MAKES THAT SAFE TO WRITE, WHICH IS WHY THEY SHIP TOGETHER. A carve-out
# for written-off rows makes `out-of-reach` the cheapest way to take a promise out of the
# triage's attention, and out of everybody's -- the customer still planning around it.
# `XP007` reports a commitment that is `out-of-reach` or `unsatisfiable` and that no live
# risk names: `COMMITMENTS.md` §Owed a conversation asked as a question a script can ask.
# Not "is it mitigated", because the remedy is a conversation and not a mitigation, but who
# is answerable for it until that conversation happens. `closed` and `expired` risks are not
# owners, the same pair `REF006` excludes. `feasibility` was declared in 2.5.0 and until now
# no check read it.
#
# What an adopting repository sees: nothing stops validating, and one new `warn` per promise
# that is out of reach with no risk naming it. The repair is a row in the risk register of a
# product it binds with `commitment: CMT-NNN`, which two other documents already ask for
# -- `RSK.md` calls an out of reach commitment the biggest risk in the project, and the
# `requirement` skill's cascade opens that row -- or `status: renegotiated` once the
# conversation has happened. The second pass of `audit` keeps the half no check reaches: is
# the `OPEN.md` entry there, does the risk say something true, was the call actually made.
# 2.8.10 -> 2.8.11. A seventh skill, `business`, and one line in `scan.skip_dirs` so that
# what it writes is legal in a repository. The skill produces a weekly business SAL; no type,
# field or check moves.
#
# WHAT IT ANSWERS, WHICH IS THE QUESTION `FRAMEWORK.md` §1 puts to every proposal. What the
# product is, what changed, where it is going, which challenges matter and what non-development
# actors must do -- written for weekly steering rather than engineering. `PBR` says what a product is, `REL` what changed in one
# release, `RMP` in what order, `product.index.yaml` composes them for machines, and every one
# of them is addressed to a reader who can check it. The market cannot: it acts on the document
# and repeats it, which is why the register is commercial and why a commitment appears in it as
# a claim with an exposure and never as a capability. The suite had it worse: at the root there
# are four registers and no business status view at all.
#
# IT IS A SKILL AND NOT A TYPE, AND THE DIRECTORY IS THE INTERESTING HALF. Every fact in the
# document is a retelling of one that lives in an artifact, so storing it as a source would
# be the single principle broken in the one document nobody in the team rereads. It is a
# dated snapshot -- `_meta/business/SAL-NNN-<product>-YYYY-MM-DD.md`, never edited once
# written -- and the series answers something no artifact does: what the business could see
# at each checkpoint. It has no owner: its sources retain theirs. The exclusion is a path and not a bare `business`, for the reason `extract`
# already carries: a project may keep a directory of that name for artifacts of its own.
#
# What an adopting repository does: nothing. No document changes, no field is required, and a
# project that never invokes the skill never grows the directory. The one thing to know is
# that a file under `_meta/business/` is not validated by anything -- which is the trade the
# choice makes, and the skill carries the rules the schema would otherwise have carried.
# 2.8.11 -> 3.0.0. TWO FORMAT BREAKS ON DOCUMENTS, ONE BUMP, ONE NOTE. MAJOR by the rule at
# the top of this file: documents that validated stop validating. They ship together because
# they are the same mistake seen twice -- a fact written in two places, and a reference that
# does not say enough to resolve -- and because a project should be asked to migrate once.
#
# ONE · THE MAP IS THE ONLY SOURCE FOR THE FIELDS IT CARRIES. `OPEN.md`, `RSK.md` and
# `COMMITMENTS.md` each carried a map in front matter and repeated its fields in the body: a
# risk's category, likelihood, impact and state were in `risks:` and in the columns of
# §state, a commitment's status, feasibility, products and recipient were in `commitments:`
# and in its body table. The body keeps what the map does not hold -- the risk itself, the
# mitigation, the owner, the words the promise was made in, who said it and what it would
# take to build -- and nothing else.
#
# NOT A CHECK THAT THE TWO HALVES AGREE, WHICH IS WHAT WAS PROPOSED AND IS THE WRONG REPAIR.
# The framework's own rule is that a fact has one authoritative place; a check comparing two
# copies accepts the duplication and polices it forever. It also failed in the direction
# nobody looks: `risks: {}` with a full §state table validated clean, every join that reads
# the map went quiet, `XP005` was satisfied because the *file* existed, and the second pass
# of `audit` enumerates from what is generated -- which comes from the map -- so the semantic
# reading was looking at the empty half too. The template had already made this move for one
# field, and said so: "The default itself is a field in `entries:` above, not a line here".
# This is that sentence applied to the rest of them.
#
# `REG015` is what is left of the comparison, and it is deliberately small: the same set of
# ids in the map and in the body, both directions, nothing about the fields. A row in one
# half and not the other is a row somebody half-wrote; the fields cannot disagree any more
# because they are not in two places. `REG004` now reports an absent map on all three
# registers rather than on the open register alone, and `XP005` asks whether a risk register
# says anything rather than whether the file is there.
#
# On the one field where the duplication was left: §1 of an open register groups entries
# under `## Cost to reverse HIGH | MEDIUM | LOW`, which repeats `cost_to_reverse`. The
# heading is navigation and the reading order of the document, and the generated §5 at the
# root is the composed view of the same field across three registers. Removing it would
# leave §1 an unordered list to solve a duplication nobody has ever got wrong. The templates
# now say which of the two a check reads.
#
# TWO · A REFERENCE TO A PER-PRODUCT IDENTIFIER NAMES THE PRODUCT. `atlas:SIG-041`, and a
# bare `SIG-041` in an `id_fields` field stops validating -- `FM002`, at the schema, because
# the reference pattern and the declaration pattern are two patterns now and only the first
# one narrowed. `REF007` reports the qualifier naming a product the repository does not have,
# and `REF008` the qualifier naming a product the referencing document does not declare in
# `products:`. See `qualified_reference_prefixes` for why the list is two prefixes and not
# every per-product register, and for why declarations stay bare.
#
# WHY NOW AND NOT AFTER THE FIRST REAL PROJECT, WHICH IS THE ONLY REASON THIS IS A GOOD
# TRADE. A semantic break costs what the installed base costs, and today that is zero. The
# same change made after a project outside this repository has written its documents is the
# same change made against somebody. `CHG` also gains `id_fields: [derives_from]`, which it
# should have had since `CHG001` started reading the field.
#
# What an adopting repository does, in this order. `migrate.py` splits its findings into the
# ones the move created and the ones that were already there; it does not rewrite documents,
# and it is not going to for either of these. The column removal is mechanical but the
# framework does not have tools that edit bodies. The reference qualification cannot be
# automated where it matters: a `CHG` under `products/atlas/` could have its product read off
# the path, but a `DEC` at the root naming `SIG-041` does not say which product's signal it
# is, and that missing information is precisely what this change adds. Guessing it would
# write the ambiguity down as a fact.
# 3.0.0 -> 3.0.1. TWO DESCRIPTIONS, AND THE NUMBER THEY INVALIDATE. `requirement` and
# `cycle` say more accurately what they already did; no document changes, no field moves, no
# check arrives, so it is a PATCH by the rule at the top -- and MINOR is suspended anyway.
#
# WHAT IT COSTS, WHICH IS THE HALF THAT IS EASY TO LEAVE OUT. Triggering depends on the
# `description:` fields and on nothing else, so `evals/README.md` says in as many words that
# a version moving a description makes its table stop meaning anything. The 114 of 118
# measured on 08-27 was frozen *before* this edit for exactly that reason: it is the
# measurement of 3.0.0 and it does not carry forward. Always-on cost went from ~2,076 to
# ~2,271 tokens per session, which every project pays on every session whether or not a
# skill fires.
#
# WHY THESE TWO AND NOT THE THIRD. Four cases missed in that run and `--runs 5` returned 0 of
# 5 on each, so they are stable misses and not noise -- four descriptions to look at rather
# than four coins. Three of them were description gaps: raising a threshold in an `EVP` is a
# new value for something already recorded and was in no sentence here; the parking lot of
# `OPEN.md` is a documented destination of `requirement` that its description never named;
# and `cycle` claimed "work about to start on something that is not already an approved CHG"
# in its last sentence while carrying no trigger phrase in the shape somebody actually uses
# to say it.
#
# The fourth is not fixed and must not be. *abbiamo avuto un incidente stanotte, l'accuracy
# e' crollata, dobbiamo tornare alla 1.6* is labelled `expect: release` on the reasoning that
# rollback is release's other half -- and `skills/release/SKILL.md` says the opposite about
# itself: "Rollback only exists after a deployment, when regressions show up in production,
# and that path re-enters through `LOG` and change intake". `PROCESSES.md` P-09 routes an
# incident the same way. The label contradicts the skill it measures, so widening the
# description to make the case pass would be adapting the instrument to the result. It stays,
# and the reason is written next to it in `evals/README.md`.
# 3.0.1 -> 3.0.2. `REG016`, and the fixtures it caught first. A check at `warn` and no
# document changes, so PATCH; MINOR is suspended anyway.
#
# It reports a field of the map written as a label in the body again -- `- **Trigger:** ...`
# under an entry, the shape 3.0.0 removed from the templates. The vocabulary is derived from
# `maps.<field>.fields` rather than listed in the code, so the next field to move is covered
# on the day it moves.
#
# WHAT IT DOES NOT DO, WHICH IS WRITTEN BESIDE THE CHECK AND REPEATED HERE BECAUSE IT IS THE
# PART THAT GETS FORGOTTEN. It matches the label, never the meaning: the same fact written as
# a sentence is invisible to it, and a register keeping its labels in another language passes.
# A repository with no `REG016` findings has not re-created the duplication in the shape the
# templates used to have. It is not a repository whose bodies carry no field the map owns.
#
# The first thing it found was this repository. Nine fixtures still wrote those bullets --
# `audit/clean-repo`, whose whole description is that anything reported in it is invented,
# among them -- because 3.0.0 migrated the templates and left the fixtures on the old shape.
# The values were already in the maps; what came out were the duplicate halves.
# 3.0.2 -> 3.0.3. `REG015` READS `inline_id_declarations`, WHICH WAS ALREADY THERE. A check
# that reports less, and no document changes, so PATCH; MINOR is suspended anyway.
#
# `body_ids` harvested every identifier in the first cell of every table row of a register's
# body and compared the lot against the map. A register that argues in tables -- one row per
# decision, the id in the first cell -- had every citation read as a half-written entry: in
# one repository three open registers reported twenty-two ids and ten were `DEC` numbers,
# which `entries:` is schema-forbidden to hold. This key has said which prefixes each register
# *defines* since before that check existed, and said in its own comment why the second half
# is the part that matters. Nothing read it.
#
# WHAT IT COSTS, AND IT IS THE HALF THAT GETS LEFT OUT. A mistyped prefix goes quiet: a
# heading written `DEC-083` where `OD-083` was meant was reported and is not any more. It
# bites only when the mistyped id exists, because otherwise the reference checks catch it
# dangling. Both costs are written beside the filter too, which is where somebody widening it
# will be standing.
# 3.0.3 -> 3.1.0. A PLACE WHERE A PROJECT SAYS "I LOOKED AT THIS FINDING AND DECIDED",
# and the end of the MINOR freeze. Nothing stops validating and nothing is required, so no
# repository has to do anything about this: a project that writes no file sees exactly what
# it saw before.
#
# WHY THIS IS A MINOR AND NOT THE FOURTH PATCH IN A ROW. The freeze was declared at 2.8.2
# with a reason that is a measurable quantity: the model had moved nine times in three days,
# every move driven by one repository meeting it, and a consumer cannot pin against that.
# Counted from this file's own history, the twenty version declarations of 19-21 August are
# about 6.7 a day; the five between 23 August and today are about 0.4. The condition the
# freeze names is fifteen times further away than when it was written, so it stops here.
#
# The bounded version of the complaint, because the unbounded one would be untrue: MAJOR
# went on working throughout, and 3.0.0 said what it had to say. What the freeze collapsed
# is the distinction between "something arrived" and "nothing moved", and three releases in
# a row landed in it -- an always-on token cost, a check that arrived, a check that reports
# less -- each one a thing a consumer should have been told and was not.
#
# WHAT ARRIVED. `.framework/expected-findings.yaml`, read by the validator, one entry per
# finding, `code`, `path`, `reason` and `clears_when` all four required. It is the shape a
# real project converged on before the framework had one, and it is adopted rather than
# redesigned. `clears_when` is an event and not a date, in the same form and for the same
# reason as `trigger` on an open entry: a date written on something undecided is read as a
# promise by whoever finds it next.
#
# The validator reads it, and that is the decision rather than a detail. `--adopt` reading
# it would have unblocked the migration and left the annotation visible only inside the
# command that runs least often of all; read here, it reaches CI, the report a person reads,
# `--adopt` and anything written later, because they all read one report. It is also the
# only arrangement in which a stale annotation can be caught at all, since deciding that an
# annotation matches nothing needs the current set of findings, which is this file's job.
#
# WHY IT IS NOT A LIST OF EXEMPTIONS WITH A BETTER NAME. `AN001`: an annotation matching no
# finding is an `error`. That is the whole guard, and it is an error rather than a warning
# because the file is load-bearing on every run now and not only during a migration. `AN002`
# refuses an annotation on a finding at `error` level, loudly rather than by ignoring it: an
# error that can be explained away stops being an error, and a project that thinks it has
# annotated one would find out only when the gate stayed red. `AN003` is the opposite guard
# and it is opt-in: `require_all: true` beside `expected:` makes every unannotated warning an
# error. Permissive is the default, because a repository is allowed to have warnings nobody
# has ruled on yet -- and the report states the count either way, so the default hides
# nothing and turning the strict form on is a decision rather than a discovery.
#
# The three are `error` in a catalog whose rule is that almost everything starts at `warn`,
# for the reason `PR001` to `PR003` are: they cannot fire in a repository that has not opted
# in by writing the file, so no pipeline that exists today can start failing because of them.
#
# WHERE THE FILE SITS, WHICH WAS FORCED AND NOT CHOSEN. `migrate.py` reconstructs the
# validator of the declared version out of this repository's history, so that validator can
# never be changed: an annotation has to be readable by the new tooling and invisible to
# every validator already released. A key in `framework.yaml` exits on the unknown key and
# takes the whole comparison with it; a field on a register entry is an `FM002`, which is an
# error, because the entry schema is closed; a new artifact type is an `FM003` on every run.
# A hidden path is the only slot with the property, and it has it by construction.
#
# `.claude/expected-findings.yaml` is read for this version only, because that is where the
# first project had to put it, and the line saying to move it goes to stderr rather than
# being decided in silence. When both exist the new path wins. Removed in 3.2.0.
#
# WHAT THE OUTPUT DOES NOT DO. An accepted finding keeps `level: "warn"` and gains a key
# beside it; it is never reclassified and never leaves `findings`. A project checking its
# own warnings keys on `level`, so moving them would take that check out of service without
# a word. The counts arrive as new keys for the same reason.
#
# ALSO HERE, AND IT IS THE OTHER HALF OF THE SAME CIRCULARITY. Both entry points now say on
# stderr, before scanning anything, that the checkout has moved away from the commit the
# project pins. `FW003` already reported it, at the end of a report that a project whose gate
# refuses to start never reaches -- and what makes that gate refuse is the divergence itself.
# The check was inside the thing that stops running. The line is not a second check: it is
# the same fact, said where it cannot be swallowed, and it is silent in exactly the cases
# `FW003` is silent in.
# 3.1.0 -> 3.2.0. WHAT A MODEL DOES WHEN NO VALUE OF A VOCABULARY IS TRUE, ANSWERED TWICE
# BECAUSE THE QUESTION HAS TWO ANSWERS. MINOR: nothing stops validating, nothing becomes
# required, and a repository that writes neither of the two things below sees what it saw.
#
# The note on closed vocabularies further up describes this failure and, until now, left it
# without a repair: faced with a field no value of which is true, the careful writer omits it,
# and the omission is the honest thing to write and the most invisible one, indistinguishable
# from never having looked. Two cases arrived from two different registers within a week of
# each other, and they turned out not to be the same case.
#
# ONE - `products: [none]`, WHICH COMPLETES A LIST THIS FILE HAD ALREADY WRITTEN. The note
# names four flavours of the missing value: "not decided, not measurable, not applicable, not
# ours". Three had a value. `not ours` did not, and it is the entry whose subject is the
# repository itself or the tooling the repository is checked with. That entry binds no
# product and never will. Written `[all]` it says something untrue in the field almost
# everything joins on; written as an absence it says the thing `REG011` exists to remove.
#
# This is not a value invented from one row, which is the move this file spends its notes
# warning against: it is the fourth item of an enumeration that was already here, and the
# argument for it did not come from the case that raised it. The case that raised it is gone
# -- that repository no longer exists -- and the class is not: two of the defects found in the
# audit that produced this version are defects of a skill rather than of the validator, so
# they produce no finding, so `.framework/expected-findings.yaml` cannot hold them, and a
# known issue is where they belong.
#
# `binds()` reads it before anything else, so such an entry appears under no product heading
# and in no product's derived view, and the generated union grows a section of its own for
# them. Without that section the entry would validate, satisfy every check, and be absent
# from the only composed view of what is open, which is the same disappearance `REG011` was
# added to stop, arrived from the other side. `XP008` reports a product actually named `all`
# or `none`, at `warn`. On a commitment `[none]` is not an answer and `XP006` says so: an open
# question can be about the tooling, a promise binding no product was made to nobody about
# nothing.
#
# TWO - `unanswerable` ON A RECORD OF ANY MAP, WHICH IS THE OTHER CASE AND NOT THE SAME ONE.
# A commitments register carried three fields left empty on purpose, because the honest
# assessment was composite -- eleven capabilities each buildable alone and not as a set until
# somebody decides the scope, so every value of `feasibility` is false on one half of it. That
# field is not unanswerable for ever: it becomes answerable the day the scope is decided.
#
#     CMT-007:
#       to: ...
#       status: open
#       unanswerable:
#         feasibility:
#           reason: >
#             each capability is buildable alone and the eleven together are not.
#           settled_by: >
#             the decision on the scope.
#
# Both keys required. `reason` without `settled_by` is a permanent exemption with a paragraph;
# `settled_by` without `reason` is a condition nobody can weigh. Only fields the map declares,
# and never a required one: a required field is one this file has decided every row can
# answer, and a row that genuinely cannot is an argument about the vocabulary that belongs up
# here where it changes the model for everybody. `UNA002` reports both misuses, `UNA003` a
# date where an event belongs, for the reason `REG009` gives one field over.
#
# `UNA001` is the guard and it is the half that makes this safe to ship: a field declared
# unanswerable and filled in anyway is the declaration outliving its own state. It is `error`,
# like `AN001` and for the same reason. And the limit is stated rather than hidden: whether
# the event in `settled_by` has happened is not a thing a script can know, so what is checked
# is the document contradicting its own declaration, which is what a stale one looks like from
# outside once somebody has answered the field and left the paragraph behind.
#
# THE CRITERION IS IN ONE PLACE AND IT IS NOT IN THIS NOTE: it sits beside the vocabularies it
# governs, under the note on what closed lists leave out. If there is an event after which the
# field would have a true value it is `unanswerable`; if there is none it is a value that
# names the state. The test is whether `settled_by` can be filled in without inventing an
# event.
#
# BOTH ARE COUNTED IN THE REPORT, for the reason the annotation count is: a field left empty
# on purpose is invisible by construction, so the number is what tells a reader whether this
# repository has any and that the mechanism exists at all.
#
# A RULE ABOUT ADOPTING, GENERAL AND NOT ABOUT THIS VERSION. This is the second time in two
# versions that the same constraint has decided a design, so it is written here as a rule
# rather than as a warning about one change:
#
#     ADOPT THE VERSION FIRST, WRITE THE NEW FIELD AFTERWARDS. NEVER THE REVERSE.
#
# A record's schema is closed. Any key this file adds is, to every validator already released,
# a front matter error -- `FM002`, which blocks -- and `ci/pull-request.yml` tells a project to
# pin its checks to the version it declares. A project that writes `unanswerable` before
# adopting turns its own gate red on the edit meant to improve its documents. `migrate.py`
# files those under GONE, so they never block the migration itself, and the working order is
# still the one above.
#
# ALSO HERE: `.claude/expected-findings.yaml` IS NOT READ ANY MORE. `3.1.0` read it and wrote
# down that this version would stop, and a note that says when something ends is a promise or
# it is decoration. What does not end is saying so: the path stops being read and does not
# stop being reported, because a file sitting there doing nothing is exactly the state that
# gets discovered six months later. The one repository that ever needed the old path is gone.
# 3.2.0 -> 3.2.1. `XP008` says what it costs instead of saying that the name is reserved. A
# message, so a PATCH: no check arrives, no field moves, no document changes.
#
# The check is `warn` by a deliberate choice -- a repository with a product called `all` or
# `none` validates today and turning a name into an illegal state is a migration asked for in
# exchange for a collision nobody has had -- and that choice puts the whole weight on the
# sentence. Measured on a repository with a product called `none` and a root entry naming it:
# the product gets no heading at all in the generated union, and its own `open_decisions`
# comes back empty while the entry that named it is filed under the ones that bind nothing.
# That is a silent disappearance, not an ambiguity, and the first message said "reserved
# word" and stopped. Somebody reading it decides whether the name is worth keeping, and they
# cannot decide that from a fact about vocabulary.
version: "3.2.1"

# ON EVERY CLOSED VOCABULARY IN THIS FILE, AND THE VALUE THAT KEEPS GETTING LEFT OUT.
# Three enums were extended on the same day, and the omissions were not random: every one of
# them was on the axis of "we do not know yet". A risk category with no `security` and no
# `organisational`; a feasibility scale with three degrees of difficulty and no way to say
# the design does not exist yet; a likelihood whose maximum was `high` in a register holding
# a divergence that had already happened.
#
# The failure mode is the same each time and it is quiet. Faced with a vocabulary that has no
# true value, a careful person omits the field -- which is the honest thing to write and the
# most invisible: an omitted `likelihood` drops the row out of every ordering that reads one,
# an omitted `feasibility` makes a promise look unexamined rather than unexaminable. The
# careless answer is worse and more likely: pick the nearest value, and the register now says
# something false that nothing will ever contradict.
#
# So when adding or reviewing a vocabulary here: write down what the answer is on the day the
# question is first asked, before anybody has done the work. If that answer is not in the
# list, the list is not finished, and the missing value is almost always some form of "not
# yet" -- not decided, not measurable, not applicable, not ours.
#
# AND WHICH OF THE TWO REPAIRS TO REACH FOR, BECAUSE FROM 3.2.0 THERE ARE TWO AND CHOOSING
# BETWEEN THEM AT RANDOM IS HOW ONE FACT ENDS UP WITH TWO SPELLINGS.
#
#   THE CRITERION, IN ONE LINE. If there is an event after which the field would have a true
#   value, it is `unanswerable`. If there is none, it is a value that names the state.
#
# They are not two ways of saying one thing, and the difference is not a matter of taste:
#
#   a value that names the state       says NEVER. `products: [none]` on an entry whose
#                                      subject is the repository or the tooling it is checked
#                                      with; `commitment: none` on a risk that is not about a
#                                      promise; `[unregistered]`, `not-applicable`. It carries
#                                      no condition because there is no condition: nothing
#                                      will happen that makes that entry bind a product.
#
#   `unanswerable` on the record       says NOT YET, and names the event. The case that
#                                      produced it: eleven promised capabilities, each
#                                      buildable alone and not as a set until somebody
#                                      decides the scope, so every value of `feasibility` is
#                                      false on one half of the judgement. That field becomes
#                                      answerable the day the scope is decided, and
#                                      `settled_by` is where that day is named.
#
# The test that separates them is whether `settled_by` can be filled in honestly. If writing
# it means inventing an event, the answer is not `unanswerable`: the vocabulary is short a
# value, and the list above is not finished after all.
#
# `UNA001` is what keeps the second from becoming a permit not to answer -- a field declared
# unanswerable and filled in anyway is the declaration outliving its own state -- and no check
# can do more, because whether an event has happened is not a thing a script knows.

lifecycles: [living, immutable, append-only]

# Required in the front matter of every artifact, whatever its type.
#
# ON `created`. The templates write it to the minute, like `last_review`. No check enforces
# that and none is added here: a repository written before this carries dates, and turning
# on a check that reddens correct documents is how a validator stops being read. It is a
# consistency the templates ask for, not a rule. Two timestamps in the same front matter
# with different precision invite the reader to wonder which one is approximate.
base_required: [schema, artifact_type, lifecycle, status, owners, created]

# ON `generated`. A type marked `generated: true` is written by a tool and not by a
# person, and it swaps `owners` for `generated_by`, which names the tool. The swap is the
# whole point. `owners` on a file nobody wrote is fiction, and a field naming somebody to
# ask is worse than an absent one when the honest answer is "nobody, it was regenerated".
# `generated_by` says something true instead, and says the thing an agent needs before it
# starts editing: do not edit this, regenerate it.
#
# `release-manifest` is the only one today. `decisions/INDEX.md` and `TRACEABILITY.md`
# will be next, and they carry no front matter at all right now.

# ON `products`. The value `exactly-one` makes the field required and one element long.
# It is declared only on the two types whose template used to carry `product:` in the
# singular, which said the same thing through a field name rather than through a
# constraint: a release belongs to one product, a manifest describes one product. The
# constraint survived the rename and became checkable. Everywhere else `products` stays
# unconstrained, and that is deliberate rather than an omission: a `DEC` with
# `scope: platform` lists every product there is.

# Values that mean "not filled in". A required field carrying one of these is missing,
# not present: a template placeholder that reaches a real repository reads as a real
# value to anything that does not know the template.
#
# The two lists are enforced in two different places, and the split is not about which
# sentinels matter. It is about where a rule can live.
#
# `enforced` is rejected by the generated schemas, wherever a required field is a plain
# string: `FM002`, which blocks. It cannot hold more than this, because the templates have
# to validate against their own schemas -- they are the thing people copy, and one that
# fails the check it teaches is worse than a permissive pattern -- and every template ships
# `owners: [NAME]` and `created: YYYY-MM-DD HH:MM`.
#
# `other` is reported by `FM004` at `warn`, on repositories only, where `templates/` is not
# looked at. That check exists because the schemas reached none of these: `owners` is a
# list, so `[NAME]` clears `minItems`; `created` carries no format on purpose;
# `derives_from: [PRB-NNN]` is not a reference `REF001` can resolve; a `COMMIT_HASH` inside
# `verified_code` is a map value. The whole day one set validated with an owner who does not
# exist and a document nobody wrote.
placeholders:
  enforced: [COMMIT_HASH, SHA_OF_THE_EVP_FILE]
  other: [NAME, NNN, "YYYY-MM-DD", "YYYY-MM-DD HH:MM", "YYYY-MM-DDTHH:MM:SSZ"]

# The identifier prefixes the framework uses. Not all of them are files, and that is the
# reason this list exists: `SIG`, `ANA` and `INC` live as entries inside a `LOG`, `OD` and
# `KI` inside `OPEN.md`, `CMT` inside `COMMITMENTS.md`, `RSK` inside `RSK.md §state`. A
# reference check that only knew about files would report every single one of them as
# dangling, and a check that cries wolf on correct documents gets turned off within a week.
id_prefixes: [PRB, HYP, EVD, CMP, DFB, SD, DEC, CHG, EVR, REL, RLM, DC,
              SIG, ANA, INC, OD, KI, RSK, CMT, ING, ICG]

# The identifier families that are not `PREFIX-NNN`, written out. `ING-C03` is an ingestion
# contradiction, there are twenty-two of them, and one sits in the `derives_from` of a `DEC`.
# They go here and not into `id_prefixes` because the numeric half of the general form stays
# strict: relaxing it would let typos through, which is the thing the form exists against.
id_forms:
- 'ING-C\d{2,}'

# `id_fields` on a type declares a front matter field that holds an identifier or a list of
# them, and generates the shape: absent, one id, or several. `supersedes` lived for weeks as a
# convention -- read by the validator, written in a template, in no schema -- so `supersedes:
# 12` was as legal as `supersedes: DEC-004`. It is declared on every type whose `status` can
# reach `superseded`, because those are the documents that can be replaced.
#
# It types the value and not the key: no type here closes `additionalProperties`, since real
# front matter carries `approvers`, `classification`, `icg` and others nobody should have to
# enumerate, so `supercedes:` spelled wrong is still an unknown field that nothing reports.

# Types whose body *defines* identifiers instead of only citing them, and which prefixes
# each one defines. The second half is the part that matters. Every one of these registers
# also cites identifiers it does not own, constantly: `OPEN.md` names the `DEC` that closed
# an entry, `LOG.md` names the `CHG` a signal produced, `ING.md` names where each extracted
# claim was routed. Vouching for every identifier printed in a register would mean that
# writing "there is no DEC-999" is enough to make DEC-999 exist, so a dangling reference
# would disappear the moment somebody documented it, which is the one thing the reference
# checks ask you to do.
#
# Append-only types are listed here like the others. Their lifecycle is not enough on its
# own: it says the body accumulates entries, not which identifiers those entries carry.
inline_id_declarations:
  open-register: [OD, KI]
  risk-register: [RSK]
  commitments: [CMT]
  roadmap: [INC]
  signal-log: [SIG, ANA]
  ingestion-register: [ING]

# The prefixes a reference has to qualify with a product: `atlas:SIG-041`, never `SIG-041`.
#
# WHY THIS IS NOT THE WHOLE LIST OF PER-PRODUCT REGISTERS, WHICH IS THE INTERESTING HALF.
# Six families above define identifiers in a register's body, and four of those registers
# exist once per product, so four of them could in principle collide. Only two are on this
# list, and the test that put them there is not where the register lives -- it is whether
# anything ever names one of its identifiers from outside the product that owns it:
#
#   RSK    nothing references a risk. No field in any template or schema names an `RSK-NNN`
#          as a target; `REF006` and `XP007` join promises to risks by reading the map, not
#          by resolving a written reference. Two products numbering their risks from 001 is
#          the ordinary case and there is nothing to disambiguate.
#   INC    referenced only by a `CHG`, which lives in `products/<p>/changes/`. Same product,
#          always, by where both files sit.
#   OD/KI  `REG007` already makes these one sequence across the three registers, and that is
#          deliberate: the three compose into one view at the root ordered by cost to
#          reverse, which is the only place "the most expensive thing still open" exists.
#          Qualifying them would break that composition to solve a collision the check
#          already reports.
#   SIG    `DEC` lives at `decisions/DEC-NNN-slug.md` -- the root -- and its template
#   ANA    prescribes `derives_from: [HYP-NNN, EVD-NNN, SIG-NNN]`. A root document that
#          binds two products, naming a signal that belongs to one of them, by an id and
#          nothing else. This is the case, and it is the prescribed shape rather than an
#          edge one.
#
# So the rule is narrow on purpose: it is not "per-product registers get qualified", it is
# "an identifier that can be named from outside its product gets qualified".
#
# DECLARATIONS STAY BARE. A signal log writes `SIG-041` in its own rows: the file is under
# `products/<p>/`, so the directory already said whose it is, and a register that had to
# repeat the product on every line would be repeating what its own path declares. It is the
# reference that carries the qualifier, because a reference is read somewhere else.
#
# It applies to `id_fields` and not to map keys. An `ICG` keys its `routing` and `impacts`
# maps on the candidates it classified -- signal ids -- and it lives in
# `products/<p>/cycles/`: the candidates are that product's by construction, and asking a
# product's own gate to qualify them is ceremony that buys nothing.
qualified_reference_prefixes: [SIG, ANA]

# What a validator built on this registry should look at.
#
# These are the framework's exclusions and they are a floor, not the whole list. A project
# extends them under `scan:` in its own `framework.yaml`, with these same three keys,
# because the directories a real project keeps its code in are not knowable from here: a
# dbt model, a Kubernetes manifest and a CONTRIBUTING.md are each an `FM001`, and `FM001`
# blocks. It extends and does not replace, for the reason each entry below states.
scan:
  # `corpus` is source material, not an artifact: those are the documents the business
  # handed over, and we cannot correct front matter we did not write. It is matched by bare
  # name because it means the same thing wherever it turns up, including under `_meta/`
  # where the structure now puts it and under `products/<p>/` where older repositories
  # still keep it.
  #
  # `_meta/extract` is the extractor's output, regenerable, and it is written as a path
  # rather than as a name on purpose. `extract` alone would exclude the extraction step of
  # every ETL project that keeps one in a directory of that name, which is the mistake this
  # block already warns about two paragraphs down. `ingest-out` is the name that directory
  # had before and stays here so repositories written against it keep working.
  #
  # `templates` is skipped for a reason worth stating, because it has already cost
  # something: it is why `templates/RLM.yaml` has been missing two base-required fields
  # with nothing noticing. See the note at the bottom of this file.
  # Anything whose name begins with a dot is tooling: `.git`, `.github`, `.venv`,
  # `.gitlab-ci.yml`. No framework artifact is ever hidden, so this is a rule rather than
  # a list, and a list is what it was: the validator reported the CI workflow of this very
  # repository as a document with no front matter, minutes after the workflow was written.
  # A list of exclusions is always one entry behind whatever was added last.
  skip_hidden: true

  # `schemas`, `skills` and `references` hold the framework's own definition and tooling.
  # They are metadata about artifacts, not artifacts, and this file is the proof: run the
  # validator on the framework repository without this line and it reports its own registry
  # as a document with no front matter. `references` earned its place the same way, one
  # commit after the skills were written: the shared preamble and the routing table are
  # prose the framework wrote about itself, and they came back as two blocking `FM001`.
  #
  # `build` is where a generator puts its output, and this repository is why it is named:
  # `evals/fixtures/build/` holds fourteen repositories that are broken on purpose, so a
  # validator run pointed at the framework itself reported thirteen errors and eighty
  # warnings from fixtures that are supposed to have them. A generated output directory
  # holds no source document in any project, which is what makes it safe to name here.
  #
  # `_meta/business` is the `business` skill's output: the weekly SAL for management and
  # cross-functional actors. It is a dated snapshot and not a source -- every fact in
  # it is a retelling of one that lives in an artifact, which is why it is excluded rather
  # than typed. A path and not a bare name, for the reason `extract` carries two paragraphs
  # up: a Data/AI project may perfectly well keep a `business/` directory of its own, and an
  # exclusion that protects the framework's convenience is paid for by everyone using it.

  # `evals` is deliberately NOT here, and was for a day. Excluding it fixed the same
  # symptom by charging every real project a silent exclusion of a directory name a Data/AI
  # project plausibly uses for artifacts of its own. This repository is not a project and
  # is never validated as one: the `FM001` findings a misdirected run still produces from
  # `evals/**/*.yaml` are the correct signal that `--root` is wrong, and the `audit` skill
  # already says a clean report on the wrong repository is worse than an error. An
  # exclusion that protects the framework's convenience is paid for by everyone using it.
  # `.framework` holds what a project writes *for* the framework rather than what the
  # framework asks it to write: today one file, the findings it has examined and left
  # standing. It is hidden, so `skip_hidden` already covers it, and it is named here as
  # well because `skip_hidden: false` is a legal thing for a project to write and would
  # otherwise turn that file into an `FM001`, which is an error, on the very run it exists
  # to inform.
  skip_dirs: [templates, skills, schemas, references, corpus,
              "_meta/extract", "_meta/business", ingest-out,
              build, node_modules, __pycache__, ".framework"]

  # Documents that speak *about* the framework rather than being produced *by* it.
  # `framework.yaml` is the project's own validator configuration: without this line the
  # validator reads its own config as an artifact and reports it for having no front
  # matter, which is the kind of first impression a tool does not recover from.
  #
  # `expected-findings.yaml` is the same case one level down, and it is here rather than
  # only in `skip_dirs` because `load_scan` unions the project's list with this one and
  # never subtracts: a project can add to either key and can remove from neither, so the
  # exclusion holds whatever a project writes under `scan:`. That is the property the file
  # needs, because the validator reads it by an explicit path rather than through the scan,
  # and reading it somewhere else does not stop `discover` from finding it.
  skip_files: [README.md, FRAMEWORK.md, SKILLS.md, INDEX.md, TRACEABILITY.md,
               framework.yaml, product.index.yaml, expected-findings.yaml]

# ON `sections`. A value here is the id of a marker in the body, not a heading:
#
#     <!-- section: what-must-not-change -->
#     ### 2 · What must NOT change
#
# The marker carries the identity, the heading carries the prose. Reword the heading,
# number it differently, translate it, and the check still stands. It is the same split
# the front matter already makes between what a document *is* and what it *says*.
#
# It was not always so, and the reason is worth keeping. The deleted validator matched
# each value as a substring of any heading from level 1 to 3, and its values were the
# Italian headings of the day: "corrente", "stato", "Cosa NON deve cambiare". The
# templates were translated into English in commit acaded9, which would have left every
# section check matching nothing at all. It would not have failed loudly either: a check
# that finds no section and a check that was never written look the same from outside.
# Nobody noticed only because the validator was deleted in that same commit.

# ─────────────────────────────────────────────────────────────────────────────
# The types. Order preserved from the deleted file: initiative immutables first, then
# the platform and product immutables, then the living artifacts, then append-only.
# ─────────────────────────────────────────────────────────────────────────────

types:

  agents-control-plane:
    id: AGENTS
    name: Control plane for agents
    axis: platform
    born_in: day one
    template: templates/AGENTS.md
    path: AGENTS.md
    lifecycle: living
    status: [active]

  open-register:
    id: OPEN
    name: Open decisions and known issues
    axis: platform
    born_in: day one
    path: products/<p>/OPEN.md · platform/OPEN.md · OPEN.md
    template: templates/OPEN.md
    lifecycle: living
    status: [active]
    # Three placements and one rule: an entry lives in the register of the thing it is
    # about. One per product, mandatory, beside the product -- `REG006` -- because the file
    # an agent reads before deciding anything has to be the one beside what it is working
    # on. `platform/OPEN.md` for the substrate, if a substrate was decided. The register at
    # the root for what belongs to no single product, which includes the question of
    # whether to have a substrate at all, and it also carries the parking lot and the
    # generated union of all the others.
    #
    # Scope is read off the directory and not off `products:`, so in a product's register
    # the field is left off and `REG008` reports one that contradicts where it sits. At the
    # root there is no directory to read, so there the field is required and `REG011` reports
    # its absence: an entry with no `products:` binds every product, which is a statement
    # somebody may have meant and is written identically to a question nobody asked.
    # `products: [all]` is that statement -- the reserved word and not a list of every
    # product, because a list means the same thing right up until a product is added, and
    # then it quietly means less.
    #
    # `products: [none]` is the fourth answer and it arrived in 3.2.0, because the field had
    # three positions and the register has four subjects. An entry can be about the
    # repository itself, or about the tooling the repository is checked with, and that entry
    # binds no product and never will: `[all]` said something untrue in the field most things
    # join on, and absence said the thing `REG011` exists to remove. `binds()` reads it, so
    # the entry appears under no product heading and in no product's derived view, and the
    # generated union gives it a section of its own -- without one it would validate, satisfy
    # every check and be missing from the only composed view of what is open.
    #
    # Both are words and not products. `XP008` reports a product actually called `all` or
    # `none`, at `warn`: while one exists every `products:` naming it says two things.
    # Numbering stays one sequence across all three -- `REG007` -- because `depends_on` and
    # the `derives_from` of a `DEC` name an entry by its id and nothing else.
    # `REG002` and `REG003` used to read the body: `### OD-NNN` headings and lines like
    # `- **Cost to reverse:** high`. Rename that label, translate it, or reformat the bullet,
    # and both checks stop working -- reporting nothing, which reads as "no high-cost entry
    # is undecided". The flattering failure again, on the register a person edits by hand
    # more often than any other file here.
    #
    # The fields two checks need are front matter now. The body keeps the prose, because
    # `OPEN.md` is an interview surface: context, alternatives and consequences are what a
    # person reads while deciding, and no field replaces them. This is the `ICG` split for
    # the third time -- the verdict where a check can read it, the argument where a reader
    # can.
    #
    # No fallback parser, and no transition. Nothing runs on this framework yet, so an
    # old-format register does not exist to protect.
    #
    # `body_ids` is what `REG015` compares: the ids the body still carries, against the keys
    # of the map, both directions. Here the body is `### OD-NNN` headings and not a table,
    # and a decided entry is exempt in one direction on purpose -- when a decision is taken
    # the prose leaves §1 for a cross-reference line in §4 while the row stays in the map,
    # which is the one document in the framework that is supposed to get shorter.
    body_ids:
      from: heading
      map: entries
      exempt_status: [decided]
    maps:
      entries:
        # `entries: {}` is legal here and nowhere else. A product must have a register --
        # `REG006` -- and a product may genuinely have nothing open, so refusing the empty
        # map would leave inventing an entry as the only way to satisfy both. It is also a
        # different claim from an absent `entries:`, which `REG004` reports: one says read
        # and nothing found, the other says nobody filled this in.
        may_be_empty: true
        # `OD-` and `KI-` share the register and not the rules for closing. An `OD-` closes
        # on an accepted `DEC` and `REG005` resolves it: a decision nobody can reach is one
        # nobody can revisit. A `KI-` closes on whatever recorded that it was dealt with --
        # a `CHG`, a `SIG`, a commit, a line of the log -- and nothing resolves that field,
        # deliberately. The template used to name three artefacts and the validator never
        # checked any of them, which is a rule in name only; the honest version is that a
        # known issue is not a choice, and asking for a decision record because somebody
        # deleted two files is how a rule gets worked around rather than followed.
        keys: "^(OD|KI)-(\\d{3,}|NNN)$"
        # `trigger` and not `deadline`: the observable event after which the decision
        # can no longer be deferred, which is what forces it. No date belongs in one, in
        # any form and not even beside the event -- `REG009` -- because the entry it sits on
        # is one nobody has decided, and a date written on an undecided thing is read as a
        # promise by whoever finds it next.
        #
        # `decide_with` is the other half of the same idea: two entries that have to be
        # decided in one sitting, which `depends_on` cannot say because it orders them. It
        # belongs on both entries, and no check enforces that -- when only one declares it,
        # nothing here can tell which of the two is the one that is wrong.
        fields:
          required: [status]
          optional: [cost_to_reverse, default_in_force, trigger, closed_by]
          lists: [depends_on, decide_with, products]
          enums:
            status: [open, decided, superseded, parked]
            cost_to_reverse: [high, medium, low]

  commitments:
    id: COMMITMENTS
    name: Commercial commitments made
    axis: platform
    born_in: day one
    template: templates/COMMITMENTS.md
    path: COMMITMENTS.md
    lifecycle: living
    status: [active]
    # THE THIRD REGISTER TO MAKE THIS MOVE, AND FOR THE THIRD TIME THE SAME REASON. The
    # entries of `OPEN.md` and the rows of `STACK.md` are front matter because a check that
    # reads a markdown table is a check that stops working the day somebody reformats one --
    # silently, reporting nothing, which reads as nothing being wrong. Until now nothing
    # here could read a commitment: not which product it binds, not whether it is a promise
    # already made or a sentence in a deck nobody has sent, not whether anything measures
    # it. In a real repository eight commitments were `stated-as-done` on capabilities the
    # same repository says are not built, and no check could say a word.
    #
    # The body keeps the promise in the words that were used, who said it, how binding the
    # literal wording is, and what it would take to build. That is what a person reads
    # before renegotiating, and no field replaces it.
    #
    # From 3.0.0 it keeps *only* that: the recipient, the status, the feasibility and the
    # products were rows of the body table and fields of the map at the same time, and now
    # they are fields only. `body_ids` is the `### CMT-NNN` heading of each entry, which
    # `REG015` compares against the keys of the map.
    body_ids:
      from: heading
      map: commitments
    maps:
      commitments:
        may_be_empty: true
        keys: "^CMT-(\\d{3,}|NNN)$"
        fields:
          required: [to, status]
          optional: [feasibility, threshold, evidence, blocked_by]
          # `products` carries `[all]` here for the same reason it does in the register at
          # the root: a promise about the whole suite is the ordinary kind, and read as a
          # product named `all` it bound nothing. Required in practice rather than in the
          # schema -- `XP006` reports the absence -- because every join downstream of a
          # commitment runs through this field and an empty one still reads as filled in.
          lists: [products]
          enums:
            # ON `feasibility`, AND A DISTINCTION ITS FIVE VALUES CANNOT HOLD. A real
            # register carries a promise that is feasible one at a time and out of reach
            # as a set: eleven capabilities each buildable, the eleven together not,
            # until somebody decides the scope. `feasible-with-reservations` understates
            # it -- that is a boundary, not a reservation; `out-of-reach` overstates it,
            # because each one alone is buildable; and `not-yet-assessable`, which the
            # row carries today, is false: the assessment was made and produced two
            # answers.
            #
            # LEFT AS IT IS RATHER THAN WIDENED, AND THE ROW KEEPS THE WRONG VALUE. A
            # sixth value invented from one row is the move this file spends its notes
            # warning against, and the field is optional, so the body carries the
            # distinction the vocabulary cannot. It is written here so the next register
            # to hit it finds this instead of picking the nearest value -- which is
            # exactly the failure the note on closed vocabularies at the bottom
            # describes, and the one case where that note's own advice does not resolve
            # it: the missing value is not a form of "not yet".
            status: [not-yet-issued, stated-as-done, open, met, renegotiated, unsatisfiable]
            # THE VOCABULARY HAD THREE DEGREES OF DIFFICULTY AND NO WAY TO SAY "NOT YET".
            # This is the register of promises made before the thing was built -- that is
            # the sentence the document opens with -- so the ordinary early state of a row
            # is that nobody can judge it: the design does not exist, or the decision it
            # depends on has not been taken, or the promise as worded cannot be checked at
            # all. Six rows out of sixteen in the first repository to use it, four of them
            # the same state, and the only legal answers were three shades of an assessment
            # nobody had made.
            #
            # `not-applicable` is the other one: a promise with no technical content to
            # assess. Both are legal answers, and `blocked_by` beside them names the entry
            # that has to be decided before the question can be asked at all.
            feasibility: [feasible, feasible-with-reservations, out-of-reach,
                          not-yet-assessable, not-applicable]

  glossary:
    id: GLOSSARY
    name: Glossary and metric dictionary
    axis: platform
    born_in: day one
    template: templates/GLOSSARY.md
    path: GLOSSARY.md
    lifecycle: living
    status: [active]
    # The terms, where something other than a reader can find them. A data contract that
    # sends you to `GLOSSARY §Tenant` for the meaning of a column is a reference like any
    # other, and until this there was no second end to resolve it against: the terms lived
    # in `### ` headings, and `REG002` and `REG003` already went quiet once for being built
    # on headings somebody reworded. The body keeps the definition, the prose and the
    # examples; the map keeps the names.
    #
    # `blocked_by` is the state this framework had no way to write down: a term whose
    # definition is waiting on a decision nobody has taken. Without it the word is simply
    # absent, and a document leaning on it reads as if it were defined somewhere else.
    # `REF005` resolves a citation to a blocked term as found -- the gap is declared, which
    # is the whole difference.
    maps:
      terms:
        may_be_empty: true
        keys: "^\\S.*$"
        fields:
          required: [kind]
          # `kind` unless `blocked_by`. A term can be blocked precisely because nobody knows
          # yet whether it is a metric or a domain concept -- that is one of the things the
          # decision has to settle -- and requiring `kind` there makes the writer choose the
          # thing `blocked_by` exists to avoid choosing. Once the term is defined the kind
          # is known, and then it is required like everywhere else.
          required_unless: {kind: blocked_by}
          optional: [blocked_by]
          enums:
            kind: [domain, metric]

  operational-stack:
    id: STK
    name: Operational stack
    axis: platform
    born_in: the first time a tool is named, which is usually earlier than anybody thinks
    template: templates/STACK.md
    path: STACK.md
    lifecycle: living
    status: [active]
    sections: [chosen, unratified, ruled-out]
    # The fact with no other home: which tool is used for which job, and whether anybody
    # decided it. `ARC#current` describes the system that exists; a `DEC` records one
    # decision and its reasoning. Neither answers the question an agent asks before writing
    # a line of code -- what do we reach for here, and what must I not introduce -- and
    # answering it today means reading every decision in the register.
    #
    # It exists because of what a real corpus turned up. The architecture slide of a sales
    # deck named React, FastAPI, Apache NiFi, Iceberg, S3, LangGraph, Azure OpenAI,
    # Kubernetes and OIDC. Eleven tools, chosen by whoever drew the slide, with no `DEC`
    # behind any of them and nowhere in this framework to say so. `unratified` is that state,
    # and it is the most useful section here: it is `OPEN.md`'s `Default in force` applied
    # to tooling, and naming it is what turns a slide into a decision somebody can take.
    #
    # The map is the checkable half and the body is where the reason goes, the same split
    # the `ICG` uses. A row names the `DEC` that chose it; it does not restate the argument,
    # because the copy is what survives when the decision is revisited.
    maps:
      stack:
        keys: "^[a-z][a-z0-9-]*$"
        fields:
          required: [tool, status]
          optional: [version, note]
          # `decided_in` è una lista, e lo è diventata quando `risk-register` ha avuto
          # bisogno della stessa cosa. Il framework tiene un invariante che non dichiara a
          # parole e fa rispettare in `tests/selfcheck.py`: **un nome di campo, una forma
          # sola**, perché uno snippet copiato da un template produce altrimenti un `FM002`
          # nel progetto di qualcun altro -- è già successo con `depends_on` e `used_by`.
          # Allargare qui invece di restringere là è la scelta nel merito e non un
          # compromesso: uno strumento può essere ratificato da più decisioni, esattamente
          # come una riga di rischio può seguire da più d'una. E si paga adesso che costa
          # due righe di template e una di un solo `STACK.md`: con tre prodotti che ne
          # hanno uno, la stessa scelta si presenterebbe con un costo che spinge verso lo
          # scalare per la ragione sbagliata.
          lists: [used_by, decided_in]
          enums:
            # `dropped` is the state this document could not describe, and every project
            # has some: a tool that was tried, is not in use, and that nobody decided
            # against. `unratified` says the opposite -- in use, nobody chose it -- and
            # `ruled-out` claims a decision, which `STK001` then asks to see. With three
            # values the only way to file an abandoned experiment was to write something
            # false, which is what a real repository did twice.
            status: [chosen, unratified, ruled-out, dropped]

  platform-architecture:
    id: PLATFORM
    name: Architecture of the shared substrate
    axis: platform
    born_in: only if a shared substrate is decided
    template: templates/PLATFORM.md
    path: PLATFORM.md
    lifecycle: living
    status: [active, draft]
    id_fields: [derives_from]
    # The shared substrate. Unlike ARC it is born on day one, before the code exists, so
    # it cannot require `verified_code`.
    #
    # It carries `code:` for the same reason `product.yaml` does, and for one more. A
    # repository that serves several products -- the access layer two of them sign in
    # through, the shared data plane -- has no home in a per-product map. The only two
    # things a project could do were write it into every `product.yaml` that uses it, which
    # is one fact in several files and the divergence this framework exists to prevent, or
    # leave it out, and then neither product knows where its own sign-in lives. This is the
    # third option, and it is the one consistent with the rest: shared things belong to the
    # substrate.
    #
    # A key belongs to exactly one of the two maps. `XP004` reports a repository claimed
    # twice, because the copy is what makes the two descriptions of it drift.
    maps:
      code:
        keys: "^[a-z][a-z0-9._-]*$"
        fields:
          required: [url, contains]
          optional: [path, release_relevant]
          lists: [used_by]

  product-manifest:
    id: product.yaml
    name: Product manifest
    axis: product
    born_in: day one
    template: templates/product.yaml
    path: products/<p>/product.yaml
    class_note: partly generated
    lifecycle: living
    status: [active, draft]
    products: exactly-one

    # Where this product's code actually lives. Documents and code are in one repository
    # in the simple case, and the framework assumed that everywhere: `scan.skip_dirs`
    # exists to exclude code sitting *inside* the documentation root. A project keeping its
    # documentation in its own repository, with the code in several others, had nothing to
    # say so with, and an agent told to read the document and act could read and then not
    # know where to go.
    #
    # Keys are repository names and not framework identifiers, so they get their own
    # pattern. `path` is where it is expected to be checked out, relative to this
    # repository, because an absolute path is true on one machine. `path: .` is the
    # co-located case, and writing it is what separates "the code is here" from "nobody
    # recorded where the code is".
    #
    # `release_relevant` marks a repository whose commit an evaluation is about. It is
    # `release_relevant` marks a repository whose commit an evaluation is about, and
    # `VER002` reads it: an `ARC` or an `EVR` that attests some of the release-relevant
    # repositories and not all of them is reported, because a partial attestation reads
    # exactly like a complete one.
    maps:
      code:
        keys: "^[a-z][a-z0-9._-]*$"
        fields:
          required: [url, contains]
          optional: [path, release_relevant]
          lists: [used_by]

