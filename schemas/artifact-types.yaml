# is not part of this version. It was measured on 19/09/2026 with a graph-on against
# graph-off ablation on one runtime: +17.1% tokens, no additional required source group and
# no different answer in four pairs, agreeing with three model-free measurements. The work
# is archived on the tag product-memory-3.8.1 and was never released. The contracts layer
# and code observation it shares with this version remain, because the contribution gate
# uses them. Do not re-propose the retrieval channel without new evidence.
# 3.7.0 -> 4.0.0. AN ATTESTATION THAT CANNOT BE TRUE IS AN ERROR, AND THE HONEST ONE STOPS
# COSTING A WARNING. MAJOR by the rule at the top of this file, twice over: a check arrives at
# `error` with no opt-in, and a check is retired while another takes its place.
#
# WHAT WAS WRONG. `last_review` attests that a person read a living document and found it still
# true. The two checks that read it looked at collisions between documents (`LC005`, several
# documents on one minute) and at changes after the attestation (`LC006`). Neither looked at the
# other direction: a value later than the commit that carries it, which cannot be the instant
# anybody finished reading. In one repository four living documents were attested with instants
# up to an hour and a half after their own commits, chosen apart from each other so that `LC005`
# stayed quiet, and nothing reported it. Corrected by hand to the commit's own time they collided
# on one minute, and `LC005` fired; the comment saying what each reading had covered changed as
# well, and `LC006` fired. There was no honest way to attest a reading without a warning.
#
# WHAT ARRIVES.
#   `LC007`, `error`. A `last_review` later than the committer date of the commit that introduced
#   the current value of its line, compared at the minute with no tolerance; a value on a line
#   not yet committed is compared with the current time. Timezones: a value written with an
#   offset is an instant; a bare value is read in the offset of that commit, or in this machine's
#   offset when the line is not committed, and the finding says which of the two it used.
#   `review_scope`, an optional field beside `last_review` on every living type: what the reading
#   covered, as a sentence. The attestation block is those two fields and nothing else: `LC006`
#   excludes them from the attested text and counts everything else as text, YAML comments
#   included. `LC003` reports the field on an immutable exactly as it reports `last_review`.
#   `LC008`, `warn`. The note is empty on a document attested after its creation, identical across
#   documents attested in one commit, or unchanged from the previous attestation of the same
#   document. It is a proxy and says so: a note written to be different passes it, and no check
#   can read whether a reading happened.
#   `LC005` is retired and its code is not reused. An annotation on it is what `AN001` reports.
#   `skills/audit/scripts/attest.py`. A person runs it after committing the content: it writes the
#   current instant with its offset and the note, prints the commit whose text it attests, and
#   does not commit. An agent does not run it. The rule that an agent proposes `last_review` and
#   never writes it stands, and it now covers the command.
#   A shallow clone stops the validator with exit 2 and a message that says to fetch the full
#   history. Nothing about attestations is skipped in silence.
#
# ADOPTION, IN THIS ORDER. The order is forced, and for one step it is the reverse of the rule
# written further up in this file.
#   0. `AN001` names every annotation left on `LC005`, and every `LC006` annotation whose finding
#      is gone. Remove them: `--adopt` refuses while they stand. A `checks:` line pinning `LC005`
#      is filed by `migrate.py` under GONE and removed by `--adopt`; ignored, with a line on
#      stderr, while the project still declares the older version; a stop once it declares
#      this one. Writing the number by hand with the pin in place is how to meet that stop.
#   1. `LC007` names every attestation later than its own commit. Reattest those documents with
#      the command, which writes the offset. An `error` is not annotatable and blocks `--adopt`,
#      so this repair comes before adopting -- the one place where "adopt first, write the field
#      afterwards" does not hold, because the field is not new: its value was false.
#   2. `LC008` names every living document attested after its creation with no note. Write
#      `review_scope` with what the last reading covered, in a commit that touches only the
#      attestation block, so that `LC006` does not count it as a change.
#   3. Fetch the full history wherever the validator runs: `fetch-depth: 0` on `actions/checkout`,
#      `GIT_DEPTH: 0` on GitLab, `fetchDepth: 0` on Azure Pipelines. No check reports this one:
#      the validator refuses to run without it, and `migrate.py` cannot compare in a clone that
#      lacks it.
#   Bare `last_review` values stay valid; the command no longer writes them.
#
# MEASURED, ON ONE REPOSITORY OF ABOUT 150 COMMITS, 170 TRACKED FILES AND 26 LIVING DOCUMENTS.
# Reading the commit behind each attested line costs a `git blame` per living document, about
# 20 ms each and half a second for all of them, where the single `git log` the previous
# version read cost 17 ms. The validator as a whole went from 0.97 s to 0.8 s on the same
# repository, because the contents `LC006` compares now come from one `git cat-file --batch`
# instead of a `git show` per document. The validator's own fixtures were run under `LC007`
# before it shipped: six release fixtures carried an attestation two days after the commit
# that introduced it, in a repository whose subject is documents going out of date.
# 4.0.0 -> 4.0.1. An eighth skill, `presentation`, and one line in `scan.skip_dirs` so that
# what it writes is legal in a repository. PATCH, as `business` was in 2.8.11: no type, field
# or check moves, and a project that never invokes the skill never sees the directory.
#
# WHAT IT ANSWERS. What the product is, what it does today and how far along it is, told to
# somebody outside the project -- a customer, a sponsor, a salesperson -- in six to ten slides
# they can repeat, one presentation per product. The SAL of `business` is written for the people who steer and act, and half
# of it is what a customer must not be handed: risks, open decisions, requests to the business.
# So it is not a variant of the SAL. It is the SAL's opposite on every axis that matters here:
# occasional, a `.pptx`, and customer-safe with no internal mode.
#
# WHAT IT REFUSES, AND WHERE. The rules about what reaches a customer are checked on the outline
# before anything is drawn, by `skills/presentation/scripts/render.py --check`: no identifier
# or repository path on a slide, no date, month, duration or percentage on the roadmap, no
# slide without the sources it was taken from, and no roadmap label but "planned". `conditional`
# increments and `pitched` capabilities are kept off the roadmap by the skill, because no
# script can tell from a sentence what state the item behind it is in.
#
# WHAT MOVES AROUND IT. `python-pptx` becomes the third entry in `requirements.txt`, so CI
# renders what the skill renders. `extract.py --find` no longer reports `_meta/business` or
# `_meta/presentation` as a corpus: a deck this framework generated, found by the extractor
# beside `_meta/corpus/`, would have come back in as a document the customer wrote. The
# description of `business` stops claiming commercial teams and "a non-technical product update",
# which are now the other skill's readers and sentence. The trigger cases added for it are marked
# `unmeasured` until a run scores them, so the tables in `evals/README.md` keep the denominators
# they were measured on.
#
# ADOPTION. Nothing to do. A project whose CI pins the validator at a 4.0.0 commit through
# `framework_commit` does not have the new exclusion until the pin moves: it adds
# `_meta/presentation` to its own `scan.skip_dirs` before the first presentation, or moves the
# pin first.
# 4.0.1 -> 4.1.0. A ninth skill, `digest`, and one line in `scan.skip_dirs` so that what it
# writes is legal in a repository. MINOR, and the reason is the rule at the top of this file
# rather than the precedent: something arrived and nothing broke. 4.0.1 shipped the eighth
# skill as a PATCH by citing 2.8.11, and 2.8.11 was a patch because MINOR was frozen at the
# time; the freeze ended at 3.1.0, so 4.0.1 should have been 4.1.0 and the citation was the
# error. This one does not repeat it, and what that costs a project is under adoption below.
#
# WHAT IT ANSWERS. Where the work on one product stands today, for the person doing it and for
# whoever they report to: what closed since the last digest and in how many hours, what is
# left in the perimeter of the current release as a range of hours, when it can be delivered
# at the pace of the last days and at a normal day's, and what that date waits on from
# somebody else. The registers know what exists and in which state. They do not know hours,
# sizes, the perimeter of a release or what was asked of whom, and none of that belongs in an
# artifact -- a date or an estimate in `RMP` is the anti-pattern its template names. So the
# person declares it in a state file outside the artifact set, and the digest is what follows
# from the two: every number in it comes from a register, from that file or from an earlier
# snapshot, and the reconciliation from one digest to the next is computed, never written.
#
# WHERE IT LIVES, AND WHY NOT IN THE DOCUMENTATION REPOSITORY. `_meta/digest/` is a clone of a
# private repository, ignored by the documentation repository: the hours somebody works are
# not documentation, a repository of documents is often read by people who should not see
# them, and the series must not be lost with one laptop. Rendering commits and pushes the
# clone, and does not push to a GitHub remote that does not report itself private.
#
# WHAT IT REFUSES, AND WHERE. `skills/digest/scripts/digest.py --check`, before anything is
# written: an identifier in the registers the state file does not classify; a classified one
# gone from the registers without having been closed; a reconciliation that does not add up;
# the hours of a past period edited after they were frozen, or a snapshot whose hash no longer
# matches the record the next one kept of it; a registry status the script does not map,
# which `tests/selfcheck.py` asserts from this side too. What "closed" means is read there and
# not here, because this file declares which statuses exist and not which of them are done: a
# `CHG` is closed at `verified`, the Definition of Done of `templates/AGENTS.md`.
#
# WHAT MOVES AROUND IT. `extract.py --find` does not report `_meta/digest` as a corpus.
# `framework.yaml` gains no key: the themes and sizes belong to the format and live in the
# script, the hours of a normal day in the state file, because a new key there stops every
# older validator `migrate.py` rebuilds. The trigger cases added for it are `unmeasured` until
# a run scores them.
#
# ADOPTION. `FW001` reports the new number at `warn` in every repository that declares 4.0.x,
# and `migrate.py` finds no finding that moved: update `framework_version`, and nothing else.
# A project whose CI pins the validator through `framework_commit` at an earlier commit adds
# `_meta/digest` to its own `scan.skip_dirs` before the first digest, or moves the pin first.
# The store is set up once per documentation repository, with `digest.py --init-store <url>`.
#
# 4.1.0 -> 4.2.0. The digest stops being a text and becomes an Excel workbook, the one its
# readers asked for: a functional team and a direction who read the first sheet and little else.
# MINOR, although the rule above calls MAJOR what asks for a migration, and the reason is where
# the migration is: no artifact changes, no check of the validator changes, and the only file
# to convert is the digest's own state, outside the artifact set, which the digest refuses with
# the command that converts it. A project that does not use the digest has nothing to migrate.
#
# WHAT THE NOTE OF 4.1.0 SAYS AND IS NO LONGER TRUE. There is no reconciliation from one digest
# to the next, no range of hours and no delivery date at a normal day's hours:
# `standard_hours` is gone. Every item counts for the top of its size, S 2 hours, M 5, L 12,
# XL 40, so the estimate is one number and one date, on the side of caution. It is those hours
# over the hours per working day of the last three working days, net of the hours out of the perimeter and outside the product, each rounded to one
# decimal before the subtraction, because that is what the reference workbook does and its
# readers check it by hand. The hours are declared per item and per day, not per period, and a
# snapshot freezes every day up to the day before its date. The themes are `architettura`,
# `sviluppo` and `deploy`, which `infrastruttura` became; the hours outside the product fall in
# five fixed categories; a decision asked of somebody is a wait like any other.
#
# WHAT IT IS. Five sheets: a summary with the delivery, the estimate, what is needed from
# others, progress by theme, how the hours are split today and how they should be; a Gantt of
# every item with the milestones, one column per working day; the four lists of items; the
# hours by period and day by day; how to read it. Every derived cell is a formula,
# written by XlsxWriter with the value the script computed beside it, so the file reads the
# same in a preview that does not recalculate. The format is the reference workbook in
# `tests/fixtures/digest/`, made and computed by a spreadsheet before the code existed, and
# `tests/selfcheck.py` renders the fixture's day and compares the two cell by cell, value and
# style, with the rules by which the two may differ and why: the top of each range, first.
#
# WHAT MOVES AROUND IT. `requirements.txt` names XlsxWriter, which `python-pptx` already
# brought in, and openpyxl, which the tests read the workbook with. Nothing in the scan, in
# `framework.yaml` or in any template.
#
# ADOPTION. `FW001` reports the new number at `warn` in every repository that declares 4.1.x:
# update `framework_version`. A project that uses the digest runs `digest.py --migrate` once,
# then declares through the skill what it lists: the first day of the project, the days before
# the first digest rebuilt in bulk, the closing dates and sizes of the items done, the order of
# the lists, the plan with its hours and the milestones. The snapshots of 4.1.0 stay as they
# are and still anchor the chain of hashes.
#
# 4.2.0 -> 4.3.0. The roadmap says the order of delivery in front matter, and the digest draws
# its Gantt from it. MINOR: two optional maps, five checks at warn, no document that stops
# validating and nothing to migrate in a project that does not want them.
#
# WHAT IT ANSWERS. A roadmap in use had grown, in prose, a table of phases: which increments
# come first, which wait for which, a milestone named at the end of one of them. The digest
# needed exactly that and could not read a table, so the person kept the same order a second
# time, by hand, in the digest's state. `delivery_stages` is that table as fields: stages in a
# sequence (`after`), the increments of each, the name of a milestone and never its date.
# `increments` gives each increment its state, the increments it depends on, the `OD` and `KI`
# it requires, and the older `CHG` that do not name it themselves.
#
# AN INCREMENT HAS NO SIZE. It is worth the sum of what composes it: the decisions and issues
# it requires, which come first, and the changes that realise it. One with nothing under it
# is worth zero, and the digest says it is still to be broken down. A `CHG` names its
# increment in its own `derives_from`, at the one moment that can be written, because a `CHG`
# is immutable after approval; `changes` is only for the ones written before.
#
# `delivered` IS THE FOURTH STATE, and the one the body table never had. Without it every
# finished increment read as still to do to whatever retells the roadmap.
#
# NAMES. `delivery_stages` and not `stages`: `product.yaml` carries `stage:`, the framework
# phase of the product, one letter away, and `FM006` would have reported it in every
# manifest. And not phases: F1-F6 are the framework's.
#
# WHO WRITES IT. `cycle`, at the opening of a cycle, and the first time from the prose the
# roadmap already has, with a table the person fills for every change, decision and issue
# whose increment no document says. `requirement` and `resolve` add the row of an increment
# they create or move; the stages stay with `cycle`. The roadmap is a living document, so
# each change to it is reread and attested: the stages move at the pace of the cycles.
#
# ADOPTION. `FW001` reports the new number at `warn`: update `framework_version`. The maps
# are optional, and a project that does not declare them sees nothing new.
version: "4.3.0"

# ON EVERY CLOSED VOCABULARY IN THIS FILE, AND THE VALUE THAT KEEPS GETTING LEFT OUT.
# Three enums were extended on the same day, and the omissions were not random: every one of
# them was on the axis of "we do not know yet". A risk category with no `security` and no
# `organisational`; a feasibility scale with three degrees of difficulty and no way to say
# the design does not exist yet; a likelihood whose maximum was `high` in a register holding
# a divergence that had already happened.
#
# The failure mode is the same each time and it is quiet. Faced with a vocabulary that has no
# true value, a careful person omits the field -- which is the honest thing to write and the
# most invisible: an omitted `likelihood` drops the row out of every ordering that reads one,
# an omitted `feasibility` makes a promise look unexamined rather than unexaminable. The
# careless answer is worse and more likely: pick the nearest value, and the register now says
# something false that nothing will ever contradict.
#
# AND THE SAME DISCIPLINE ONE STEP OUT, WHICH IS WRITTEN WHERE A CHECK IS ADDED RATHER THAN
# HERE: write down which case a rule is for, because the way it is expressed will be read as
# its scope. `skip_dirs` and `sections` are the two instances of it that live in this file. The
# list of seven is in the preamble of `skills/audit/checks.yaml`.
#
# So when adding or reviewing a vocabulary here: write down what the answer is on the day the
# question is first asked, before anybody has done the work. If that answer is not in the
# list, the list is not finished, and the missing value is almost always some form of "not
# yet" -- not decided, not measurable, not applicable, not ours.
#
# AND WHICH OF THE TWO REPAIRS TO REACH FOR, BECAUSE FROM 3.2.0 THERE ARE TWO AND CHOOSING
# BETWEEN THEM AT RANDOM IS HOW ONE FACT ENDS UP WITH TWO SPELLINGS.
#
#   THE CRITERION, IN ONE LINE. If there is an event after which the field would have a true
#   value, it is `unanswerable`. If there is none, it is a value that names the state.
#
# They are not two ways of saying one thing, and the difference is not a matter of taste:
#
#   a value that names the state       says NEVER. `products: [none]` on an entry whose
#                                      subject is the repository or the tooling it is checked
#                                      with; `commitment: none` on a risk that is not about a
#                                      promise; `[unregistered]`, `not-applicable`. It carries
#                                      no condition because there is no condition: nothing
#                                      will happen that makes that entry bind a product.
#
#   `unanswerable` on the record       says NOT YET, and names the event. The case that
#                                      produced it: eleven promised capabilities, each
#                                      buildable alone and not as a set until somebody
#                                      decides the scope, so every value of `feasibility` is
#                                      false on one half of the judgement. That field becomes
#                                      answerable the day the scope is decided, and
#                                      `settled_by` is where that day is named.
#
# The test that separates them is whether `settled_by` can be filled in honestly. If writing
# it means inventing an event, the answer is not `unanswerable`: the vocabulary is short a
# value, and the list above is not finished after all.
#
# `UNA001` is what keeps the second from becoming a permit not to answer -- a field declared
# unanswerable and filled in anyway is the declaration outliving its own state -- and no check
# can do more, because whether an event has happened is not a thing a script knows.

lifecycles: [living, immutable, append-only]

# Required in the front matter of every artifact, whatever its type.
#
# ON `created`. The templates write it to the minute, like `last_review`. No check enforces
# that and none is added here: a repository written before this carries dates, and turning
# on a check that reddens correct documents is how a validator stops being read. It is a
# consistency the templates ask for, not a rule. Two timestamps in the same front matter
# with different precision invite the reader to wonder which one is approximate.
base_required: [schema, artifact_type, lifecycle, status, owners, created]

# THE ATTESTATION BLOCK OF A LIVING DOCUMENT, AND NOTHING ELSE IS. `last_review` is the instant
# a person finished reading it; `review_scope` is the sentence beside it saying what the reading
# covered and what it did not. Both are written together by `attest.py`, by a person, after the
# content is committed, and they are the only two fields a reading may write without the write
# counting as a change to the text: `LC006` steps over a commit that touches them alone, and
# counts everything else, YAML comments included. `LC007` reads the commit behind the first;
# `LC008` reads the second. Declared here and projected into every living schema by
# `generate.py`, untyped for `last_review` (see the generator's docstring on serialisation) and
# as a string for `review_scope`, so that a misspelt key is measured against both by `FM006`.
# Optional in the schema: whether the note is owed is `LC008`'s question, not the schema's, and
# on day one it is not, because a creation is not a reading.
attestation_fields: [last_review, review_scope]

# ON `generated`. A type marked `generated: true` is written by a tool and not by a
# person, and it swaps `owners` for `generated_by`, which names the tool. The swap is the
# whole point. `owners` on a file nobody wrote is fiction, and a field naming somebody to
# ask is worse than an absent one when the honest answer is "nobody, it was regenerated".
# `generated_by` says something true instead, and says the thing an agent needs before it
# starts editing: do not edit this, regenerate it.
#
# `release-manifest` is the only one today. `decisions/INDEX.md` and `TRACEABILITY.md`
# will be next, and they carry no front matter at all right now.

# ON `products`. The value `exactly-one` makes the field required and one element long.
# It is declared only on the two types whose template used to carry `product:` in the
# singular, which said the same thing through a field name rather than through a
# constraint: a release belongs to one product, a manifest describes one product. The
# constraint survived the rename and became checkable. Everywhere else `products` stays
# unconstrained, and that is deliberate rather than an omission: a `DEC` with
# `scope: platform` lists every product there is.

# Values that mean "not filled in". A required field carrying one of these is missing,
# not present: a template placeholder that reaches a real repository reads as a real
# value to anything that does not know the template.
#
# The two lists are enforced in two different places, and the split is not about which
# sentinels matter. It is about where a rule can live.
#
# `enforced` is rejected by the generated schemas, wherever a required field is a plain
# string: `FM002`, which blocks. It cannot hold more than this, because the templates have
# to validate against their own schemas -- they are the thing people copy, and one that
# fails the check it teaches is worse than a permissive pattern -- and every template ships
# `owners: [NAME]` and `created: YYYY-MM-DD HH:MM`.
#
# `other` is reported by `FM004` at `warn`, on repositories only, where `templates/` is not
# looked at. That check exists because the schemas reached none of these: `owners` is a
# list, so `[NAME]` clears `minItems`; `created` carries no format on purpose;
# `derives_from: [PRB-NNN]` is not a reference `REF001` can resolve; a `COMMIT_HASH` inside
# `verified_code` is a map value. The whole day one set validated with an owner who does not
# exist and a document nobody wrote.
placeholders:
  enforced: [COMMIT_HASH, SHA_OF_THE_EVP_FILE]
  other: [NAME, NNN, "YYYY-MM-DD", "YYYY-MM-DD HH:MM", "YYYY-MM-DDTHH:MM:SSZ"]

# The identifier prefixes the framework uses. Not all of them are files, and that is the
# reason this list exists: `SIG`, `ANA` and `INC` live as entries inside a `LOG`, `OD` and
# `KI` inside `OPEN.md`, `CMT` inside `COMMITMENTS.md`, `RSK` inside `RSK.md §state`. A
# reference check that only knew about files would report every single one of them as
# dangling, and a check that cries wolf on correct documents gets turned off within a week.
id_prefixes: [PRB, HYP, EVD, CMP, DFB, SD, DEC, CHG, EVR, REL, RLM, DC,
              SIG, ANA, INC, OD, KI, RSK, CMT, ING, ICG]

# The identifier families that are not `PREFIX-NNN`, written out. `ING-C03` is an ingestion
# contradiction, there are twenty-two of them, and one sits in the `derives_from` of a `DEC`.
# They go here and not into `id_prefixes` because the numeric half of the general form stays
# strict: relaxing it would let typos through, which is the thing the form exists against.
id_forms:
- 'ING-C\d{2,}'

# `id_fields` on a type declares a front matter field that holds an identifier or a list of
# them, and generates the shape: absent, one id, or several. `supersedes` lived for weeks as a
# convention -- read by the validator, written in a template, in no schema -- so `supersedes:
# 12` was as legal as `supersedes: DEC-004`. It is declared on every type whose `status` can
# reach `superseded`, because those are the documents that can be replaced.
#
# It types the value and not the key: no type here closes `additionalProperties`, since real
# front matter carries `approvers`, `classification`, `icg` and others nobody should have to
# enumerate, so `supercedes:` spelled wrong is still an unknown field that nothing reports.

# Types whose body *defines* identifiers instead of only citing them, and which prefixes
# each one defines. The second half is the part that matters. Every one of these registers
# also cites identifiers it does not own, constantly: `OPEN.md` names the `DEC` that closed
# an entry, `LOG.md` names the `CHG` a signal produced, `ING.md` names where each extracted
# claim was routed. Vouching for every identifier printed in a register would mean that
# writing "there is no DEC-999" is enough to make DEC-999 exist, so a dangling reference
# would disappear the moment somebody documented it, which is the one thing the reference
# checks ask you to do.
#
# Append-only types are listed here like the others. Their lifecycle is not enough on its
# own: it says the body accumulates entries, not which identifiers those entries carry.
inline_id_declarations:
  open-register: [OD, KI]
  risk-register: [RSK]
  commitments: [CMT]
  roadmap: [INC]
  signal-log: [SIG, ANA]
  ingestion-register: [ING]

# The prefixes a reference has to qualify with a product: `atlas:SIG-041`, never `SIG-041`.
#
# WHY THIS IS NOT THE WHOLE LIST OF PER-PRODUCT REGISTERS, WHICH IS THE INTERESTING HALF.
# Six families above define identifiers in a register's body, and four of those registers
# exist once per product, so four of them could in principle collide. Only two are on this
# list, and the test that put them there is not where the register lives -- it is whether
# anything ever names one of its identifiers from outside the product that owns it:
#
#   RSK    nothing references a risk. No field in any template or schema names an `RSK-NNN`
#          as a target; `REF006` and `XP007` join promises to risks by reading the map, not
#          by resolving a written reference. Two products numbering their risks from 001 is
#          the ordinary case and there is nothing to disambiguate.
#   INC    referenced only by a `CHG`, which lives in `products/<p>/changes/`. Same product,
#          always, by where both files sit.
#   OD/KI  `REG007` already makes these one sequence across the three registers, and that is
#          deliberate: the three compose into one view at the root ordered by cost to
#          reverse, which is the only place "the most expensive thing still open" exists.
#          Qualifying them would break that composition to solve a collision the check
#          already reports.
#   SIG    `DEC` lives at `decisions/DEC-NNN-slug.md` -- the root -- and its template
#   ANA    prescribes `derives_from: [HYP-NNN, EVD-NNN, SIG-NNN]`. A root document that
#          binds two products, naming a signal that belongs to one of them, by an id and
#          nothing else. This is the case, and it is the prescribed shape rather than an
#          edge one.
#
# So the rule is narrow on purpose: it is not "per-product registers get qualified", it is
# "an identifier that can be named from outside its product gets qualified".
#
# DECLARATIONS STAY BARE. A signal log writes `SIG-041` in its own rows: the file is under
# `products/<p>/`, so the directory already said whose it is, and a register that had to
# repeat the product on every line would be repeating what its own path declares. It is the
# reference that carries the qualifier, because a reference is read somewhere else.
#
# It applies to `id_fields` and not to map keys. An `ICG` keys its `routing` and `impacts`
# maps on the candidates it classified -- signal ids -- and it lives in
# `products/<p>/cycles/`: the candidates are that product's by construction, and asking a
# product's own gate to qualify them is ceremony that buys nothing.
qualified_reference_prefixes: [SIG, ANA]

# What a validator built on this registry should look at.
#
# These are the framework's exclusions and they are a floor, not the whole list. A project
# extends them under `scan:` in its own `framework.yaml`, with these same three keys,
# because the directories a real project keeps its code in are not knowable from here: a
# dbt model, a Kubernetes manifest and a CONTRIBUTING.md are each an `FM001`, and `FM001`
# blocks. It extends and does not replace, for the reason each entry below states.
scan:
  # `corpus` is source material, not an artifact: those are the documents the business
  # handed over, and we cannot correct front matter we did not write. It is matched by bare
  # name because it means the same thing wherever it turns up, including under `_meta/`
  # where the structure now puts it and under `products/<p>/` where older repositories
  # still keep it.
  #
  # `_meta/extract` is the extractor's output, regenerable, and it is written as a path
  # rather than as a name on purpose. `extract` alone would exclude the extraction step of
  # every ETL project that keeps one in a directory of that name, which is the mistake this
  # block already warns about two paragraphs down. `ingest-out` is the name that directory
  # had before and stays here so repositories written against it keep working.
  #
  # `templates` is skipped for a reason worth stating, because it has already cost
  # something: it is why `templates/RLM.yaml` has been missing two base-required fields
  # with nothing noticing. See the note at the bottom of this file.
  # Anything whose name begins with a dot is tooling: `.git`, `.github`, `.venv`,
  # `.gitlab-ci.yml`. No framework artifact is ever hidden, so this is a rule rather than
  # a list, and a list is what it was: the validator reported the CI workflow of this very
  # repository as a document with no front matter, minutes after the workflow was written.
  # A list of exclusions is always one entry behind whatever was added last.
  skip_hidden: true

  # `schemas`, `skills` and `references` hold the framework's own definition and tooling.
  # They are metadata about artifacts, not artifacts, and this file is the proof: run the
  # validator on the framework repository without this line and it reports its own registry
  # as a document with no front matter. `references` earned its place the same way, one
  # commit after the skills were written: the shared preamble and the routing table are
  # prose the framework wrote about itself, and they came back as two blocking `FM001`.
  #
  # `build` is where a generator puts its output, and this repository is why it is named:
  # `evals/fixtures/build/` holds fourteen repositories that are broken on purpose, so a
  # validator run pointed at the framework itself reported thirteen errors and eighty
  # warnings from fixtures that are supposed to have them. A generated output directory
  # holds no source document in any project, which is what makes it safe to name here.
  #
  # `_meta/business` is the `business` skill's output: the weekly SAL for management and
  # cross-functional actors. It is a dated snapshot and not a source -- every fact in
  # it is a retelling of one that lives in an artifact, which is why it is excluded rather
  # than typed. A path and not a bare name, for the reason `extract` carries two paragraphs
  # up: a Data/AI project may perfectly well keep a `business/` directory of its own, and an
  # exclusion that protects the framework's convenience is paid for by everyone using it.
  #
  # `_meta/presentation` is the `presentation` skill's output, for the same reason and in the
  # same form: a customer-safe retelling, not a source. Its `outline.yaml` is what makes the
  # exclusion necessary rather than tidy -- `.yaml` is a format the scan reads, and without
  # this line the first outline written is an `FM001`, which is an error.
  #
  # `_meta/digest` is the `digest` skill's store, and the one exclusion here that holds what no
  # artifact may hold rather than a retelling of what one does: the hours, sizes and perimeter a
  # person declared, and the snapshots computed from them. It is a clone of a private
  # repository and the documentation repository ignores it, so on most checkouts the line
  # changes nothing; it is here for the checkout that has the clone, where its `.yaml` files
  # would otherwise be an `FM001` each, the first time anybody ran the validator.

  # `evals` is deliberately NOT here, and was for a day. Excluding it fixed the same
  # symptom by charging every real project a silent exclusion of a directory name a Data/AI
  # project plausibly uses for artifacts of its own. This repository is not a project and
  # is never validated as one: the `FM001` findings a misdirected run still produces from
  # `evals/**/*.yaml` are the correct signal that `--root` is wrong, and the `audit` skill
  # already says a clean report on the wrong repository is worse than an error. An
  # exclusion that protects the framework's convenience is paid for by everyone using it.
  # `.framework` holds what a project writes *for* the framework rather than what the
  # framework asks it to write: today one file, the findings it has examined and left
  # standing. It is hidden, so `skip_hidden` already covers it, and it is named here as
  # well because `skip_hidden: false` is a legal thing for a project to write and would
  # otherwise turn that file into an `FM001`, which is an error, on the very run it exists
  # to inform.
  skip_dirs: [templates, skills, schemas, references, corpus,
              "_meta/extract", "_meta/business", "_meta/presentation", "_meta/digest",
              ingest-out,
              build, node_modules, __pycache__, ".framework"]

  # Documents that speak *about* the framework rather than being produced *by* it.
  # `framework.yaml` is the project's own validator configuration: without this line the
  # validator reads its own config as an artifact and reports it for having no front
  # matter, which is the kind of first impression a tool does not recover from.
  #
  # `expected-findings.yaml` is the same case one level down, and it is here rather than
  # only in `skip_dirs` because `load_scan` unions the project's list with this one and
  # never subtracts: a project can add to either key and can remove from neither, so the
  # exclusion holds whatever a project writes under `scan:`. That is the property the file
  # needs, because the validator reads it by an explicit path rather than through the scan,
  # and reading it somewhere else does not stop `discover` from finding it.
  skip_files: [README.md, FRAMEWORK.md, SKILLS.md, INDEX.md, TRACEABILITY.md,
               framework.yaml, product.index.yaml, expected-findings.yaml]

# ON `sections`. A value here is the id of a marker in the body, not a heading:
#
#     <!-- section: what-must-not-change -->
#     ### 2 · What must NOT change
#
# The marker carries the identity, the heading carries the prose. Reword the heading,
# number it differently, translate it, and the check still stands. It is the same split
# the front matter already makes between what a document *is* and what it *says*.
#
# It was not always so, and the reason is worth keeping. The deleted validator matched
# each value as a substring of any heading from level 1 to 3, and its values were the
# Italian headings of the day: "corrente", "stato", "Cosa NON deve cambiare". The
# templates were translated into English in commit acaded9, which would have left every
# section check matching nothing at all. It would not have failed loudly either: a check
# that finds no section and a check that was never written look the same from outside.
# Nobody noticed only because the validator was deleted in that same commit.

# ON `path`, WHICH WAS A SENTENCE AND IS A RULE FROM 3.3.0.
#
# It is a list of placements, and `LOC001` reads it: an artifact of that type belongs at one
# of them. The catalog cell in `templates/README.md` is generated by joining the list with a
# bullet, which is exactly the string this field used to hold by hand -- so the prose is
# produced by the constraint instead of standing beside it, and the two cannot drift.
#
# WHY THE SHAPE CHANGED, AND IT IS THE ARGUMENT FOR THE WHOLE MOVE. As one string this field
# was read by a single line of the generator and by nothing else, in five notations nothing
# declared and nothing parsed. What that cost is measurable: two of the thirty values were
# false about this repository's own files, and had been for months, in a repository that has
# a test asserting a count written in prose. A field wrong for months is a field nobody reads.
# The exercise of writing thirty patterns found twelve more of the same mistake, which is what
# an exercise is for.
#
# THE NOTATION IS THESE FOUR TOKENS AND NOTHING ELSE. Anything not listed here is literal.
#
#   <p>       one path segment: a product directory
#   <i>       one path segment: an initiative directory
#   NNN       three or more digits
#   -slug     an optional trailing hyphen and text, INCLUDING the hyphen: `CHG-001.md` and
#             `CHG-001-rechunk.md` both match `CHG-NNN-slug.md`
#
# `-slug` is optional because the framework nowhere forbids a human tail on a numbered file
# and nowhere requires one, and thirteen types number their files while exactly one of them
# used to say so. Writing the same convention out thirteen times by hand is how twelve of them
# came to be wrong; it is one token now.
#
# A TYPE WHOSE PLACEMENT CANNOT BE WRITTEN AS A PATTERN SAYS SO, WITH THE REASON:
#
#   path_not_enforced: >
#     why no pattern describes where this lives.
#
# `LOC001` does not run on that type and the report says how many types are in that state. It
# is the same discipline as `unanswerable` on a map field, applied to the registry instead of
# to a document, and for the same reason: a pattern that approximates would be a field
# claiming more than it is, which is the defect this whole change repairs, rebuilt inside its
# own repair. Nothing uses it today, and that is the good outcome rather than a gap: it was
# written as a precaution and it is not a permit.

# ─────────────────────────────────────────────────────────────────────────────
# The types. Order preserved from the deleted file: initiative immutables first, then
# the platform and product immutables, then the living artifacts, then append-only.
# ─────────────────────────────────────────────────────────────────────────────

types:

  agents-control-plane:
    id: AGENTS
    name: Control plane for agents
    axis: platform
    born_in: day one
    template: templates/AGENTS.md
    path: [AGENTS.md]
    lifecycle: living
    status: [active]

  open-register:
    id: OPEN
    name: Open decisions and known issues
    axis: platform
    born_in: day one
    path: [products/<p>/OPEN.md, platform/OPEN.md, OPEN.md]
    template: templates/OPEN.md
    lifecycle: living
    status: [active]
    # Three placements and one rule: an entry lives in the register of the thing it is
    # about. One per product, mandatory, beside the product -- `REG006` -- because the file
    # an agent reads before deciding anything has to be the one beside what it is working
    # on. `platform/OPEN.md` for the substrate, if a substrate was decided. The register at
    # the root for what belongs to no single product, which includes the question of
    # whether to have a substrate at all, and it also carries the parking lot and the
    # generated union of all the others.
    #
    # Scope is read off the directory and not off `products:`, so in a product's register
    # the field is left off and `REG008` reports one that contradicts where it sits. At the
    # root there is no directory to read, so there the field is required and `REG011` reports
    # its absence: an entry with no `products:` binds every product, which is a statement
    # somebody may have meant and is written identically to a question nobody asked.
    # `products: [all]` is that statement -- the reserved word and not a list of every
    # product, because a list means the same thing right up until a product is added, and
    # then it quietly means less.
    #
    # `products: [none]` is the fourth answer and it arrived in 3.2.0, because the field had
    # three positions and the register has four subjects. An entry can be about the
    # repository itself, or about the tooling the repository is checked with, and that entry
    # binds no product and never will: `[all]` said something untrue in the field most things
    # join on, and absence said the thing `REG011` exists to remove. `binds()` reads it, so
    # the entry appears under no product heading and in no product's derived view, and the
    # generated union gives it a section of its own -- without one it would validate, satisfy
    # every check and be missing from the only composed view of what is open.
    #
    # Both are words and not products. `XP008` reports a product actually called `all` or
    # `none`, at `warn`: while one exists every `products:` naming it says two things.
    # Numbering stays one sequence across all three -- `REG007` -- because `depends_on` and
    # the `derives_from` of a `DEC` name an entry by its id and nothing else.
    # `REG002` and `REG003` used to read the body: `### OD-NNN` headings and lines like
    # `- **Cost to reverse:** high`. Rename that label, translate it, or reformat the bullet,
    # and both checks stop working -- reporting nothing, which reads as "no high-cost entry
    # is undecided". The flattering failure again, on the register a person edits by hand
    # more often than any other file here.
    #
    # The fields two checks need are front matter now. The body keeps the prose, because
    # `OPEN.md` is an interview surface: context, alternatives and consequences are what a
    # person reads while deciding, and no field replaces them. This is the `ICG` split for
    # the third time -- the verdict where a check can read it, the argument where a reader
    # can.
    #
    # No fallback parser, and no transition. Nothing runs on this framework yet, so an
    # old-format register does not exist to protect.
    #
    # `body_ids` is what `REG015` compares: the ids the body still carries, against the keys
    # of the map, both directions. Here the body is `### OD-NNN` headings and not a table,
    # and a decided entry is exempt in one direction on purpose -- when a decision is taken
    # the prose leaves §1 for a cross-reference line in §4 while the row stays in the map,
    # which is the one document in the framework that is supposed to get shorter.
    body_ids:
      from: heading
      map: entries
      exempt_status: [decided]
    maps:
      entries:
        # `entries: {}` is legal here and nowhere else. A product must have a register --
        # `REG006` -- and a product may genuinely have nothing open, so refusing the empty
        # map would leave inventing an entry as the only way to satisfy both. It is also a
        # different claim from an absent `entries:`, which `REG004` reports: one says read
        # and nothing found, the other says nobody filled this in.
        may_be_empty: true
        # `OD-` and `KI-` share the register and not the rules for closing. An `OD-` closes
        # on an accepted `DEC` and `REG005` resolves it: a decision nobody can reach is one
        # nobody can revisit. A `KI-` closes on whatever recorded that it was dealt with --
        # a `CHG`, a `SIG`, a commit, a line of the log -- and nothing resolves that field,
        # deliberately. The template used to name three artefacts and the validator never
        # checked any of them, which is a rule in name only; the honest version is that a
        # known issue is not a choice, and asking for a decision record because somebody
        # deleted two files is how a rule gets worked around rather than followed.
        keys: "^(OD|KI)-(\\d{3,}|NNN)$"
        # `trigger` and not `deadline`: the observable event after which the decision
        # can no longer be deferred, which is what forces it. No date belongs in one, in
        # any form and not even beside the event -- `REG009` -- because the entry it sits on
        # is one nobody has decided, and a date written on an undecided thing is read as a
        # promise by whoever finds it next.
        #
        # `decide_with` is the other half of the same idea: two entries that have to be
        # decided in one sitting, which `depends_on` cannot say because it orders them. It
        # belongs on both entries, and no check enforces that -- when only one declares it,
        # nothing here can tell which of the two is the one that is wrong.
        fields:
          required: [status]
          optional: [cost_to_reverse, default_in_force, trigger, closed_by]
          lists: [depends_on, decide_with, products]
          enums:
            status: [open, decided, superseded, parked]
            cost_to_reverse: [high, medium, low]

  commitments:
    id: COMMITMENTS
    name: Commercial commitments made
    axis: platform
    born_in: day one
    template: templates/COMMITMENTS.md
    path: [COMMITMENTS.md]
    lifecycle: living
    status: [active]
    # THE THIRD REGISTER TO MAKE THIS MOVE, AND FOR THE THIRD TIME THE SAME REASON. The
    # entries of `OPEN.md` and the rows of `STACK.md` are front matter because a check that
    # reads a markdown table is a check that stops working the day somebody reformats one --
    # silently, reporting nothing, which reads as nothing being wrong. Until now nothing
    # here could read a commitment: not which product it binds, not whether it is a promise
    # already made or a sentence in a deck nobody has sent, not whether anything measures
    # it. In a real repository eight commitments were `stated-as-done` on capabilities the
    # same repository says are not built, and no check could say a word.
    #
    # The body keeps the promise in the words that were used, who said it, how binding the
    # literal wording is, and what it would take to build. That is what a person reads
    # before renegotiating, and no field replaces it.
    #
    # From 3.0.0 it keeps *only* that: the recipient, the status, the feasibility and the
    # products were rows of the body table and fields of the map at the same time, and now
    # they are fields only. `body_ids` is the `### CMT-NNN` heading of each entry, which
    # `REG015` compares against the keys of the map.
    body_ids:
      from: heading
      map: commitments
    maps:
      commitments:
        may_be_empty: true
        keys: "^CMT-(\\d{3,}|NNN)$"
        fields:
          required: [to, status]
          optional: [feasibility, threshold, evidence, blocked_by]
          # `products` carries `[all]` here for the same reason it does in the register at
          # the root: a promise about the whole suite is the ordinary kind, and read as a
          # product named `all` it bound nothing. Required in practice rather than in the
          # schema -- `XP006` reports the absence -- because every join downstream of a
          # commitment runs through this field and an empty one still reads as filled in.
          lists: [products]
          enums:
            # ON `feasibility`, AND A DISTINCTION ITS FIVE VALUES CANNOT HOLD. A real
            # register carries a promise that is feasible one at a time and out of reach
            # as a set: eleven capabilities each buildable, the eleven together not,
            # until somebody decides the scope. `feasible-with-reservations` understates
            # it -- that is a boundary, not a reservation; `out-of-reach` overstates it,
            # because each one alone is buildable; and `not-yet-assessable`, which the
            # row carries today, is false: the assessment was made and produced two
            # answers.
            #
            # LEFT AS IT IS RATHER THAN WIDENED, AND THE ROW KEEPS THE WRONG VALUE. A
            # sixth value invented from one row is the move this file spends its notes
            # warning against, and the field is optional, so the body carries the
            # distinction the vocabulary cannot. It is written here so the next register
            # to hit it finds this instead of picking the nearest value -- which is
            # exactly the failure the note on closed vocabularies at the bottom
            # describes, and the one case where that note's own advice does not resolve
            # it: the missing value is not a form of "not yet".
            status: [not-yet-issued, stated-as-done, open, met, renegotiated, unsatisfiable]
            # THE VOCABULARY HAD THREE DEGREES OF DIFFICULTY AND NO WAY TO SAY "NOT YET".
            # This is the register of promises made before the thing was built -- that is
            # the sentence the document opens with -- so the ordinary early state of a row
            # is that nobody can judge it: the design does not exist, or the decision it
            # depends on has not been taken, or the promise as worded cannot be checked at
            # all. Six rows out of sixteen in the first repository to use it, four of them
            # the same state, and the only legal answers were three shades of an assessment
            # nobody had made.
            #
            # `not-applicable` is the other one: a promise with no technical content to
            # assess. Both are legal answers, and `blocked_by` beside them names the entry
            # that has to be decided before the question can be asked at all.
            feasibility: [feasible, feasible-with-reservations, out-of-reach,
                          not-yet-assessable, not-applicable]

  glossary:
    id: GLOSSARY
    name: Glossary and metric dictionary
    axis: platform
    born_in: day one
    template: templates/GLOSSARY.md
    path: [GLOSSARY.md]
    lifecycle: living
    status: [active]
    # The terms, where something other than a reader can find them. A data contract that
    # sends you to `GLOSSARY §Tenant` for the meaning of a column is a reference like any
    # other, and until this there was no second end to resolve it against: the terms lived
    # in `### ` headings, and `REG002` and `REG003` already went quiet once for being built
    # on headings somebody reworded. The body keeps the definition, the prose and the
    # examples; the map keeps the names.
    #
    # `blocked_by` is the state this framework had no way to write down: a term whose
    # definition is waiting on a decision nobody has taken. Without it the word is simply
    # absent, and a document leaning on it reads as if it were defined somewhere else.
    # `REF005` resolves a citation to a blocked term as found -- the gap is declared, which
    # is the whole difference.
    maps:
      terms:
        may_be_empty: true
        keys: "^\\S.*$"
        fields:
          required: [kind]
          # `kind` unless `blocked_by`. A term can be blocked precisely because nobody knows
          # yet whether it is a metric or a domain concept -- that is one of the things the
          # decision has to settle -- and requiring `kind` there makes the writer choose the
          # thing `blocked_by` exists to avoid choosing. Once the term is defined the kind
          # is known, and then it is required like everywhere else.
          required_unless: {kind: blocked_by}
          optional: [blocked_by]
          enums:
            kind: [domain, metric]

  operational-stack:
    id: STK
    name: Operational stack
    axis: platform
    born_in: the first time a tool is named, which is usually earlier than anybody thinks
    template: templates/STACK.md
    path: [STACK.md]
    lifecycle: living
    status: [active]
    sections: [chosen, unratified, ruled-out]
    # The fact with no other home: which tool is used for which job, and whether anybody
    # decided it. `ARC#current` describes the system that exists; a `DEC` records one
    # decision and its reasoning. Neither answers the question an agent asks before writing
    # a line of code -- what do we reach for here, and what must I not introduce -- and
    # answering it today means reading every decision in the register.
    #
    # It exists because of what a real corpus turned up. The architecture slide of a sales
    # deck named React, FastAPI, Apache NiFi, Iceberg, S3, LangGraph, Azure OpenAI,
    # Kubernetes and OIDC. Eleven tools, chosen by whoever drew the slide, with no `DEC`
    # behind any of them and nowhere in this framework to say so. `unratified` is that state,
    # and it is the most useful section here: it is `OPEN.md`'s `Default in force` applied
    # to tooling, and naming it is what turns a slide into a decision somebody can take.
    #
    # The map is the checkable half and the body is where the reason goes, the same split
    # the `ICG` uses. A row names the `DEC` that chose it; it does not restate the argument,
    # because the copy is what survives when the decision is revisited.
    maps:
      stack:
        keys: "^[a-z][a-z0-9-]*$"
        fields:
          required: [tool, status]
          optional: [version, note]
          # `decided_in` è una lista, e lo è diventata quando `risk-register` ha avuto
          # bisogno della stessa cosa. Il framework tiene un invariante che non dichiara a
          # parole e fa rispettare in `tests/selfcheck.py`: **un nome di campo, una forma
          # sola**, perché uno snippet copiato da un template produce altrimenti un `FM002`
          # nel progetto di qualcun altro -- è già successo con `depends_on` e `used_by`.
          # Allargare qui invece di restringere là è la scelta nel merito e non un
          # compromesso: uno strumento può essere ratificato da più decisioni, esattamente
          # come una riga di rischio può seguire da più d'una. E si paga adesso che costa
          # due righe di template e una di un solo `STACK.md`: con tre prodotti che ne
          # hanno uno, la stessa scelta si presenterebbe con un costo che spinge verso lo
          # scalare per la ragione sbagliata.
          lists: [used_by, decided_in]
          enums:
            # `dropped` is the state this document could not describe, and every project
            # has some: a tool that was tried, is not in use, and that nobody decided
            # against. `unratified` says the opposite -- in use, nobody chose it -- and
            # `ruled-out` claims a decision, which `STK001` then asks to see. With three
            # values the only way to file an abandoned experiment was to write something
            # false, which is what a real repository did twice.
            status: [chosen, unratified, ruled-out, dropped]

  platform-architecture:
    id: PLATFORM
    name: Architecture of the shared substrate
    axis: platform
    born_in: only if a shared substrate is decided
    template: templates/PLATFORM.md
    path: [PLATFORM.md]
    lifecycle: living
    status: [active, draft]
    id_fields: [derives_from]
    # The shared substrate. Unlike ARC it is born on day one, before the code exists, so
    # it cannot require `verified_code`.
    #
    # It carries `code:` for the same reason `product.yaml` does, and for one more. A
    # repository that serves several products -- the access layer two of them sign in
    # through, the shared data plane -- has no home in a per-product map. The only two
    # things a project could do were write it into every `product.yaml` that uses it, which
    # is one fact in several files and the divergence this framework exists to prevent, or
    # leave it out, and then neither product knows where its own sign-in lives. This is the
    # third option, and it is the one consistent with the rest: shared things belong to the
    # substrate.
    #
    # A key belongs to exactly one of the two maps. `XP004` reports a repository claimed
    # twice, because the copy is what makes the two descriptions of it drift.
    maps:
      code:
        keys: "^[a-z][a-z0-9._-]*$"
        fields:
          required: [url, contains]
          optional: [path, release_relevant]
          lists: [used_by]

  product-manifest:
    id: product.yaml
    name: Product manifest
    axis: product
    born_in: day one
    template: templates/product.yaml
    path: [products/<p>/product.yaml]
    class_note: partly generated
    lifecycle: living
    status: [active, draft]
    products: exactly-one

    # Where this product's code actually lives. Documents and code are in one repository
    # in the simple case, and the framework assumed that everywhere: `scan.skip_dirs`
    # exists to exclude code sitting *inside* the documentation root. A project keeping its
    # documentation in its own repository, with the code in several others, had nothing to
    # say so with, and an agent told to read the document and act could read and then not
    # know where to go.
    #
    # Keys are repository names and not framework identifiers, so they get their own
    # pattern. `path` is where it is expected to be checked out, relative to this
    # repository, because an absolute path is true on one machine. `path: .` is the
    # co-located case, and writing it is what separates "the code is here" from "nobody
    # recorded where the code is".
    #
    # `release_relevant` marks a repository whose commit an evaluation is about. It is
    # `release_relevant` marks a repository whose commit an evaluation is about, and
    # `VER002` reads it: an `ARC` or an `EVR` that attests some of the release-relevant
    # repositories and not all of them is reported, because a partial attestation reads
    # exactly like a complete one.
    maps:
      code:
        keys: "^[a-z][a-z0-9._-]*$"
        fields:
          required: [url, contains]
          optional: [path, release_relevant]
          lists: [used_by]

  product-brief:
    id: PBR
    name: Product brief
    axis: product
    born_in: F4
    template: templates/PBR.md
    path: [products/<p>/PBR.md]
    lifecycle: living
    status: [active, draft]
    id_fields: [derives_from]

  problem-statement:
    id: PRB
    name: Problem statement
    axis: initiative
    born_in: F1
    template: templates/PRB.md
    path: [initiatives/<i>/PRB-NNN-slug.md]
    lifecycle: immutable
    status: [active, superseded]
    id_fields: [supersedes]

  hypothesis:
    id: HYP
    name: Solution hypothesis
    axis: initiative
    born_in: F1
    template: templates/HYP.md
    path: [initiatives/<i>/HYP-NNN-slug.md]
    lifecycle: immutable
    status: [open, confirmed, refuted, partially-confirmed]
    id_fields: [derives_from]

  workflow:
    id: WF
    name: Current / target / delta workflow
    axis: product
    born_in: F2
    template: templates/WF.md
    path: [products/<p>/WF.md]
    lifecycle: living
    status: [active, draft]
    id_fields: [derives_from]
    sections: [current, target, delta]

  evidence-brief:
    id: EVD
    name: Problem evidence brief
    axis: initiative
    born_in: F2
    template: templates/EVD.md
    path: [initiatives/<i>/EVD-NNN-slug.md]
    lifecycle: immutable
    status: [active, superseded]
    id_fields: [supersedes, derives_from]

  competitor-comparison:
    id: CMP
    name: Competitor comparison
    axis: initiative
    born_in: F3
    template: templates/CMP.md
    path: [initiatives/<i>/CMP-NNN-slug.md]
    lifecycle: immutable
    status: [active, superseded]
    id_fields: [supersedes, derives_from]

  data-feasibility:
    id: DFB
    name: Data feasibility brief
    axis: initiative
    born_in: F3
    template: templates/DFB.md
    path: [initiatives/<i>/DFB-NNN-slug.md]
    lifecycle: immutable
    status: [active, superseded]
    id_fields: [supersedes]

  solution-design:
    id: SD
    name: Solution design + MVA
    axis: initiative
    born_in: F4
    template: templates/SD.md
    path: [initiatives/<i>/SD-NNN-slug.md]
    lifecycle: immutable
    status: [active, superseded]
    id_fields: [supersedes]

  evaluation-plan:
    id: EVP
    name: Evaluation plan
    axis: product
    born_in: F4
    template: templates/EVP.md
    path: [products/<p>/EVP.md]
    class_note: frozen for RC
    lifecycle: living
    status: [active, draft]

  data-contract:
    id: DC
    name: Data contract
    axis: product
    born_in: F4
    template: templates/DC.md
    path: [products/<p>/contracts/DC-NNN-slug.md]
    class_note: versioned
    lifecycle: living
    status: [draft, active, deprecated]
    # `draft` is the interface designed and not yet agreed. It is needed because a DC is
    # written *before* it is signed: it is the document where the decisions blocking the
    # signature get collected. Both alternatives are worse. Declaring it `active` means
    # telling consumers they can rely on it. Not writing it until it is closed means
    # having nowhere to write down what is blocking it.

  decision-record:
    # `leaves_open:` is a list of register entries, and `[]` is the answer when a decision
    # settles everything it touched. It is not in `required` here on purpose: the schema
    # stays quiet and `REG012` reports the absence at `warn`, so a repository written
    # against an earlier version keeps validating while it catches up.
    #
    # The third time this distinction has been bought in this file, and the same one every
    # time: `entries: {}` against an absent `entries:`, `products: [all]` against absent,
    # and now `leaves_open: []` against absent. "I looked and there is nothing" is a
    # statement somebody made. Nothing is a gap. A decision that names what it did not
    # settle is the difference between an open question and a question nobody wrote down --
    # and the second is what a `DEC` declaring an open point in its prose leaves behind,
    # because no register holds it and no count of open decisions includes it.
    #
    # `[unregistered]` is the third state, and it was missing. A decision can leave something
    # open whose entry has not been written -- the ordinary reason is a register withdrawn
    # and never reimported -- and written as absence it produced the finding for "nobody
    # looked" on a decision where somebody had looked and said so. It goes alone or beside
    # the ids that do exist, `REG014` reports it, and `product.index.yaml` carries
    # `open_unregistered` because a question with no entry cannot appear in a view built
    # from registers, which is the complaint that produced the state in the first place.
    id: DEC-ADR
    name: 'Decision record: product **or** architecture'
    axis: platform
    born_in: anywhere
    template: templates/DEC-ADR.md
    path: [decisions/DEC-NNN-slug.md]
    lifecycle: immutable
    status: [proposed, accepted, superseded]
    id_fields:
    - supersedes
    # `derives_from` was read by the validator -- `REG002`, and the traceability view -- and
    # was in no schema, so `derives_from: 12` was as legal as the thing anybody meant. It is
    # `may_be_empty` because `DEC-018` carries `[]`, and there that is a statement and not a
    # gap: the decision closes no register entry, and writing an `OD` in would be `REG002`.
    - derives_from: {may_be_empty: true}
    enums:
      # The field that determines the nature of the decision. One register, one
      # numbering, one folder: separate registers would leave cross-product decisions,
      # the most expensive ones, with no home.
      scope: [product, architecture, platform]

  architecture:
    id: ARC
    name: Current / target / delta architecture
    axis: product
    born_in: F5
    template: templates/ARC.md
    path: [products/<p>/ARC.md]
    lifecycle: living
    status: [active, draft]
    id_fields: [derives_from]
    # Three sections, for the reason `WF` has three: a target only means something set
    # against what exists, and the value is in the delta. Separate files would leave two
    # architectures diverging with nothing to say which one the code must match.
    #
    # The boundary that has to hold: §delta is structural, the `RMP` is temporal. §delta
    # enumerates what is missing, the `RMP` says in what order and on what evidence. The
    # MVA is not a fourth section: it is what §current is at the end of the MVP, recorded
    # as designed in the `SD`, and the target is not the MVA plus more.
    sections: [current, target, delta]
    # `verified_code` is a commit map, and at design time there is no commit to verify
    # against: demanding it from `draft` would forbid designing before implementing,
    # which is the order the framework prescribes. From `active` it is mandatory again,
    # because an architecture declared current and unverified describes what somebody
    # hopes was built, and at a glance it is indistinguishable from one that describes
    # the real system.
    required_if_active: [verified_code]
    # ON `verified_code`. One field per repository, keyed the way `code:` is keyed and
    # qualified by where that key lives, because a product and the platform may each have a
    # `backend` and an attestation must not be ambiguous about which one it measured.
    #
    # It replaces `verified_against`, which carried one hash and was being asked two
    # different questions. `skills/release/SKILL.md` had both, twenty lines apart: line 45
    # recovers the frozen plan with `git show <verified_against>:products/<p>/EVP.md`, which
    # is a commit of the documentation, and line 66 said it "names the commit the evaluation
    # actually ran on", which is a commit of the code. One repository made those the same
    # thing. Five do not.
    maps:
      verified_code:
        keys: "^(product|platform)\\.[a-z][a-z0-9._-]*$"
        scalar: "^([0-9a-f]{7,40}|COMMIT_HASH)$"

  runbook:
    id: RB
    name: Runbook + SLO + monitoring
    axis: product
    born_in: F6
    template: templates/RB.md
    path: [products/<p>/RB.md]
    lifecycle: living
    status: [active, draft]

  evaluation-report:
    id: EVR
    name: Evaluation report
    axis: product
    born_in: RG
    template: templates/EVR.md
    path: [products/<p>/releases/EVR-NNN-slug.md]
    lifecycle: immutable
    status: [active]
    # The four fields that make an evaluation report an evidence document rather than a
    # claim: which version of the plan it was measured against, the hash proving that
    # version was frozen before the results were seen, the commit of *this* repository that
    # holds that frozen plan, and the commits of the code that was measured.
    #
    # `frozen_at` and `verified_code` were one field. They answer different questions and
    # only looked like one question while the documents and the code shared a repository:
    # `git show` needs the first and the attestation is the second.
    required: [evp_version, evp_hash, frozen_at, verified_code]
    # ON `verified_code`. One field per repository, keyed the way `code:` is keyed and
    # qualified by where that key lives, because a product and the platform may each have a
    # `backend` and an attestation must not be ambiguous about which one it measured.
    #
    # It replaces `verified_against`, which carried one hash and was being asked two
    # different questions. `skills/release/SKILL.md` had both, twenty lines apart: line 45
    # recovers the frozen plan with `git show <verified_against>:products/<p>/EVP.md`, which
    # is a commit of the documentation, and line 66 said it "names the commit the evaluation
    # actually ran on", which is a commit of the code. One repository made those the same
    # thing. Five do not.
    maps:
      verified_code:
        keys: "^(product|platform)\\.[a-z][a-z0-9._-]*$"
        scalar: "^([0-9a-f]{7,40}|COMMIT_HASH)$"


  release-note:
    id: REL
    name: Release note (for humans)
    axis: product
    born_in: F6
    template: templates/REL.md
    path: [products/<p>/releases/REL-NNN-slug.md]
    lifecycle: immutable
    status: [active]

  release-manifest:
    id: RLM
    name: Release manifest (for machines)
    axis: product
    born_in: F6
    template: templates/RLM.yaml
    path: [products/<p>/releases/RLM-NNN-slug.yaml]
    lifecycle: immutable
    status: [active]
    generated: true
    products: exactly-one

  signal-log:
    id: LOG
    name: Signal log
    axis: product
    born_in: F5
    template: templates/LOG.md
    path: [products/<p>/LOG.md]
    lifecycle: append-only
    status: [active]

  ingestion-register:
    id: ING
    name: Business corpus ingestion log
    axis: platform
    born_in: day one
    template: templates/ING.md
    path: [ING.md]
    lifecycle: append-only
    status: [active]
    sections: [claims, contradictions, to-review]

# ─────────────────────────────────────────────────────────────────────────────
# Findings from the recovery
#
# Every one of the 28 types above was checked against the template that declares it. The
# `status` value in each template's front matter is a member of that type's enum, and
# every declared `lifecycle` matches. The recovery turned up two gaps, both in files the
# validator had never looked at, because `templates/` is in `skip_dirs` and so the
# validator has never checked the templates it validates everything else against. Both
# are now closed, and the reasoning is recorded here because this repository has no
# `decisions/` of its own:
#
# 1. `templates/RLM.yaml` carried neither `status` nor `owners`. `status` was added.
#    `owners` was not: the file also carries `approvals`, with who, which role and when,
#    so a second field answering "who is accountable for this release" would have put the
#    same fact in two places inside one file. What no field said was that nobody writes
#    this file at all, which is why `generated_by` took the slot instead. See the note on
#    `generated` above.
#
# 2. `templates/RLM.yaml` and `templates/product.yaml` used `product:` in the singular
#    while every other artifact used `products:` as a list, and the cross-product checks
#    read the plural. The product manifest, the one file that most authoritatively says a
#    product exists, was invisible to the check that looks for products with no `PBR`.
#    Both were renamed to `products:`, and "exactly one" moved from being implied by the
#    field name to being a constraint a machine can check.
#
# Not recovered here, still only in git at `acaded9^`, and needed when the validator is
# rebuilt: the check catalog with its codes and messages (FM001-FM008, LC001-LC004,
# ID001, REF001-REF004, SEC001, XP001-XP003, CHG001-CHG002, RLM001-RLM002, REG001-REG003),
# the `last_review` instant parsing with its refusal to treat a half filled timestamp as
# midnight, and the index generators. Those are implementation. This file is the part
# that was specification with nowhere to live.
  roadmap:
    id: RMP
    name: Progressive implementation roadmap
    axis: product
    born_in: F4
    template: templates/RMP.md
    path: [products/<p>/RMP.md]
    lifecycle: living
    status: [active]
    # THE ORDER OF THE INCREMENTS, WHERE A SCRIPT CAN READ IT. A roadmap in use grew a
    # table of phases in prose: which increments come first, which wait for which, and a
    # milestone named at the end of one of them. The daily digest needed exactly that to
    # draw a timeline, and could not read a table, so the person kept a second copy of the
    # order by hand in the digest's state. Same move as `OPEN.md` and the commitments: the
    # facts a machine joins on go into the front matter, and the body keeps the argument.
    #
    # Both maps are optional. A roadmap without them is the roadmap of 4.2.0 and nothing
    # reports it; one with them is checked by `RMP001`-`RMP005`, at warn, so that an
    # inconsistency in the plan never stops a morning's digest.
    #
    # `delivery_stages` and not `stages`: `product.yaml` carries `stage:`, the framework
    # phase of the product, one letter away, and `FM006` reports a key one letter from a
    # field something reads. The stages are the order of delivery, and the name says so.
    # Their ids are short lowercase slugs, `t0`, `t0a`, `t1`, which a YAML reader keeps as
    # strings: a bare `0` would become a number.
    #
    # No dates, here or anywhere in this document: the date of a milestone lives in the
    # digest's state, beside the hours and the sizes. An increment has no size either: it
    # is worth the sum of what composes it -- the `OD` and `KI` it `requires`, which come
    # first, and the `CHG` that realise it. A `CHG` names its increment in its own
    # `derives_from`; `changes` is only for the older ones that do not, because a `CHG` is
    # immutable and cannot be made to name it afterwards.
    maps:
      delivery_stages:
        keys: "^[a-z][a-z0-9_-]{0,23}$"
        fields:
          required: [name]
          optional: [milestone]
          lists: [after, increments]
          list_items:
            after: "^[a-z][a-z0-9_-]{0,23}$"
            increments: "^INC-(\\d{3,}|NNN)$"
          empty_lists: [after]
      increments:
        keys: "^INC-(\\d{3,}|NNN)$"
        fields:
          required: [state]
          lists: [depends_on, requires, changes]
          enums:
            # The three maturities of the body table, and the one state the body never had:
            # done. Without it every finished increment reads as still to do to whatever
            # retells the roadmap, the presentation first.
            state: [committed, shaped, conditional, delivered]
          list_items:
            depends_on: "^INC-(\\d{3,}|NNN)$"
            requires: "^(OD|KI)-(\\d{3,}|NNN)$"
            changes: "^CHG-(\\d{3,}|NNN)$"
          empty_lists: [depends_on, requires, changes]

  impact-classification:
    id: ICG
    name: Impact classification gate
    axis: product
    born_in: loop
    template: templates/ICG.md
    path: [products/<p>/cycles/ICG-NNN-slug.md]
    lifecycle: immutable
    status: [proposed, accepted, superseded]
    id_fields: [supersedes]
    sections: [intake, classification, open-questions]
    # One document per cycle, one row per candidate. `routing` is where each candidate
    # goes and there is exactly one answer per candidate; `impacts` is what it touches on
    # the way and a candidate can touch several, which is why the two are separate fields
    # and not one longer enum. `templates/CHG.md` already carried the four impacts as
    # separate flags while the gate upstream could only emit a single verdict, so a data
    # contract breaking with no product or architecture movement had to be filed as
    # something it was not.
    maps:
    # Every candidate looked at goes in `routing`, including the ones that turned out not
    # to be candidates. That is what makes triage state a question you can ask the
    # documents: `LOG` is append-only and could never carry a "handled" column, so without
    # this every cycle re-reads the whole log and guesses which signals are new.
      routing:
        required: true
        one_of: [none, product, architecture, both,
                 hypothesis-invalidated, problem-invalidated,
                 not-classifiable, not-a-candidate]
      impacts:
        any_of: [architecture, data, ai, risk-compliance]

  change-contract:
    id: CHG
    name: Change contract
    axis: product
    born_in: loop
    template: templates/CHG.md
    path: [products/<p>/changes/CHG-NNN-slug.md]
    lifecycle: immutable
    status: [draft, approved, implemented, verified, rolled-back]
    # DECLARED IN 3.0.0, AND READ BY THE VALIDATOR SINCE LONG BEFORE. `CHG002` and `CHG001`
    # both read this field -- they look in it for the `DEC` and the `EVR` a classification
    # demands -- and it was in no schema, so `derives_from: 12` was as legal here as it was
    # on a `DEC` before 2.8.x closed the same hole there. It is also the field that names a
    # `SIG` more often than any other in the framework, which is what made the omission
    # matter once references had a shape: the type most likely to carry a qualified
    # reference was the one type whose reference field nothing was checking.
    id_fields: [derives_from]
    sections: [what-changes, what-must-not-change, how-we-know-it-worked]

  cycle-plan:
    id: IMP
    name: Cycle implementation plan
    axis: product
    born_in: loop
    template: templates/IMP.md
    path: [products/<p>/IMP.md]
    class_note: replaced
    lifecycle: living
    status: [active]

  risk-register:
    id: RSK
    name: 'Risks: state / acceptances / events'
    axis: product
    born_in: F3
    template: templates/RSK.md
    path: [products/<p>/RSK.md]
    lifecycle: living
    status: [active]
    sections: [state, acceptances, events]
    # §state in front matter, for the same reason as the commitments beside it: the rows
    # were a markdown table and nothing could read one. `commitment` is the field that pair
    # was missing -- a risk about a promise names the promise, and in a real repository a
    # commercial risk tracked a claim that `COMMITMENTS.md` did not contain at all, which
    # is a risk nobody can renegotiate because there is no promise to renegotiate.
    #
    # `commitment: none` is the declared absence, and it exists because the first version of
    # the check was wrong about a whole class of risk. A commercial risk is not always about
    # a promise: an untested market hypothesis, a comparison drawn against the wrong
    # competitor set, an intellectual property transfer nobody completed are all commercial
    # exposures and none of them was said to anybody. `category` cannot answer this -- the
    # vocabulary there is where a risk comes from, not whether somebody promised something --
    # so without `none` the only way to stop `REF006` asking was to file the risk under a
    # category that was false. A check whose cheapest repair is a lie is a check that
    # teaches the habit its own skill spends half a page warning against.
    #
    # The body keeps the mitigation, the owner and the argument. §acceptances and §events
    # stay prose entirely: an acceptance is somebody's signature under a sentence, and an
    # event is a story with a date.
    #
    # From 3.0.0 that sentence is the whole rule rather than an intention: the category, the
    # likelihood, the impact and the state were columns of §state and fields of the map at
    # once, and they are fields only now. `body_ids` is the first cell of each §state row,
    # which `REG015` compares against the keys of the map. §events also names risks, and it
    # is not read here: it is a history, and a closed risk keeps its events.
    body_ids:
      from: table
      section: state
      map: risks
    maps:
      risks:
        may_be_empty: true
        keys: "^RSK-(\\d{3,}|NNN)$"
        fields:
          required: [category, state]
          optional: [likelihood, impact, commitment]
          # `decided_in` names the decision this row follows from, and it is the same field
          # `STACK.md` carries on a stack row -- same name, same shape. A list, because the
          # exposure is created by one decision and the guard against it can come from
          # another: `RSK-033`, the row this field came from, follows from two. Adoption is
          # forward only: existing rows do not carry it, and no check asks for it until they
          # do.
          lists: [decided_in]
          enums:
            # `security` is not `compliance`: one is whether a rule is broken, the other is
            # whether somebody gets in, and a framework with `ai` and no `security` is a
            # list that grew by accident.
            #
            # `organisational` is the risk that the person is not there. This framework is
            # built around a human in the loop -- half its decisions are about who reads
            # what before what happens -- and it had no way to file the risk that the shift
            # is unstaffed. The first repository to try wrote it in the register's prose,
            # which is where things go when the vocabulary has no room.
            category: [technical, data, ai, security, compliance, commercial,
                       organisational, vendor]
            state: [open, mitigated, accepted, transferred, closed, expired]
            # `C` is not a fourth degree of likely, it is the end of the scale: the thing has
            # happened, or the estimate that contradicts the claim is already written down.
            # A scale whose maximum is "high" forces the honest answer to be no answer, and
            # a risk with no likelihood drops out of every ordering that reads one -- which
            # is a worse outcome than a wrong letter, because it is an invisible one.
            likelihood: [L, M, H, C]
            impact: [L, M, H]
