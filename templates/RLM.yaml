# ── Anti-patterns ────────────────────────────────────────────────
# · Filling it in by hand: you get it wrong and you never update it. Generate it.
# · rollback.target empty: it makes the manifest useless at the one moment it is needed.
# · rollback.tested always false: then you don't have a rollback plan, you have the intention.
# · Omitting prompt_hash or model_version in AI systems: they are the two things that change
#   the behavior without changing a line of code.
