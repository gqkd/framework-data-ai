# Product manifest, machine-readable.
# The sections marked GENERATED are meant to be regenerated, not hand written. See the
# note at the bottom for what that means today.

schema: framework/product-manifest/v1
artifact_type: product-manifest
lifecycle: living                # the artifact class, as in every other file
status: active
products: [product-a]            # exactly one: a manifest describes one product
name: Commercial name
one_liner: What it does, for whom, in one line.
owners: [NAME]
created: YYYY-MM-DD
last_review: YYYY-MM-DD HH:MM

# Where the PRODUCT sits in the lifecycle. The field is called stage and not lifecycle
# because lifecycle is already the artifact class, and the same name for two different
# things is exactly what this framework exists to prevent.
stage:
  block: A | B | C            # discovery | shaping | operation
  phase: F1 | F2 | F3 | F4 | BUILD | DEPLOY | RUN
  last_gate_passed: G3
  last_gate_decision: DEC-007
  next_gate: G4
  mor_completed: false

release:                       # GENERATED
  current: REL-004
  manifest: RLM-004
  deployed_at: null
  rollback_target: RLM-003

platform:
  shares: [identity, data-access, deploy, observability]
  arc_delta: products/product-a/ARC.md

# Where this product's code lives. One entry per repository, however many there are.
#
# This exists because the documentation does not have to live with the code, and often
# should not: a project that keeps its documents in their own repository has nothing else
# to say where the code is, and an agent told to read the document and then act can read
# and then not know where to go.
#
# `contains` is one line and it is the field that does the work: with five repositories the
# name alone does not say which one to open.
#
# `path` is where it is expected to be checked out, relative to this repository, so that an
# agent can reach it. Relative and not absolute, because an absolute path is true on one
# machine. Omit it for a repository nobody clones locally.
code:
  frontend:
    url: git@github.com:org/product-a-frontend.git
    contains: the customer-facing app. React, and the only place UI copy lives
    path: ../product-a-frontend
  backend:
    url: git@github.com:org/product-a-backend.git
    contains: the API and the domain logic. Owns the database migrations
    path: ../product-a-backend

artifacts:                     # GENERATED
  living:
    - path: products/product-a/PBR.md
      last_review: YYYY-MM-DD HH:MM
      stale: false
  immutable_count: 0
  append_only:
    - products/product-a/LOG.md

open_decisions: [OD-001, OD-003]   # GENERATED from OPEN.md
open_risks: []                     # GENERATED from RSK.md §state
active_changes: []                 # GENERATED: the CHG records with status approved

entry_points:                      # where an agent starts, by kind of activity
  understand: [README.md, products/product-a/PBR.md, products/product-a/ARC.md]
  implement: [products/product-a/IMP.md, products/product-a/changes/]
  operate: [products/product-a/RB.md]
  evaluate: [products/product-a/EVP.md]
  data: [products/product-a/contracts/]

roles:
  product: NAME
  tech: NAME

# On the GENERATED sections: today nothing regenerates them. No tooling exists yet, so you
# fill those fields in by hand, and they have to be treated as hand written. A section
# labeled "generated" that is in fact written by hand is a section nobody rereads,
# because everyone assumes something keeps it true. Until the generator exists, that
# label is a promise the repository is not keeping, so either keep the fields honest or
# delete the ones you will not maintain.
#
# Which fields are derivable and which are not, and why this does not need a dedicated
# skill: SKILLS.md §7.
