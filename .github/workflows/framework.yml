# The framework checked against itself, on every push.
#
# The validator skips `templates/` and `schemas/` when it runs on a project, which means
# nothing was checking the definition that everything else is checked against. That is how
# `templates/RLM.yaml` went without `status` and `owners` for as long as it did. This
# workflow is what closes it.
#
# THE EVAL CASE FILES ARE COVERED HERE TOO, AND THERE IS NO SECOND STEP FOR THEM ON PURPOSE.
# `evals/` needs a model, which is why the runs are not in CI -- but *loading* the case files
# needs nothing, and `evals/trigger/cases.yaml` sat unparseable for four days because nothing
# read it between manual runs. `tests/selfcheck.py` now parses every case file and checks the
# counts `evals/README.md` prints against the same parse, so the step below already runs it.
# A separate `python -c "import yaml..."` line here would be a second authority on the same
# question, which is the thing this framework spends its rules against.

name: framework

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # THE HISTORY, AND NOT ONLY THE COMMIT. `actions/checkout` clones one commit
          # unless it is told otherwise, and two checks in this suite ask git about commits
          # that are not HEAD: a pin at an older commit of this framework has to read as a
          # checkout that moved, and a pin at a commit that never existed has to read as a
          # line nobody verified. In a one-commit clone every commit is absent, so both
          # collapse into the second, and the suite went red on every push for a week --
          # four problems, none of them about the framework, all of them about the clone.
          # `ci/pull-request.yml` already asks for this on the project's own checkout.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt -c constraints.txt
      - run: python -m pip check
      - run: python tests/selfcheck.py
