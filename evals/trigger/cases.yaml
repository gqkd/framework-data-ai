  expect: none
  why: 'trap: extraction, but of tables to CSV, not a business corpus'
- prompt: fai un check del framework su questo repo e dimmi cosa non torna, poi sistema quello che si
    può sistemare senza rischi
  expect: audit
- prompt: fammi girare il validator su questo repo e dimmi cosa esce, ieri il CI si lamentava di LC002
    su tre file e non ho capito perche'
  expect: audit
  why: the validator, and a check code
- prompt: 'fammi l''audit del repo: voglio sapere quanti documenti living sono scaduti e quali reference
    sono rotti'
  expect: audit
  why: stale living documents and broken references
- prompt: genera il manifest per la release 007 di atlas, mi serve prima della call delle 15
  expect: release
- prompt: go ahead and implement a redis cache in front of the scoring lookup, ARC#current says atlas-web
    queries the warehouse on page load and it's slow on Monday mornings
  expect: cycle
- prompt: guarda qui
  expect: start
- prompt: half of these documents look ancient, some say last_review 2024. is anything in /repos/atlas
