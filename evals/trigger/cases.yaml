  expect: audit
- prompt: ho ereditato un repo con un po' di dbt models e due DAG airflow e zero documentazione. il cliente
    vuole sapere cosa fa. come mi muovo?
  expect: start
- prompt: ho questi PowerPoint del commerciale (sono tipo 4 deck piu' un paio di pdf dell'offerta) e devo
