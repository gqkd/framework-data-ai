- prompt: e' tutto a posto nel repo? fammi girare i controlli
  expect: audit
  why: running the checks
- prompt: esegui il deploy in produzione di atlas su prod-eu-west-1, fai il rollout progressivo al 10%
    e poi al 100%
  expect: none
  why: a deploy. release prepares evidence and explicitly must not deploy
- prompt: explain what a decision record is and when I am supposed to write one instead of just a comment
