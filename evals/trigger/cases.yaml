cases:
- prompt: OD-004 has been sitting in OPEN.md for two months, we finally decided to go with Snowflake.
    close it out properly
  expect: resolve
  why: closing an open decision is what resolve does, DEC included
- prompt: abbiamo avuto un incidente stanotte, l'accuracy in produzione e' crollata a 0.62, dobbiamo tornare
    alla 1.6
  expect: release
  why: 'a production regression after a deploy: rollback, which is release''s other half'
- prompt: abbiamo deciso con il team che la coda di riconciliazione passa su redis invece che sulla tabella
    postgres, era diventata un collo di bottiglia sotto carico. dai una sistemata ai file del progetto
    che sennò fra un mese non se lo ricorda piu' nessuno
  expect: requirement
- prompt: abbiamo deciso di usare Postgres come primary datastore invece di Mongo, segnalo da qualche
    parte prima che me lo dimentico
  expect: requirement
  why: a decision taken, stated in prose, with no file named
- prompt: abbiamo deciso di usare un solo identity provider per tutti e due i prodotti, aggiungilo dove
    va
  expect: requirement
  why: same, and the description claims this case explicitly
- prompt: abbiamo promesso a Rossi nell'offerta commerciale di aprile che il report di chiusura sara'
    disponibile entro il quinto giorno lavorativo del mese. mi sa che questa va scritta da qualche parte
    perche' nessuno se la ricorda
  expect: requirement
- prompt: 'add a new requirement for the forecasting product: the batch job has to finish before 6am CET.
    write it into the right artifact'
  expect: requirement
  why: a functional requirement stated in prose
- prompt: add that a 'movimento sospeso' is a bank movement with no matching accounting entry after 30
    days. everyone on the team is using the phrase to mean something slightly different and it's causing
    arguments in standup
  expect: requirement
- prompt: 'aggiorna l''EVP di atlas: dal prossimo ciclo vogliamo alzare la soglia di citation precision
    a 0.93'
  expect: requirement
  why: a threshold change is a fact to record, EVP is its one home
- prompt: 'aggiungi al glossario la definizione di cliente attivo che abbiamo concordato ieri col cliente:
    almeno un ordine negli ultimi 90 giorni'
  expect: requirement
  why: a definition belongs in GLOSSARY
- prompt: aggiungi al parcheggio di OPEN.md che potremmo vendere il forecast anche ai fornitori
  expect: requirement
  why: the parking lot of OPEN.md is a routing destination
- prompt: apriamo un change per il rename di cust_id in customer_id nella tabella atlas_scores, RevOps
    lo vuole come stringa per il loro nuovo export CRM
  expect: cycle
- prompt: 'apriamo un ciclo: cosa costruiamo nel prossimo sprint? ho tre SIG aperti in LOG e due incrementi
    in RMP'
  expect: cycle
  why: opening a cycle from SIG and RMP is the intake step verbatim
- prompt: are we ready to ship v1.7 of atlas to prod-eu-west-1? build is green, image digest is in the
    CI log
  expect: release
- prompt: 'before we merge #218 can you check the docs are still consistent — there''s a new DEC in decisions/
    and i''m fairly sure the ARC of the product didn''t move with it'
  expect: audit
- prompt: can we release? the eval finished last night and every number in EVR-007 looks green to me
  expect: release
- prompt: can you review the python in scripts/ingest/ for bugs before i merge this branch, especially
    the retry logic around the API calls
  expect: none
  why: reviewing python for bugs is not documentation work
- prompt: che differenza c'e' fra ARC.md#target e ARC.md#delta in questo framework? non mi e' chiaro quale
    dei due dovrei aggiornare quando cambio un componente
