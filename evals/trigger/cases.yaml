  why: a question about the framework, not an action on a repository
- prompt: 'chiudiamo il ciclo: CHG-041 e CHG-042 sono implementate, l''eval e'' passata, manca solo la
    parte documentale'
  expect: release
- prompt: cosa facciamo in questo ciclo? ho tre richieste arrivate dal cliente
  expect: cycle
  why: deciding what to build next
- prompt: cosa mettiamo nell'MVP e cosa no
  expect: resolve
- prompt: 'cut a release for atlas: rc.2 passed the eval suite this morning, tag is v1.7.0, commit 53ffb07'
  expect: release
- prompt: cut the 1.4.0 release, update the release manifest and write the release note
  expect: release
- prompt: dammi i task per gli agenti, ho tre CHG approvati su atlas e voglio far girare i coding agent
    stanotte
  expect: cycle
- prompt: 'definiamo il prodotto: ho letto il brief e non so da dove iniziare'
  expect: resolve
- prompt: definiamo l'architettura di retail-forecast, il target non esiste ancora
  expect: resolve
- prompt: devo aggiungere l'export in Excel della risk list, il CSM di Northwind me l'ha chiesto due volte
