  resolve: /tmp/claude-1000/-home-giulioquaglia-projects-framework-data-ai/230c4237-bfa4-489f-a899-bf94b69aa58e/scratchpad/eval-resolve/fixtures/ordering-a

  # A project with business documents and no framework in it, which is the only state
