# The same register, read in two different orders.
#
# `ordering-a` and `ordering-b` hold identical entries with identical fields. Only the
# sequence inside each cost-to-reverse section differs, and the permutation is chosen: in
# `a` the first entry read (OD-002) is also the one that should be worked first, so an
# agent echoing file order looks right; in `b` the first entry read is OD-001, which
# belongs seventh.
#
# So the order produced has to be the same for both. If it is not, the ranking is coming
# from the sequence of the file rather than from the fields, and it will change the next
# time somebody edits the register for an unrelated reason.
#
# The two fixtures were byte identical until this was noticed, which means the stability
# question could not have failed however the skill behaved.
#
# Two entries contradict the heading they are filed under, on purpose: OD-009 sits under
# LOW and declares `Cost to reverse: high`, OD-001 sits under HIGH and declares medium.
# Reading the field rather than the section is what tells them apart. OD-009 also declares
# `Depends on: OD-011`, which exists nowhere: no check catches that, so finding it means
# having read the entry.

prompt: >-
  risolviamo gli open, sono fermi da due mesi. da quale partiamo e in che ordine andiamo
  avanti?

fixtures_root: evals/fixtures/build/resolve

cases:
  - fixture: ordering-a
    expect: an order taken from the fields, and no decision taken
    because: >
      The entries with high cost to reverse and no default in force come before the rest:
      nothing is holding the line on them, so waiting costs more than deciding on
      incomplete information. There are four of them and this said three until 2026-08-18,
      naming OD-002, OD-007 and OD-009 and leaving out OD-004 -- which is what `OD005`
      reports about OD-004 in as many words, and what `OD003` has been listing all along.
      Both runs of that day read the validator and said four. A count in prose, again, and
      this time the fixture's own output was the thing that contradicted it.

      A dependency outranks its tier, so OD-008 is worked before OD-005 which declares
      `Depends on: OD-008`. OD-009 is read on its declared cost rather than on the LOW
      heading it sits under, and OD-001 on its declared medium rather than the HIGH
      heading.

      WHERE OD-009 GOES IS OPEN, AND THE RUNS DISAGREE WITH THIS FILE. Read on its
      declared cost it belongs in the first tier, which is what the paragraph above asks
      for. Both runs of 2026-08-18 took it out of the order entirely instead, on the
      ground that it declares `Depends on: OD-011` and no register anywhere declares
      OD-011: an entry nobody can work is not first, it is not ranked. That is defensible
      and arguably better than what was asked for -- ranking it first sends somebody at a
      decision that cannot be taken this morning -- and both runs then said the same
      thing, that OD-011 is either stale or a typo and the user has to say which. Recorded
      rather than folded into the expectation, because two runs agreeing is not yet a
      rule.

      `OPEN.md` must not be edited and no `DEC` written: the skill lays out the choice and
      the user takes it. A run that closes an entry has done the one thing the register
      exists to prevent.

  - fixture: ordering-b
    expect: the same order as ordering-a
    because: >
      Same register, entries permuted within their sections. The order produced has to
      match `ordering-a` item for item. Anything else means the sequence of the file is
      doing the ranking.

      It matches, as of 2026-08-18. Both fixtures produced OD-007, OD-002, OD-004, OD-008,
      OD-005, OD-001, OD-003, with OD-006 deferred and OD-009 held out of the order, item
      for item and for the same stated reasons. Read the run before reading the pass: what
      makes it a pass is that the ranking survived the permutation, not that the list is
      the only defensible one.

      It did not match before, and the run that found that is worth keeping. The
      constraints held in both then too: OD-008 before the OD-005 that depends on it,
      OD-007 before the OD-004 it unblocks. What moved was the free choice between two
      entries equal on cost and both forced by an undated event, and the two runs weighed
      those events differently: one put the identity provider first because its window
      closes on external users, 151 people to re-enrol and a conversation with the DPO to
      redo; the other put the repository split first because its window closes when
      store-ops takes its own CI, which is the nearest event of any. Today both chose the
      repository split, and both gave the reason the second one gave. One agreement is not
      determinism: this is the case to run with `--runs 5` before anybody calls it stable.

      THE FIXTURE MOVED UNDER THIS RESULT ON 2026-08-18, AFTER THE RUNS. `deadline` became
      `trigger` in 2.0.0 and the three entries whose deadline was a bare date -- OD-005,
      OD-001, OD-008 -- now name the event that forces them instead: the DPO review, the
      Monday the analyst is on leave, the missed Sunday run somebody has to explain. That
      removes the one thing in this register that could be sorted rather than judged, which
      is the whole point of the rename and also the reason the match above cannot be carried
      forward. It was measured against a register with three dates in it. Re-run before
      anybody reads the order below as current.

      None of the four runs reasoned from position in the file, which the run before them
      did in as many words and which is why these two fixtures stopped being identical.
      The rule added after that removed the wrong reason without making the answer
      determinate, and saying so is more honest than tightening it until the two agree:
      two defensible orders from the same register is a fact about the register, not only
      about the skill, and it stays a fact on the day they happen to coincide.
