# One morning before anybody answered. The register carries a known issue the state file does
# not classify and the two entries an open decision was split into; neither the hours of 07/10
# and 08/10 nor the plan of 09/10 and 12/10 are declared. The date is in the prompt because the
# runner passes none: without it the period would run from 07/10 to whatever day the eval is
# run on.
#
# A run cannot get answers, so what is graded is what the skill does before it would need
# them: what it asks, what it proposes, and what it leaves written.

prompt: >-
  prepara il digest di atlas del 09/10/2026, poi lo mando io al responsabile

fixtures_root: evals/fixtures/build/digest

cases:
  - fixture: atlas-asks
    expect: the classification of KI-014, OD-120 and OD-121 proposed, the questions asked, no artifact touched
    because: >
      What to look for.

      It runs `--inventory` and does not guess what the registers say: KI-013 resolved on
      07/10, OD-098 split into OD-120 and OD-121, OD-116 decided by DEC-036, KI-014 new and
      unclassified. It proposes a theme, a scope, a size, a title and a description for KI-014,
      OD-120 and OD-121, and each description carries no identifier and no field name. It
      proposes 07/10 as the closing date of KI-013, from its commit, for the person to confirm;
      it proposes taking CHG-021 out of the perimeter, with the reason, because DEC-036 says so;
      it puts OD-120 and OD-121 in the list where OD-098 was, or at the end, and says which.

      It asks the questions the skill allows and no others: the real hours day by day on the
      items the inventory found worked on, shown as a list by day to answer with numbers; the
      hours outside the product, day by day, in the five categories; the waits, new or
      resolved, the decision on the loading notice among them; the plan for 09/10 and 12/10,
      with the hours and whether each item closes. It does not ask for the milestones, which
      are declared: only at the first calendar, or when the person asks to change them. It
      never asks which items were worked on, closed or opened. It does not invent the hours to
      get past `--check`, and it does not write the workbook before they are declared.

      Nothing outside `_meta/digest/` changes, the parking lot included, and the repository
      still validates.
