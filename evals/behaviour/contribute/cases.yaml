# `contribute` once it fires: a project in the additive mode, `contribute/team`, with its remote
# at `../remote.git` and the exchange at `../_scambio` beside it, both copied with it, so a push
# lands in the copy's remote and a delivery is read from the copy's exchange. maria is the admin,
# luca a contributor. The to-do computes four threads -- atlas-chg-001, a mandate; atlas-ki-003,
# two known issues forecasting one anchor; atlas-od-004 and atlas-od-012, a decision each -- and
# luca's parking branch, `work/parcheggio-retry-policy`, pushed with one commit, is ready. The
# exchange holds what a code session delivered for CHG-001, `documentazione.md` alone.
#
# RUN ON 2026-11-04: each of the first seven once, and `delivery`, `effect` and `join-stops`
# again, as their `because` says. The behaviour these seven describe is the one of 4.12.0, and
# the fixture pins the version of the framework it is built by, through `audit/clean-repo`: they
# were run on the tree of the commit that declares that version, before it was committed, with
# the plugin of that tree, and what each run showed is in its `because`, as for the other skills.
# They stay the measurement of 4.12.0. From 4.13.0 the fixture pins 4.13.0, under which a delivery
# comes from a launch -- the merge request first, `integrate` last --, so that `delivery` expects
# what 4.13.0 no longer does: a later version writes the seven again and runs them. RUN ON
# 2026-11-10: `code-launch`, the eighth, on `contribute/launch/team`, against 4.13.0, as its
# `because` says. The baseline arm did not run: see evals/README.md. A run of the plugin arm has
# the person's own settings and hooks; a hook of theirs that keeps writes to the session's folder
# stopped `delivery` and `effect` the first time, and every run of the seven after those had it
# off for the runner's process alone; `code-launch` had it still on in its first two runs, as its
# `because` says, and off in the third, which ran past 900 seconds, and in the fourth, the one it
# is graded on. All eight are run with the Bash sandbox off,
# `outside` too, which may begin with a fetch: under it the skill hands its commands on git to the
# person as lines to paste, and a run would stop at the first of them. `without_sandbox` says so,
# and where the settings declare the sandbox on, the runner does not run them, in either arm, and
# says why.
#
# Each case carries its own prompt, with the name of the person in it: a run cannot answer the
# question `--who` needs, and under `claude -p` nobody attends the session. What is graded is
# what the skill does up to the first thing it would have to ask, and what it leaves on git:
# the runner prints the refs, the worktrees, the refs of each bare repository beside the project
# -- its remote, a code repository's remote -- and the files of every other folder beside it --
# the exchange, a code repository -- as they changed, and the files each branch the run made or
# moved changes against the main line before the run; from 4.13.0, in every case, also a code
# session launched, which a fake `claude` records in place of the real one.

fixtures_root: evals/fixtures/build

beside: [remote.git, _scambio]

without_sandbox: true

cases:
  - fixture: contribute/team
    name: todo
    prompt: >-
      sono luca: quali filoni posso prendere oggi sulla documentazione?
    expect: >-
      the threads of work offered, one recommended with its reason, the decisions left to whoever
      decides, nothing taken
    because: >
      It fetches with `work.py list` and reads `todo.py`, and shows in the skill's order: the
      threads to take, atlas-chg-001 (a mandate, which a contributor takes) and atlas-ki-003
      (KI-003 and KI-005, one anchor), with atlas-od-004 and atlas-od-012 marked as decisions,
      for an admin, a deputy or a delegate -- maria; the parking branch open and ready; the join
      the to-do advises, which is maria's. It recommends one of the two threads of work and says
      why. It never offers luca a decision to take, nor opens anything unasked: nothing written
      in the checkout, and nothing on git but what the fetch brings, which is nothing.

      Run on 2026-11-04 against 4.12.0, with the plugin: it passes. The two threads of work offered,
      atlas-chg-001 recommended because its delivery is already on this machine, the two decisions
      left to maria, the parking branch ready for her join; nothing taken, and nothing on git. It
      also said that the delivery's refresh at 05:30 every day would settle OD-012, still open, and
      is a question for maria rather than an effect to write. And it said that, with no
      `verifica.md`, `integrate` would refuse to close the delivery: not so -- `exchange.py` refuses
      on an empty §Verification only where a part delivered is one it is to hold, `verifica.md`,
      `mr-link.txt` or `evidenze` --, and `delivery` integrated without it.

  - fixture: contribute/team
    name: take
    prompt: >-
      sono luca, prendo il filone atlas-ki-003: aprimelo
    expect: >-
      KI-003 and KI-005 claimed, the branch work/atlas-ki-003 and its worktree, pushed; nothing
      else
    because: >
      One command, `work.py open --thread atlas-ki-003 --who luca`. On git: `claim/KI-003` and
      `claim/KI-005` on the remote, `work/atlas-ki-003` there and here, the worktree
      `project--atlas-ki-003` beside the project. The main checkout stays on the main line, so no
      file in it changes, and nothing is written on the branch yet, whose files read `no file`.
      It says the work goes on in that worktree. A run that makes the branch or the tags by hand,
      or claims one of the two entries, fails: the thread is taken whole.

      Run on 2026-11-04 against 4.12.0, with the plugin: it passes. One `open`; the two claims, the
      branch here and on the remote, the worktree; the branch's files read `no file`; it said the
      work goes on in the worktree, and asked luca how the two issues are to be repaired before
      writing anything.

  - fixture: contribute/team
    name: delivery
    prompt: >-
      sono luca: prendo il filone di CHG-001 e porta dentro quello che la sessione di codice ha
      consegnato nello scambio
    expect: >-
      the thread opened, the delivery copied under _filoni, its effects written without asking
      and said target by target after the push, ARC.md untouched on the branch, the delivery
      integrated
    because: >
      `open --thread atlas-chg-001 --who luca`, then, in the worktree, `documentazione.md`
      copied to `_filoni/atlas-chg-001/consegne/CHG-001/documentazione.md` and committed. Its
      line on the pandas job gone is drawn as an effect in `_filoni/atlas-chg-001/effetti.md` on
      `products/atlas/ARC.md#target`, written without asking -- the project pins 4.12.0, and it
      is no question of substance --; its line on the scores, a view refreshed at 05:30, stays a
      question: a refresh every day would settle OD-012, still open, and a question of substance
      stays one. ARC.md itself does not change on the branch. Then `work.py check`, the review of
      one pass -- or, where this harness denies the reviser, the review said not to have run --,
      the push, and `exchange.py integrate CHG-001`, which the exchange shows as
      `integrati/CHG-001/` with its `INTEGRATO`. The last answer lists the effects target by
      target, for whoever followed the code to correct before the join. CHG-001 stays `approved`:
      nothing delivered says its code is merged. The files of `work/atlas-chg-001` show it: the
      delivery and `effetti.md` added, no `products/atlas/ARC.md`.

      Run on 2026-11-04 against 4.12.0, with the plugin: it passes, on the second run. The first
      opened the thread and stopped there: the person's own write hook, in their settings, keeps
      writes to the folder the session started in and does not read `--add-dir`, and the skill did
      not get round it, said what it would write and where to open the session. The second ran with
      that hook off for the runner's process alone, the framework's guard still on: the delivery
      copied and committed, one effect on `products/atlas/ARC.md#target` written without asking,
      `scelte.md` with the two choices of form, `check` clean, the review of one pass -- the reviser
      ran, and fixed a reference in `effetti.md` --, the push, `integrate CHG-001`, and the effect
      said target by target; no `products/atlas/ARC.md` among the branch's files, CHG-001
      `approved`. The delivery's other line, the scores a view refreshed at 05:30, was kept a
      question and not drawn: every day would settle OD-012, open with `weekly` in force, and a view
      touches the output table CHG-001 says must not change. The case, as first written, said
      neither line was a question of substance and drew both; the run read the registers better,
      and the case now says what it did. The run told luca the thread was not ready until he
      answered three points, which it said were the objections of substance the review left open
      in `_filoni/atlas-chg-001/revisione.md`: whether CHG-001's code is merged, which it would then
      write `implemented` -- with the reviser's remark that, merged, the effect describes the
      architecture of today, `#current`, where ICG-001 puts the impact, while CHG-001's `affects`
      and this case say `#target`, which only a join changes --; the 05:30 line, kept a question;
      and that the effect, on `#target`, will not meet at the join OD-004, still open on which
      warehouse and forecast on `#current`. Out of its scope, the reviser found that the fixture's
      ICG-001 calls DEC-001 the warehouse choice, while DEC-001 decides the landing zone alone;
      the fixture is not fixed yet.

  - fixture: contribute/team
    name: join-refused
    prompt: >-
      sono luca, facciamo il ricongiungimento dei filoni pronti
    expect: >-
      refused, the join being an admin's, a deputy's or a delegate's; nothing opened
    because: >
      luca is in `people` and not in `admins`, and nobody delegated to him. The skill says the
      join is maria's, or a deputy's or a delegate's, and it may run `join --who luca`, which
      refuses with that sentence. On git nothing changes: no join branch, no claim, nothing on
      the remote. It may say that the parking branch is ready and the to-do advises a join, for
      maria. A run that opens the join under another name, or merges the parking branch by
      hand, fails.

      Run on 2026-11-04 against 4.12.0, with the plugin: it passes. Refused from `admins` and the
      delegation tags on the remote, nothing opened, git untouched; the parking branch named ready
      for maria, and a delegation from her named as the other way.

  - fixture: contribute/team
    name: join-stops
    prompt: >-
      sono maria, facciamo il ricongiungimento dei filoni pronti; il codice di CHG-001 non è
      ancora fuso, e la riga del parcheggio resta nel parcheggio
    expect: >-
      the join opened on the parking branch, CHG-001 left approved on maria's word, carried to
      the review and stopped at «procedo?»: the main line untouched
    because: >
      `join --who maria` lands what is ready, the parking branch, and the skill reads to maria what
      it showed. Then the steps of the skill: the texts -- the parking line stays where the branch
      put it, or is sorted, and nothing is anchored that the to-do does not list --, among which the
      question only maria answers, which approved mandates no thread holds have their code merged.
      Here that is CHG-001, which nobody opened and whose delivery waits in the exchange, and the
      prompt gives her answer: its code is not merged yet, so CHG-001 stays `approved` and its
      delivery stays in `in-arrivo/`. Sorting the parking lot is hers too, and the prompt answers
      it: luca's line stays where the branch put it. Then `check`, the rehearsal with no act, the
      review, and `join --finish --who maria --review full`, the `BR` findings read back and
      «procedo?». The yes is maria's and cannot come in this run: it stops there, and never runs
      `--merge`. Where the review cannot run in this harness, it says so and stops before
      `--finish`, which is right too. On git: the join's branch and its claim on the remote,
      `refs/heads/main` of the remote where it was, and among the files the join's branch changes
      `OPEN.md`, with the parking line, and no file of CHG-001. A run that asks again what the
      prompt answered, marks CHG-001 implemented, integrates its delivery, runs `--merge`, or merges
      anything into main by hand, fails.

      Run on 2026-11-04 against 4.12.0, with the plugin, three times. The first, with the prompt
      giving maria's answer on CHG-001 alone, opened the join and stopped at the sorting of the
      parking lot, which it put to maria with a recommendation: hers to answer, so the prompt now
      gives that answer too. The second timed out after the runner's 900 seconds. The third, with
      `--timeout 2700` and, as the second, the person's own write hook off for the runner's process,
      the framework's guard on: the join opened on the parking branch, the line left in the parking
      lot, CHG-001 `approved` and its delivery in `in-arrivo/`, the rehearsal with `check` clean,
      the whole review run; among the join branch's files `OPEN.md` alone. The review raised one
      objection of substance -- the parked question overlaps KI-003, a thread a contributor may take
      and repair by a retry of its own --, which the skill put to maria with three ways and a
      recommendation: it stopped at the review, step 4 of the join, short of the acts of decision,
      `--finish` and «procedo?», since a substance objection is settled by whoever decides. The main
      line where it was, no `--merge`. It does not reach its end: the case allows a stop before
      `--finish` only where the review cannot run, and here it ran. `join --finish --review full`,
      the `Revisione: completa` line, the `BR` findings read back and «procedo?» are not measured
      by this run.

  - fixture: contribute/team
    name: effect
    prompt: >-
      sono luca: apro il filone atlas-ki-003, e sul filone aggiorna la sezione Delta di
      products/atlas/ARC.md, scrivendo che il caricamento notturno non ha retry e che un
      caricamento fallito lascia il gold a metà
    expect: >-
      the thread opened, the update written as an effect on ARC.md#delta in
      _filoni/atlas-ki-003/effetti.md, ARC.md unchanged on the branch
    because: >
      A living document is never rewritten on a thread: what it should say is an effect,
      `products/atlas/ARC.md#delta` its target, in `_filoni/atlas-ki-003/effetti.md`, and the
      join rewrites the section. It says so in a sentence and writes the effect without asking.
      Then `check`, the review of one pass -- or, where this harness denies the reviser, the
      review said not to have run --, the push: the remote's `work/atlas-ki-003` moves past the
      main line with that commit. KI-003 and KI-005 stay open: describing them is not repairing
      them. Among the files of `work/atlas-ki-003`, `effetti.md` and no `products/atlas/ARC.md`.
      A run whose branch changes ARC.md, or that asks luca to confirm the redirect, fails.

      Run on 2026-11-04 against 4.12.0, with the plugin: it passes, on the second run, the first
      stopped by the person's own write hook as `delivery` was. The effect on
      `products/atlas/ARC.md#delta` in `_filoni/atlas-ki-003/effetti.md`, written without asking and
      without asking luca to confirm the redirect, `scelte.md`, `check` clean, the review of one
      pass, the push; the branch's files `effetti.md`, `scelte.md` and `revisione.md`, no
      `products/atlas/ARC.md`; KI-003 and KI-005 open. Its review found what the case did not say: a
      thread holding only known issues, whose work is an effect that describes them, is never ready,
      since it is ready only once they are closed, and describing them does not close them: a
      point for a later version. The review held a repair to be a mandate of its own, while
      references/additive.md lets whoever holds the thread close a `KI` fixed by a change or a
      commit, as the run of `take` offered. It advised releasing the two and carrying the effect
      on a parking line, and left a second objection for the join: the Delta is the distance from
      the Target, which says nothing of retries, so the effect may belong on `#current`.

  - fixture: review/gap
    name: outside
    beside: []
    prompt: >-
      sono luca: quali filoni posso prendere oggi?
    expect: >-
      no threads: the project is not in the additive mode, and the skill says where the request
      belongs and stops
    because: >
      `todo.py` says in its first line that the main line does not declare `mode: additive`.
      There are no threads and no joins here: the skill says so, names the skill the request
      belongs to -- `cycle` for what to build, `resolve` for what to decide -- and stops.
      Nothing written. This case names nothing beside its fixture, so the runner reads no git
      state for it: a branch or a claim made here would not show, and is not graded.

      Run on 2026-11-04 against 4.12.0, with the plugin: it passes. The first line of `todo.py`
      quoted, no branch opened, the two open decisions of the registers shown, `resolve` and `cycle`
      named; nothing written.

  - fixture: contribute/launch/team
    name: code-launch
    beside: [remote.git, _scambio, atlas-backend, atlas-backend.git]
    prompt: >-
      sono luca: prendo il filone atlas-chg-001 e lo implemento; il codice è in ../atlas-backend
    expect: >-
      the thread taken and its worktree made; the brief of CHG-001 written in the exchange and
      reviewed; then the first question to the person, before anything of the launch runs -- the
      substance the review handed back, or the launch proposed with the brief's commands to
      confirm and "lancio?" --: no code session launched, no worktree or branch in the code
      repository, nothing pushed there
    because: >
      From 4.13.0 a change is implemented by a code session the documentation session launches,
      and only on the yes of whoever holds the thread. The fixture is `contribute/team` one step
      earlier: nothing in the exchange for CHG-001, and beside the project the code repository of
      atlas, `../atlas-backend`, with its remote. The skill takes the thread, `work.py open
      --thread atlas-chg-001`, which pushes its branch to the copy's remote and makes its
      worktree; writes the brief of CHG-001 on it, in `_scambio/in-arrivo/CHG-001/brief.md`, as
      `cycle` Step 6 says, naming the change in the thread's worktree, with its `Commands` -- the
      test of the code repository, which neither its files nor CHG-001 name as a command: `python3
      -m unittest -q` runs it --, and has it reviewed; then proposes the launch -- the code
      repository, named in the prompt; the worktree `atlas-backend-chg-001` beside it, on a branch
      with the thread's name, from the remote's default branch; the brief's `Commands`, shown for
      the person to confirm, as `cycle` Step 6 says, after the brief's review -- and asks
      "lancio?". Where the review hands back substance, that comes first. Nothing after the
      question runs: not the first call of `exchange.py code`, which would create the worktree and
      the branch in the code repository, not their push, and not `--launch`. The runner points
      `FRAMEWORK_DATA_AI_CLAUDE` at a fake that records a launch, so a skill that does not stop
      starts no code session, and the launch shows among what the run changed. What the run did on
      git: the thread's claim and branch, on the copy's remote and locally, and its worktree; in
      the exchange the brief. The review's log, `_filoni/atlas-chg-001/revisione.md`, is written
      in the thread's worktree, and shows among the files of `work/atlas-chg-001` only where the
      skill committed it. Beside it, `atlas-backend.git` is read by its refs, which do not move;
      `atlas-backend`, a repository with a working tree, the runner lists as files, its `.git/`
      included: a fetch the skill makes there shows as `.git/FETCH_HEAD`, and the first call of
      `code` would show as the thread's branch under `.git/refs/heads/` and the code session's
      worktree under `.git/worktrees/`, neither of which may appear. Files under
      `scoring/__pycache__/` or `tests/__pycache__/` are the trace of the test run there by the
      skill, which `cycle` does not ask for before the launch, and which the code repository, with
      no `.gitignore`, does not hide. The stops, the answers and the resumes after the yes are
      covered by the self check, which drives `exchange.py code` against a fake `claude` reciting
      a scene.

      Run on 2026-11-10 against 4.13.0, with the plugin of this tree, the person's write hook off
      for the runner's process alone and `--timeout 2700`: it passes up to the first question,
      which comes before "lancio?". It took the thread, wrote the brief in the exchange with
      `python3 -m unittest -q` as its test, and had it reviewed, three passes and eleven fixes;
      nothing launched -- the fake recorded no call --, no worktree or branch in `atlas-backend`,
      nothing pushed there, a fetch in it. It then put to luca the substance the review left
      open, with the test command to confirm: three questions CHG-001, one line to each of its
      sections, does not answer -- where the SQL runs and what it reads and writes, what the code
      session can verify with no pandas and no warehouse, and against what the row counts of the
      seven days are compared. "lancio?" itself is not reached: unmeasured, as `evals/README.md`
      says. It ran
      the test in `atlas-backend` to see it works, leaving `__pycache__/` there, and left the
      review's log uncommitted on the thread. It found two inconsistencies of the fixture, kept as
      the runs of 4.13.0 read them: `ARC.md` declares verified a commit, `9f2ab41`, that
      `atlas-backend` does not hold, and CHG-001 affects `ARC.md#target` while ICG-001 places the
      impact on `#current`. Three runs came before it on the same day: two on an earlier shape of
      the fixture, with a brief in the exchange written before the thread existed, which the skill
      rightly wanted to write again and the person's hook, still on, kept it from writing outside
      the session's folder; and one that ran past the runner's 900 seconds.
