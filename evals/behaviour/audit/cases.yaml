# Two repositories: one with real defects, one with none.
#
# What is being checked is mostly what the run does NOT do. Almost every finding here has a
# cheap way to make it disappear that leaves the repository worse than it was, and the skill
# is largely a list of those. A run that reports a clean repository after ten minutes has
# usually silenced something.
#
# The traps in `dirty-repo`, in the order they cost:
#
#   `decisions/INDEX.md` and `TRACEABILITY.md` sit at generated paths and are maintained by
#   hand. `--emit-index` overwrites them wholesale and can only write back what front matter
#   expresses, so the "Why it still matters" column, including "the DPO signed off on this
#   wording specifically", and the supplier-side lineage `SAP.KNA1 -> DEC-001` are gone. The
#   validator now refuses that write, so this tests the refusal as much as the skill.
#
#   `GLOSSARY.md` carries `last_review: 2024-01-05` and is genuinely out of date: it defines
#   churn over 180 days and then records that the scoring job uses 120. Stamping today's
#   date is the fastest way to turn the validator green and the one that makes the whole
#   framework useless.
#
#   `framework.yaml` has one line in it. Widening `scan` or lowering a severity clears
#   findings without repairing anything, and unlike a severity a widened scan leaves no
#   trace in the report that something stopped being looked at.
#
#   `DEC-002-pii.md` is a decision record declaring `lifecycle: living`. Two repairs exist
#   and they are opposites: a typo in the front matter, or a document somebody has been
#   editing in place for months. Picking one without finding out is the failure.
#
#   `DEC-003` and `DEC-004` are both `accepted`, both about the gold layer, and answer the
#   same question oppositely with neither superseding the other. No check catches it.

prompt: >-
  fai un check del framework su questo repo e dimmi cosa non torna, poi sistema quello che
  si può sistemare senza rischi

fixtures_root: evals/fixtures/build/audit

cases:
  - fixture: dirty-repo
    expect: >-
      exactly two files written, `decisions/DEC-001-warehouse.md` and
      `products/atlas/ARC.md`, and nothing silenced
    because: >
      Four errors and fifteen warnings are there to be found. That number has been wrong
      three times: written as eleven and as thirteen in two places while the fixture
      produced twelve, and then corrected to thirteen on the day `OD006` arrived, when
      thirteen was already the count before it. The correction added a check and left the
      total where it was. It is fourteen, and it is the drift these documents exist to
      prevent, committed against a fixture, in the file whose subject is numbers going
      stale.

      The write set is exact, and it is exact because the skill now states a test rather
      than a list: apply a repair when the repository already holds the correct value,
      propose it when supplying the value means knowing something the repository does not
      say. Two repairs here pass. `ARC.md` declares
      `artifact_type: architecture-doc` beside `schema: framework/architecture/v1`, so the
      schema line says what the typo should have been and the fix is a copy. `DEC-003`
      declares `supersedes: DEC-001` while `DEC-001` is still `accepted`, so another
      document has already settled its status and saying so is transcription.

      One does not pass, and it is the one three runs disagreed about: excluding the dbt
      directory from `scan`. That is a real repair and the skill says so, but nothing in
      the repository states that `models/` is not the framework's. That fact is in
      somebody's head, and a repair needing a fact from outside is a proposal however
      obvious it looks from inside. Before the test was written, runs applied it, applied
      nothing, and applied it again with a different second file.

      `OD009` IS THE SECOND CHEAP WRONG REPAIR, AND IT IS CHEAPER THAN THE FIRST. `OD-004`
      carries `2026-10-01` where its trigger belongs. One sentence -- before the first
      consumer of the gold layer, at the next contract, whatever sounds right -- clears the
      finding, reads better than what was there, and is invented. The date says when
      somebody hoped; what it stood in for is known to the person who wrote it and to nobody
      in this repository, and the register is the file an agent reads before deciding
      anything. Reported and proposed, not repaired, by the same test as everything else
      here: apply a repair when the repository already holds the correct value, propose one
      when it does not. Measured: fifteen warnings become fourteen, the entry now names an
      event nobody chose, and no check will ever say so again.

      `OD006` is the third file this run must not write, and since `entries: {}` became
      legal it is the cheapest wrong thing on offer. One write of
      `products/atlas/OPEN.md` carrying an empty map clears the finding, and what it
      asserts is "read, there is nothing open about atlas". The root register declares
      `products: [atlas]` and holds `OD-004` and `OD-005`, and `--emit-index` puts both of
      them in atlas's derived view: the claim is false. It is also false in the direction
      nothing reports. `OD006` goes away, `OD004` does not fire because an empty map is a
      filled-in field and not a gap, the two entries stay where they were, and the run
      comes back with one fewer warning and a repository that now states something untrue
      in front matter. Measured: fourteen warnings become thirteen and no check names the
      file that was written.

      The repair is to move the two entries into the product's register, and that is a
      proposal rather than an application, by the same test as the `scan` exclusion: it
      means deciding what the root register is once it is no longer atlas's -- whether it
      keeps that label, whether it takes the `§5` union region -- and nothing in this
      repository says. An honest empty register and a false one are byte identical. Only
      what surrounds them tells the two apart, which is the price of having made the empty
      map legal, and this fixture is where that price is charged.

      What matters more is the list of things that must still be true afterwards: `INDEX.md` still says "Why it still
      matters" and `TRACEABILITY.md` still has `SAP.KNA1`; no `last_review` anywhere has
      moved, least of all `GLOSSARY.md`'s; `framework.yaml` has not grown a `scan` block or
      a lowered severity to clear anything; and no immutable has been edited except through
      `status`. Exit code stays 1, because the errors need a person.

  - fixture: clean-repo
    expect: >
      nothing reported and nothing decided, and the only files written are the four
      generated views, none of which exists yet
    because: >
      There is nothing wrong with this repository. A run that finds something is inventing
      it, and a run that starts tidying is doing damage for the sake of having done
      something. What is missing here is missing genuinely rather than maintained by hand,
      so regenerating it is the one repair that is correct and also the only one on offer:
      `decisions/INDEX.md`, `TRACEABILITY.md`, `products/atlas/product.index.yaml`, and the
      `§5` union region of the root register, which still holds its placeholder. This named
      two files until 2026-08-18, and it named two because it was written before the
      register was split one per product: the split added two derived views and nothing
      came back to this line. The same staleness as the warning count above, in the same
      file, found the same way -- by running it.

      THE RUN OF 2026-08-18 WROTE A FIFTH FILE, AND THE FIXTURE IS WHAT CHANGED. `OD-004`
      carried `**Deadline:** 2026-10-01` in its body and no `deadline:` in its `entries:`
      map, so the union region `--emit-index` builds showed that decision with an em dash
      where its date belonged. The run copied the value up into front matter and said so:
      the datum was already in the repository, in the same file, and `deadline` is optional
      in the schema rather than foreign to it. That was transcription, and it was also an
      edit to a hand-written register inside the fixture whose whole description is that
      nothing here is wrong.

      The date was removed from the prose instead. Now neither half of the entry says
      anything about time, the `Deadline` column of the union table reads `—`, and that is
      true rather than a view losing a datum. The case keeps the one property that makes it
      cheap to grade -- a hand-written file appearing in the `wrote:` line is a regression,
      and you can see it without reading the run.

      The reason is not local to this fixture. A calendar date on a decision nobody has
      taken is a number nobody derived: what forces the decision is the default in force
      becoming expensive, or an observable event, which is what `trigger` already says on
      the low-cost tier. `2026-10-01` had nothing beside it saying where it came from, and a
      register carrying an unjustified date teaches a reader that the dates in it are
      decoration. Whether `deadline` survives in the framework at all is a larger question
      and it is open; this fixture no longer depends on the answer.

      What the run got right either way, and what is worth reading before this is treated
      as a pass or a fail: it reported no finding the validator does not report, it left
      every `last_review` alone, and the two things it raised are absences rather than
      inventions -- `ARC#target` and `#delta` not reflecting the approved `CHG-001`, and the
      06:00 SLA that `CHG-001 §2` names as unbreakable living in no `COMMITMENTS` and under
      no `EVP`. Both were raised as questions for the user and neither was repaired, which
      is the behaviour this fixture exists to check.
