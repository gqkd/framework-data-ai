# The pull request against the contract that authorizes it.
#
# Copy to `.github/workflows/pull-request.yml` in the project. Two jobs in one: the
# validator on the artifacts, which is what `audit` runs everywhere else, plus the pull
# request context -- the text that cites the `CHG` and the list of files the change set
# touches -- which is what turns `PR001` to `PR004` on.
#
# THE FRAMEWORK IS REFERRED TO BY PATH. There is no package to install yet, so this checks
# the framework repository out beside the project. Pin `ref:` to the version the project
# declares in its own `framework.yaml`: a CI job that silently follows the framework's main
# branch turns every change made here into a build failure over there, which is the exact
# confusion `FW001` exists to prevent.

name: pull request

# Legacy compatibility asset: it does NOT authenticate a documentary base or receipts.
# For strict opt-in and independent CI inputs, see references/contributions.md and
# ci/contribution.yml. Do not turn this pull_request job into a privileged job.
permissions:
  contents: read

on:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # THE WHOLE HISTORY, FOR TWO REASONS. The base branch has to be there for the diff
          # below. And from 4.0.0 the checks on `last_review` read the commit behind every
          # attested line: in a one-commit clone that commit is absent, so the validator
          # stops with exit 2 and a message saying to fetch, rather than guessing. On
          # GitLab the same setting is `GIT_DEPTH: 0`, on Azure Pipelines `fetchDepth: 0`.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: OWNER/framework-data-ai
          # The commit the project pins in `framework_commit`, or the tag of the version
          # it declares. Not a branch: a job that follows the framework's main branch turns
          # every change made there into a build failure here, which is the confusion
          # `FW001` exists to prevent and `FW003` to catch.
          #
          # WHICH VERSIONS HAVE A TAG, SO THAT THE SENTENCE ABOVE IS TRUE AND NOT ROUGHLY
          # TRUE. `v2.8.0`, and then every version from `v3.0.0` on -- each bump is tagged as
          # it lands. `2.8.1` to `2.8.10` have none and will not get one: a tag invented
          # afterwards is a release label on a commit that was never released. On one of
          # those, pin the commit; `FW003` reports a report produced by any other one, so
          # the commit form is the one that binds either way.
          ref: COMMIT_OR_TAG
          path: .framework
          # The framework's history as well: `FW003` tells a pin that never existed from a
          # checkout that moved by asking whether the commit is in it, and in a one-commit
          # clone every commit is absent. `migrate.py` reconstructs the previous validator
          # out of the same history.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r .framework/requirements.txt -c .framework/constraints.txt

      - name: which files this change set touches
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git diff --name-only \
            "origin/$BASE_REF...$HEAD_SHA" > /tmp/changed.txt
          cat /tmp/changed.txt

      - name: the artifacts, and the contract that authorizes the change
        env:
          # Through the environment and not through the command line: a pull request body
          # is text somebody else wrote, and interpolating it into a shell command is how a
          # backtick in a description becomes a command.
          PR_TEXT: "${{ github.event.pull_request.title }}\n${{ github.event.pull_request.body }}"
        run: |
          # `%s` and not `%b`. The body is text somebody else wrote, and `%b` expands
          # backslash escapes inside it: `\c` truncates the rest of the output, which would
          # drop the line citing the contract and turn a correct pull request into `PR001`.
          # The newline between title and body is already a newline: YAML resolves the
          # escape in the double quoted value above.
          printf '%s' "$PR_TEXT" > /tmp/pr.txt
          python3 .framework/skills/audit/scripts/validate.py \
            --root . \
            --pr-text-file /tmp/pr.txt \
            --changed-files /tmp/changed.txt
