# The tags and the work branches of documentation written on branches: what was changed on
# them by hand, which no hook on a machine stops, said after the fact.
#
# Copy to `.github/workflows/refs.yml` beside `branches.yml`, in a project that declares
# `.framework/work.yaml`, and fill it as that one: `OWNER` and `ref:` the same. It is a file of
# its own so that `branches.yml` listens, as before, to the pull requests and the main line only:
# a run of it on the push of a pull request's branch would carry a second `pull-request` check,
# skipped by its condition, and a job skipped that way, says GitHub's documentation on using
# conditions to control job execution, reports success and "will not prevent a pull request from
# merging, even if it is a required check" -- a protection could open on the skip. Its own job,
# `refs`, is never a required check: on most pushes it is skipped.
#
# WHAT IT SEES. A reservation (`id/...`) deleted or moved, a delegation (`delega/...`) moved in
# the additive mode, and a work branch -- named by the `branch_prefix` of the main line's
# `.framework/work.yaml` -- pushed with force open an issue of their own. `work.py` does none of
# the three: a number it reserved and did not use stays burned, a delegation is given once and
# taken back by deleting it, and a branch is brought up to date by merging the main line, never
# by a rebase. Deleting a claim, a delegation or a branch is legitimate -- `release`, `revoke`,
# `join --close` -- and is not said.
#
# WHAT IT CANNOT SEE, by GitHub's rules for these events: more than three tags pushed, or deleted,
# at once make no event; a push runs the copy of this file in the commit it pushes, so a tag
# moved, or a work branch forced, onto a commit that does not carry this copy -- an older one, or
# one on a branch that has not merged the main line since -- runs nothing; a deletion runs only
# the copy on the default branch; and a push runs nothing when its head commit asks GitHub to skip
# the workflows: `[skip ci]`, `[ci skip]`, `[no ci]`, `[skip actions]` or `[actions skip]` in the
# message, or a `skip-checks: true` trailer.
#
# WHAT IT COSTS. Every push of a branch other than the main line, of a reservation or of a
# delegation, and every deletion, starts a run whose job is skipped, at no cost, but in the cases
# above and two more where it runs and says nothing -- a branch outside the prefix pushed with
# force and, outside the additive mode, a delegation moved: its condition cannot read the
# project's prefix or mode. Then two checkouts, the install of the framework's requirements and a
# few lines of Python.

name: refs

permissions:
  contents: read

on:
  push:
    # Every branch but the main line, which `branches.yml` reads: a work branch pushed with
    # force, whose prefix the project's `.framework/work.yaml` declares and this file cannot
    # name. Of the tags, the reservations and the delegations; a claim is taken and let go
    # legitimately.
    branches-ignore: [main]
    tags: ["id/**", "delega/**"]
  # A deleted tag. GitHub takes no filter on this event and runs it with the copy of this file on
  # the default branch only; the `push` of a deletion is not read, so that it is said once.
  delete:

jobs:
  refs:
    # A reservation deleted, its name in either form; a reservation or a delegation moved; a
    # branch other than the main line pushed with force. Nothing else starts it: a claim, a
    # delegation or a branch deleted, a tag or a branch created, a ref deleted by a push.
    if: >-
      (github.event_name == 'delete' && github.event.ref_type == 'tag' &&
      (startsWith(github.event.ref, 'id/') || startsWith(github.event.ref, 'refs/tags/id/'))) ||
      (github.event_name == 'push' && github.ref != 'refs/heads/main' &&
      !github.event.created && !github.event.deleted &&
      (startsWith(github.ref, 'refs/tags/') || github.event.forced))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: docs
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: OWNER/framework-data-ai
          ref: COMMIT_OR_TAG
          path: framework-data-ai
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r framework-data-ai/requirements.txt -c framework-data-ai/constraints.txt

      - name: what was changed by hand on the tags and the work branches
        env:
          # The event's own fields, through the environment. `ref` is the full ref on a push, and
          # on a deletion the name GitHub gives: both forms are read.
          EVENT: ${{ github.event_name }}
          REF: ${{ github.event.ref }}
          REF_TYPE: ${{ github.event.ref_type }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          CREATED: ${{ github.event.created }}
          DELETED: ${{ github.event.deleted }}
          FORCED: ${{ github.event.forced }}
        run: |
          : > /tmp/alerts.md
          # The mode and the prefix of the work branches, as the main line declares them: a
          # project without `.framework/work.yaml` has no reservations and no work branches.
          if git -C docs show origin/main:.framework/work.yaml > /tmp/work.yaml 2> /dev/null; then
            python3 - /tmp/work.yaml >> /tmp/alerts.md <<'REFS'
          import os
          import sys
          import yaml
          env = os.environ.get
          try:
              declared = yaml.safe_load(open(sys.argv[1], encoding="utf-8")) or {}
          except (OSError, yaml.YAMLError):
              declared = {}
          declared = declared if isinstance(declared, dict) else {}
          additive = declared.get("mode") == "additive"
          prefix = str(declared.get("branch_prefix") or "work/")
          event, ref = env("EVENT", ""), env("REF", "")
          before, after = env("BEFORE", ""), env("AFTER", "")
          said = lambda name: env(name, "") == "true"
          if ref.startswith("refs/tags/"):
              tag = ref[len("refs/tags/"):]
          elif event == "delete" and env("REF_TYPE", "") == "tag":
              tag = ref
          else:
              tag = None
          if event == "delete":
              # A claim or a delegation deleted is `release`, `join --close` or `revoke`.
              if tag and tag.startswith("id/"):
                  print(f"- the reservation `{tag}` was deleted. A reservation is never deleted -- "
                        "a number reserved and not used stays burned --, and without it nothing "
                        "tells somebody else that the number is taken.")
          elif (event == "push" and not said("CREATED") and not said("DELETED")
                and before.strip("0")):
              if tag is not None:
                  what = ("reservation" if tag.startswith("id/") else
                          "delegation" if tag.startswith("delega/") and additive else None)
                  if what:
                      print(f"- the {what} `{tag}` was moved, from `{before}` to `{after}`. It is "
                            "created once and never replaced: what it said is in the first.")
              elif ref.startswith("refs/heads/" + prefix) and said("FORCED"):
                  print(f"- the work branch `{ref[len('refs/heads/'):]}` was pushed with force, "
                        f"from `{before}` to `{after}`. A work branch is brought up to date by "
                        "merging the main line, never by a rebase: commits that were on it may be "
                        "gone, and with them what the exchange and the history name.")
          REFS
          fi
          cat /tmp/alerts.md

      - name: open or update the issue when a tag or a work branch was changed by hand
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNEE: ${{ vars.DOCS_REVIEWER }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.event.ref }}
        run: |
          if [ ! -s /tmp/alerts.md ]; then exit 0; fi
          {
            echo "What was changed by hand in \`$REF\` (\`$EVENT\`), which nothing on the machines stops."
            echo
            cat /tmp/alerts.md
            echo
            echo "Nothing was put back. An admin reads it, with the person who did it where that is known, and either restores what was there -- from a clone that still has the tag or the commits -- or keeps what is there now, saying why."
          } > /tmp/issue.md
          title="Tags and work branches: changed by hand"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" \
                   --json number --jq '.[0].number // empty' || true)
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body-file /tmp/issue.md ${ASSIGNEE:+--assignee "$ASSIGNEE"}
          fi
