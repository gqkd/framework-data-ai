# Optional documentary-only example, not a required PR check or a code-test workflow.
# Copy after reviewing references/contributions.md, replacing OWNER and FULL_FRAMEWORK_SHA,
# adopting the policy and configuring protected default-branch / CODEOWNERS review.
name: inspect documentary contribution
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Documentary PR number to inspect against the protected default branch
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  inspect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
          path: .objects
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: OWNER/framework-data-ai
          ref: FULL_FRAMEWORK_SHA
          fetch-depth: 0
          persist-credentials: false
          path: .framework
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: isolated trusted verifier dependencies
        run: |
          python3 -m venv .verifier
          .verifier/bin/python -I -m pip install -r .framework/requirements.txt -c .framework/constraints.txt
      - name: verify the API base and read proposed Git objects without checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          .verifier/bin/python -I -B .framework/ci/inspect_document_pr.py \
            --project .objects --pr-number "$PR_NUMBER"
