# Documentation written on branches: what each pull request adds, and what reached the main
# line without one.
#
# Copy to `.github/workflows/branches.yml` in a project that declares `.framework/work.yaml`
# and writes its documentation through `skills/audit/scripts/work.py`: one piece of work, one
# branch, one pull request -- or, in the additive mode, one thread per branch and a join that
# lands them on the main line by a local merge. It replaces `pull-request.yml`, whose job is
# its first one: copy one or the other, not both.
#
# EVERY PULL REQUEST SAYS WHAT AUTHORIZES IT. The pull request context below runs `PR001`: a
# documentation pull request that implements no `CHG` carries `no-chg: <reason>` in its body,
# written by a person -- what the reason is, is the review's to judge.
#
# IT DOES NOT BLOCK ANYTHING, AND IT SAYS SO. On a hosting plan without branch protection --
# GitHub's free plan for a private repository -- nothing stops a push to the main line or a
# merge from the button of a pull request that is not up to date. What can be had for nothing
# is to see it within minutes: the pull request carries a red check, and a commit that reached
# the main line outside a pull request, or a merge that produced text neither side had, opens
# an issue. In the additive mode so does whatever reached the main line other than by the join
# of somebody who decides -- a pull request included -- and rules changed by somebody who is
# not an admin. Where the plan has branch protection, make the `pull-request` job a required
# check as well; this file stays the same. In the additive mode a join reaches the main line by
# a local merge, with no pull request, and a protection that requires a pull request, a check
# or a linear history refuses its push: on a main line protected that way either the requirement
# goes, or those who join may bypass it. The framework does not choose between the two.
#
# THE PROJECT AND THE FRAMEWORK ARE CHECKED OUT SIDE BY SIDE, in `docs/` and
# `framework-data-ai/`, as they sit on a person's machine. Inside the project the validator would
# read the framework's own files as the project's -- its fixtures, its decisions, its numbers --
# and inside `.framework/` the checkout would empty the project's folder of the same name. Pin
# `ref:` to the version the project declares, as in `pull-request.yml` -- `v4.8.1` or later: the
# install steps read `constraints.txt`, which no earlier tag holds.
#
# WHAT IT COSTS. On every push to the main line, two checkouts and two runs of the validator
# per commit of the push -- the tree after it and the tree before it -- so that only what the
# commit brought is reported. A push of many commits at once is that many times as long.

name: branches

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: docs
          # The branch as it was written, not the merge GitHub synthesizes for a pull request:
          # the comparison below is with the main line, and against the synthetic merge the
          # point where the branch left the main line is the main line's own tip.
          ref: ${{ github.event.pull_request.head.sha }}
          # All history, every branch and every tag: the attestation checks read the commit
          # behind every attested line, `--base` needs the main line, and `BR003` reads the
          # reservations, which are tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: OWNER/framework-data-ai
          ref: COMMIT_OR_TAG
          path: framework-data-ai
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r framework-data-ai/requirements.txt -c framework-data-ai/constraints.txt

      - name: what this branch adds against the main line (BR001-BR004)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 framework-data-ai/skills/audit/scripts/validate.py --root docs --base "origin/$BASE_REF"

      - name: the generated views are what the branch derives to
        run: |
          python3 framework-data-ai/skills/audit/scripts/validate.py --root docs --emit-index --check

      - name: the pull request context (PR001-PR005)
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Through the environment, never interpolated into the command: see
          # pull-request.yml for why, and for `%s` rather than `%b`.
          PR_TEXT: "${{ github.event.pull_request.title }}\n${{ github.event.pull_request.body }}"
        run: |
          git -C docs diff --name-only "origin/$BASE_REF...$HEAD_SHA" > /tmp/changed.txt
          printf '%s' "$PR_TEXT" > /tmp/pr.txt
          python3 framework-data-ai/skills/audit/scripts/validate.py --root docs \
            --pr-text-file /tmp/pr.txt --changed-files /tmp/changed.txt

  main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The one job that writes anything, and what it writes is an issue. `pull-requests: read`
    # to ask which pull request a commit came from; nothing here can push.
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: docs
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: OWNER/framework-data-ai
          ref: COMMIT_OR_TAG
          path: framework-data-ai
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r framework-data-ai/requirements.txt -c framework-data-ai/constraints.txt

      - name: how each commit reached the main line
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FORCED: ${{ github.event.forced }}
        run: |
          set -u
          : > /tmp/alerts.md
          if [ "$FORCED" = "true" ]; then
            echo "- the main line was force-pushed from \`$BEFORE\` to \`$AFTER\`: commits that were on it may be gone, and what replaced them was not compared with anything." >> /tmp/alerts.md
          fi
          # The first push of the branch has no "before", and after a forced push it is not in
          # this clone: look at the last commit only.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || \
             ! git -C docs cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$AFTER^!"
          else
            range="$BEFORE..$AFTER"
          fi
          if ! commits=$(git -C docs rev-list --first-parent "$range"); then
            echo "- the commits of this push could not be listed ($range): nothing was compared." >> /tmp/alerts.md
            commits=""
          fi
          V=framework-data-ai/skills/audit/scripts/validate.py
          # Who stands in for an admin now: the delegations `work.py delegate` pushed.
          git -C docs for-each-ref refs/tags/delega/ --format='%(contents)' > /tmp/delegations.txt || true
          for sha in $commits; do
            if ! merged=$(gh api "repos/$REPO/commits/$sha/pulls" \
                            --jq '[.[] | select(.merged_at != null)] | length'); then
              merged="?"
            fi
            parent=$(git -C docs rev-parse -q --verify "$sha^1" || true)
            # In the additive mode a join lands by a local merge, not a pull request, and says so
            # in a trailer of the commit `work.py join --finish` makes: reached from the merge's
            # second parent and not from its first, since a commit added after it -- the main
            # line brought in again -- leaves the trailer below the tip. The roles are read from
            # the first parent: from the merge itself, a join that changes `admins` would
            # authorize itself.
            : > "/tmp/join-$sha.txt"; : > "/tmp/work-$sha.yaml"; : > "/tmp/changed-$sha.txt"
            : > "/tmp/subject-$sha.txt"; : > "/tmp/tip-$sha.txt"; : > "/tmp/branch-$sha.txt"
            : > "/tmp/same-$sha.txt"
            if git -C docs rev-parse -q --verify "$sha^2" > /dev/null; then
              git -C docs log --format='%(trailers:key=Ricongiungimento-di,valueonly)' \
                "$sha^1..$sha^2" > "/tmp/join-$sha.txt" || true
              # Who signed the tip of what was merged: the join's name goes to the validator
              # only when the commit on top is the one signed by who decides.
              git -C docs log -1 --format='%(trailers:key=Ricongiungimento-di,valueonly)' \
                "$sha^2" > "/tmp/tip-$sha.txt" || true
              # And only when the merge is what `join --merge` leaves: what it merged holds the
              # main line before it, so nothing of the line is dropped, and its tree is the
              # tip's, so it brings nothing else.
              if git -C docs merge-base --is-ancestor "$sha^1" "$sha^2" && \
                 git -C docs diff --quiet "$sha^2" "$sha"; then
                echo same > "/tmp/same-$sha.txt"
              fi
            fi
            git -C docs log -1 --format=%s "$sha" > "/tmp/subject-$sha.txt" || true
            if [ -n "$parent" ]; then
              git -C docs show "$parent:.framework/work.yaml" > "/tmp/work-$sha.yaml" 2> /dev/null || true
              git -C docs diff --name-only "$parent" "$sha" > "/tmp/changed-$sha.txt" || true
            fi
            python3 - "$sha" "$merged" "/tmp/join-$sha.txt" "/tmp/work-$sha.yaml" \
              /tmp/delegations.txt "/tmp/changed-$sha.txt" "/tmp/subject-$sha.txt" \
              "/tmp/tip-$sha.txt" "/tmp/branch-$sha.txt" "/tmp/same-$sha.txt" \
              >> /tmp/alerts.md <<'JOIN'
          import re
          import sys
          import yaml
          sha, merged, joins, work, delegations, changed, subject, tip, branch, same = \
              sys.argv[1:11]
          def lines(path):
              try:
                  return [l.strip() for l in open(path, encoding="utf-8") if l.strip()]
              except OSError:
                  return []
          def names(value):
              return {str(n) for n in value} if isinstance(value, (dict, list)) else set()
          try:
              declared = yaml.safe_load(open(work, encoding="utf-8")) or {}
          except (OSError, yaml.YAMLError):
              declared = {}
          declared = declared if isinstance(declared, dict) else {}
          additive = declared.get("mode") == "additive"
          admins = names(declared.get("admins"))
          deciders = admins | names(declared.get("deputies")) | {
              l[3:].strip() for l in lines(delegations) if l.startswith("to:")}
          by = lines(joins)
          joined = additive and bool(set(by) & deciders)
          outside = (f"- `{sha}` reached the main line outside a pull request: nobody reviewed "
                     "it, and nothing compared it with the main line before it landed.")
          # The join's branch, for the validator. A push names no branch, and without one the
          # merge reads as a thread's: every living document the join rewrote is a `BR005`, a
          # mandate it withdrew a `BR006`, and under `require_all` each an `AN003`. Only for the
          # merge `join --merge` leaves, "Merge <branch> into <line>", of a join's branch, whose
          # tip is signed by who decides, holds the main line before it and has the merge's tree:
          # a merge by hand that dropped anything of the line or brought anything else, whatever
          # its subject, and commits after the signature are read as before, and a merge that
          # produced text is still named by `LC006`.
          # With the name the checks of a join's branch run too -- the reservations (`BR003`) and
          # the withdrawals a join may not make (`BR006`) --, as `join --merge` ran them before
          # it merged.
          prefix = str(declared.get("branch_prefix") or "work/")
          said = re.fullmatch(r"Merge (\S+) into \S+", (lines(subject) or [""])[0])
          if (joined and said and set(lines(tip)) & deciders and lines(same)
                  and re.fullmatch(re.escape(prefix) + r"ricongiungimento-\d+", said.group(1))):
              with open(branch, "w", encoding="utf-8") as out:
                  out.write(said.group(1))
          if joined:
              pass
          elif additive and by:
              print(f"- `{sha}` reached the main line as a join by {', '.join(by)}, who is not "
                    "an admin, a deputy or a delegate in the `.framework/work.yaml` of the main "
                    "line before it.")
          elif merged == "?":
              print(f"- `{sha}`: GitHub did not say which pull request it came from; look at it by hand.")
          elif additive and merged != "0":
              print(f"- `{sha}` reached the main line through a pull request, not a join: in the "
                    "additive mode the main line changes at a join, where an admin or whoever "
                    "stands in reads what each thread brings.")
          elif merged == "0":
              print(outside)
          rules = sorted(set(lines(changed)) & {".framework/work.yaml", "framework.yaml",
                                                ".framework/expected-findings.yaml"})
          if additive and by and rules and not set(by) & admins:
              print(f"- `{sha}` changes {', '.join(rules)} in a join by {', '.join(by)}, who is not "
                    "an admin: the people and their roles, the framework's version and the "
                    "expected findings are changed by an admin only.")
          JOIN
            # The tree after this commit, validated whole and against the main line before it,
            # and the tree before it, so that only what this commit brought is said: a new error
            # of the combined tree, a merge that produced text nobody read (`LC006` naming this
            # commit), a decision closing an entry already closed.
            if ! git -C docs worktree add -q --detach "/tmp/at-$sha" "$sha"; then
              echo "- \`$sha\`: could not be checked out to be validated." >> /tmp/alerts.md
              continue
            fi
            GITHUB_HEAD_REF="$(cat "/tmp/branch-$sha.txt")" \
              python3 "$V" --root "/tmp/at-$sha" ${parent:+--base "$parent"} --json \
              > "/tmp/at-$sha.json" || true
            : > "/tmp/before-$sha.json"
            if [ -n "$parent" ]; then
              if git -C docs worktree add -q --detach "/tmp/before-$sha" "$parent"; then
                python3 "$V" --root "/tmp/before-$sha" --json > "/tmp/before-$sha.json" || true
              fi
            fi
            python3 - "/tmp/at-$sha.json" "/tmp/before-$sha.json" "$sha" "$parent" >> /tmp/alerts.md <<'PY'
          import json, sys
          after, before, sha, parent = sys.argv[1:5]
          def findings(path):
              try:
                  return json.load(open(path))["findings"]
              except (OSError, ValueError, KeyError):
                  return None
          # A first commit has no tree before it: everything it brings is new.
          now, then = findings(after), (findings(before) if parent else [])
          if now is None:
              print(f"- `{sha}`: the validator gave no report on the tree after it.")
              sys.exit(0)
          if then is None:
              # Without the tree before it there is nothing to tell a new error from a standing
              # one: say so, and keep to what this commit names by itself.
              print(f"- `{sha}`: the tree before it could not be validated, so its errors are "
                    "not compared; only what names this commit is listed.")
          known = {(f["code"], f["path"], f["message"]) for f in then or []}
          for f in now:
              new = then is not None and (f["code"], f["path"], f["message"]) not in known
              if (f["level"] == "error" and new) or f["code"] == "BR002" or (
                      f["code"] == "LC006" and sha[:12] in f["message"]):
                  print(f"- `{sha}`: {f['code']} {f['path']}: {f['message']}")
          PY
          done
          cat /tmp/alerts.md

      - name: open or update the issue when something reached the main line unseen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # The person who reads these, as a repository variable: Settings, Secrets and
          # variables, Actions, Variables, `DOCS_REVIEWER` = their GitHub login. Without it the
          # issue is opened with nobody assigned, and GitHub notifies whoever watches the
          # repository -- not necessarily anybody.
          ASSIGNEE: ${{ vars.DOCS_REVIEWER }}
        run: |
          if [ ! -s /tmp/alerts.md ]; then exit 0; fi
          {
            echo "What reached the main line in push \`$GITHUB_SHA\` and was not seen on its way in."
            echo
            cat /tmp/alerts.md
            echo
            echo "Nothing was reverted. A commit outside a pull request is reviewed now; a merge that produced text is reread, and its living documents attested, in a new piece of work; two decisions on one entry are put side by side by whoever decides that matter. In the additive mode, what reached the main line other than by a join of somebody who decides -- or rules changed by somebody who is not an admin -- is read by an admin, who keeps it, saying why, or brings it back through a join."
          } > /tmp/issue.md
          title="Main line: reached without being seen"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" \
                   --json number --jq '.[0].number // empty' || true)
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body-file /tmp/issue.md ${ASSIGNEE:+--assignee "$ASSIGNEE"}
          fi
