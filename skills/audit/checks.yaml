# Check catalog and default severities
#
# Every check the validator knows how to run is listed here, with what it costs to be
# wrong. Turning one on is editing one line, which is the point: the rule the framework
# gives itself is to add a check when the failure it prevents has already happened once,
# and that rule is unaffordable if each check is a commit of code.
#
# Levels:
#   error   printed and blocks: the validator exits 1
#   warn    printed, does not block
#   off     not run at all
#
# A project overrides any of these in `framework.yaml` at its own root:
#
#     checks:
#       LC002: error        # we have been bitten by a stale living document
#       XP003: off          # we only have one product
#
# BEFORE ADDING A CHECK THAT MAKES A STATE ILLEGAL, ASK WHO ELSE READS THAT STATE.
# `REG011` asks every entry at the root to name the products it binds, which is correct on
# its own and was reviewed on its own. The generated union was selecting the entries that
# named none -- that being, until then, how an entry said it bound everything -- so the two
# shipped in one version and worked against each other: the more a repository answered the
# check, the emptier the section holding what binds all of it became, and in the first
# repository to finish answering, twenty entries left `§5` reading "Nothing open". Nothing
# looked wrong. The register was right and the check was satisfied.
#
# The question is mechanical and the answer is almost always in the same two places:
# `--emit-index`, which composes the registers into the views, and the skills, which tell an
# agent what a field means. Grep the state, not the check. And the invariant that catches
# the class rather than the instance is asserted in `tests/selfcheck.py`: every open entry
# reaches the generated view, in every shape it is allowed to declare, so a state added
# later that the generator does not know about fails on the day it is added instead of on
# the day somebody finishes migrating to it.
#
# WHY ALMOST EVERYTHING STARTS AT `warn`. Twelve checks turned on before the artifacts
# exist are a factory built before the product: they slow you down without having
# prevented anything yet, and the predictable reaction is to turn them all off at once.
# Two are `error` on day one, and they are the two `SKILLS.md §9` names: front matter that
# parses, and front matter that means something.

# ON `REG`, WHICH USED TO BE `OD`. The checks about the open register were `OD001` to
# `OD009`, and the entries inside that register are `OD-001`, `OD-004`, `OD-011`. One dash
# apart, in a file where both appear in the same sentence -- and it cost a reader exactly
# what you would expect: a check code read as a decision somebody had left open, and the
# reasonable question of why a framework carries decisions about a warehouse. A code names
# a rule that holds for every project; an id names a choice inside one. Nothing else here
# has that problem, because no artifact type is called `FM` or `LC`.
#
# The prefix is `REG` for register. The rename is mechanical and total: no code in this
# catalog begins with `OD` any more, and a project that pinned a level by code has to
# rename it too, which is one line per pinned check.

stale_days: 90        # after how long a living document counts as unreviewed

checks:

  # ── Front matter ───────────────────────────────────────────────────────────
  FM001:
    level: error
    title: front matter missing or unparseable
    prevents: >
      A file with no front matter is invisible to everything else here: no class, no
      status, no place in the graph. It reads as prose to an agent, and prose has no
      maintenance regime.

  FM002:
    level: error
    title: front matter does not validate against the type's schema
    prevents: >
      The wrong `lifecycle` on a type is the expensive one: an immutable declared living
      invites somebody to edit it, and a living one declared immutable freezes a document
      that has to stay current. Also catches a `status` outside its enumeration, a missing
      `scope` on a decision, and a required field left holding its template placeholder.

  FM003:
    level: warn
    title: unknown artifact_type
    prevents: >
      A typo in `artifact_type` silently exempts a document from every type specific
      check. It is not an error because a new template legitimately arrives before the
      registry knows about it.

  FM004:
    level: warn
    title: a front matter field still holds its template placeholder
    prevents: >
      The whole day one set copied out of `templates/` reading as filled in. The schemas
      reject `COMMIT_HASH` and `SHA_OF_THE_EVP_FILE` in a required string field, and that is
      as far as they reach: `owners: [NAME]` clears `minItems` because it is a list,
      `created: YYYY-MM-DD HH:MM` clears a field that carries no format on purpose,
      `derives_from: [PRB-NNN]` is not a reference `REF001` can resolve, and a
      `COMMIT_HASH` inside `verified_code` is a map value and not a required string. So a
      scaffold went into a real repository with zero errors while naming an owner who does
      not exist and a document that was never written. It cannot be closed in the schemas:
      every template ships `owners: [NAME]`, and a template that fails the check it teaches
      is worse than a permissive pattern. It warns rather than blocking because a half
      filled scaffold is a normal state to be in for an hour; it is the one nobody returns
      to that costs. `last_review` is left to `LC004`, which reports the same value and says
      more about it.

  FM005:
    level: warn
    title: a manifest carries a field that is derived now
    prevents: >
      Two answers to one question, where the hand written one wears the label of the
      generated one. `open_decisions`, `open_risks` and `active_changes` sat in
      `templates/product.yaml` marked GENERATED for months, with a note underneath admitting
      that nothing generated them -- so they were maintained by hand and read as computed,
      which is the combination nobody rereads. The derived answer is `product.index.yaml`
      now, and `RSK.md` §state for the risks. A manifest still carrying them is the third
      voice in a disagreement that should have one.

  # ── Sections ───────────────────────────────────────────────────────────────
  SEC001:
    level: warn
    title: mandatory section marker missing
    prevents: >
      A `CHG` with no "what must NOT change" is the most expensive defect in the
      framework: an agent optimises what you asked for and breaks what you did not name.
      Checked on the `<!-- section: id -->` markers, not on headings, so rewording or
      translating a title does not break it.

  # ── Maintenance regime ─────────────────────────────────────────────────────
  LC001:
    level: warn
    title: living document without last_review
    prevents: >
      Without the field there is no way to notice the document has gone stale, and a stale
      living document is worse than an absent one because it gets read as current.

  LC002:
    level: warn
    title: living document not reviewed for longer than stale_days
    prevents: >
      The same failure, arrived at slowly. Raise this to `error` the first time a decision
      is taken on a document nobody had reread.

  LC003:
    level: warn
    title: immutable document carrying last_review
    prevents: >
      An immutable is not reviewed, it is superseded. The field suggests a maintenance
      regime the document does not have, and invites the edit that breaks it.

  LC004:
    level: warn
    title: last_review is not an instant
    prevents: >
      A half filled `2026-07-29 HH:MM` presented as midnight would make a document that
      was never reviewed look reviewed. Also catches the template placeholder surviving
      into a real repository.

  LC005:
    level: warn
    title: several living documents attest the same review instant
    prevents: >
      A batch of field edits reading as a review. `last_review` says a person read this
      document and found it still true, and nothing can check a reading -- but the false
      version has a shape: in one repository six living documents were stamped with the same
      minute, and one of them opened with a notice, left standing by the same run, saying the
      rest of it was still written against something superseded and had to be reread in full.
      Three is the floor, because two documents finished in the same minute is a person and
      three is a loop. Timed to the minute and not to the day: reading four documents on a
      Tuesday is a Tuesday, reading four in one minute is a field edit. Documents carrying a
      bare date are not counted -- no minute, nothing to say. Neither is a document whose
      `created` and `last_review` are the same instant: `start` writes a whole day one set
      in one session and every document is born attesting itself, which is a creation and
      not a reading, and a check that fired on every new repository would be switched off in
      a week.

  # ── Identity and references ────────────────────────────────────────────────
  ID001:
    level: warn
    title: duplicate id
    prevents: >
      Two documents with one id means every reference to it is ambiguous, and the
      traceability chain silently picks one.

  REF001:
    level: warn
    title: derives_from points at something that does not exist
    prevents: >
      A broken chain reads as an absent one. The document appears to descend from nothing,
      which is exactly what an undocumented decision looks like.

  REF002:
    level: warn
    title: supersedes points at something that does not exist

  REF003:
    level: warn
    title: superseded document still carries a live status
    prevents: >
      Two documents both claiming to be current, one of which was replaced. An agent
      reading the old one decides on a decision that was already overturned.

  REF004:
    level: warn
    title: cycle in the supersedence chain

  REF005:
    level: warn
    title: a citation to the glossary that resolves to nothing
    prevents: >
      A word that reads as defined and is not. A data contract sending a reader to
      `GLOSSARY §Tenant` for what a column means is a reference exactly like `derives_from`,
      and until this there was no second end to resolve it against: one contract cited three
      terms, none of the three was in the glossary, and nothing said so. That is more
      expensive than citing nothing at all, because the reader stops looking and the word
      goes on meaning whatever each document assumed it meant. Resolved against the `terms:`
      map and not against the `###` headings of the body: two checks here were once built on
      headings, somebody reworded a label, and both went quiet -- reporting nothing, which
      reads as nothing being wrong. A citation to a term declared `blocked_by` an open entry
      resolves and stays silent: the gap is written down, which is the whole difference, and
      a `blocked_by` pointing at an entry no register declares is reported instead.

  REF006:
    level: warn
    title: a risk about a promise nobody recorded
    prevents: >
      An exposure nobody can act on. A commercial risk is a claim somebody made to somebody
      else, and the remedy for it is a conversation with whoever received it -- so a
      commercial risk that names no `commitment` is one nobody will ever renegotiate,
      because there is no record that a promise was made. In a real repository a risk
      tracked "maintenance with no manual intervention" as a serious commercial exposure and
      the commitments register did not contain that sentence at all. A `commitment` naming
      an id no register declares is reported the same way. Closed and expired risks are
      exempt: the promise behind them stopped mattering, and asking for it is asking about
      history.

  # ── Discipline ─────────────────────────────────────────────────────────────
  RLM001:
    level: warn
    title: release manifest with an empty rollback.target
    prevents: >
      The manifest is useless at the one moment it exists for.

  RLM002:
    level: warn
    title: rollback procedure declared untested
    prevents: >
      An untested rollback procedure is not a procedure, it is an intention.

  REG001:
    level: warn
    title: no open register in the repository
    prevents: >
      Without `OPEN.md` an agent has no way to know what has not been decided, and will
      fill the gap with a plausible assumption and implement it with conviction. It is the
      single most damaging thing an agent does in a documented repository.

  REG002:
    level: warn
    title: open decision already closed by a DEC that derives from it
    prevents: >
      The register says something is open that is decided, so an agent stops to ask
      permission for a choice already made. Only a `DEC` that names the entry in
      `derives_from` counts as closing it: a `DEC` cites an open entry for three different
      reasons and treating all three as closure would make this warning fire constantly,
      which teaches people to dismiss it.

  REG003:
    level: warn
    title: high cost to reverse and no default in force
    prevents: >
      The most expensive combination there is. It has to be decided even on incomplete
      information, because the cost of waiting exceeds the cost of getting it wrong.

  REG004:
    level: warn
    title: open register with no structured entries
    prevents: >
      REG002 and REG003 having nothing to read while the register looks full. Both used to
      match prose in the body -- `### OD-NNN`, and a line saying the cost to reverse -- so
      renaming that label or translating it switched them off without a word. Reporting
      nothing then read as "no high-cost decision is outstanding", which is the answer
      somebody was hoping for. The two fields they need live in `entries:` now, and their
      absence is a finding rather than a silence.

  REG005:
    level: warn
    title: an entry of the open register is not filled in enough to be read
    prevents: >
      The register's own instructions call `Default in force` mandatory, and until this only
      `REG003` looked at it and only on a high cost entry: a medium one with no default
      passed, and that is the field the whole file is built around. Also catches a `decided`
      entry naming no `closed_by`, which leaves the reasoning to be found again, a
      `depends_on` pointing at an entry the register does not declare, and an open `OD` with
      no cost to reverse, which is what orders the file. `KI-` entries are exempt from the
      default and the cost: those are properties of a choice and a known issue is not one.
      The default and the cost are asked of an entry while it is `open` and not after: they
      order §1, and an entry that has been decided has left it. Asked of a `decided` row
      they reported the documented closure for having been carried out.

  REG006:
    level: warn
    title: product with no open register of its own
    prevents: >
      The open questions of a product being filed under another product's heading, or
      nowhere. The register is the file an agent reads before deciding anything, and an
      agent working on one product reads the one beside that product: a directory with no
      register tells it nothing is open, which is the assumption it then implements. One
      per product is not a convenience, it is what makes "read `OPEN.md` first" a rule with
      a single answer.

  REG007:
    level: warn
    title: the same entry id declared by two registers
    prevents: >
      An ambiguous `depends_on`. Entry ids are one sequence across every register in the
      repository, because a dependency and the `derives_from` of a `DEC` name an entry by
      its id and nothing else. Two registers that both start at `OD-001` do not collide
      loudly: whichever file was read last wins, and the chain in `TRACEABILITY.md` records
      the wrong end. A register adopted from before the framework continues the numbering
      and keeps its old labels in the prose.

  REG008:
    level: warn
    title: an entry declares a product its register contradicts
    prevents: >
      Two answers to who an entry is about. A register under `products/<p>/` is about `p`
      by virtue of sitting there, which is why the field is normally left off; an entry
      that names a different product is read as this product's by a person opening the
      directory and attributed elsewhere by the derived view, and neither is told about the
      other. An entry binding several products belongs in the register at the root, where
      naming them is exactly what the field is for.

  REG009:
    level: warn
    title: an open entry has a date in its trigger
    prevents: >
      A number nobody derived standing in for the thing that actually closes the window.
      A commitment being made by an entry that exists because nothing has been decided.
      The field was called `deadline` until 2.0.0, and a field named for a date collects
      dates: an end of quarter picked because the line had to say something, read later as a
      promise by somebody who never opened the register. What closes the window is an event
      -- the second customer, the first line of code written against it, the signature -- or
      entry: `depends_on` for one before the other, `decide_with` for two that have to be
      taken together. Every date is reported and not only a bare one, because a date beside
      an event is still the half that gets quoted back. Read on `open` entries only: a
      decided one has spent its trigger. The digits are what is matched, so "by the end of
      the quarter" passes -- that is a limit of the check and not permission, and the
      template says so where a person is writing the line.

  REG010:
    level: warn
    title: a heading of the open register carries a date
    prevents: >
      A term of time applied to every entry filed under a heading, recorded by no field of
      any of them. This framework's own template shipped one -- the tier heading read
      "decide within the first month" -- and in the first repository that copied it that
      sentence bound sixteen entries at once without saying from when. `REG009` cannot see
      it: it reads the `trigger` of an entry, and a heading belongs to no entry. Headings
      only, which is what separates this from matching prose: a line starting with `#` is
      structure somebody wrote on purpose, and a date in one is addressed to whoever files
      an entry underneath. What a heading is for is what a group of entries have in common,
      which in this register is what changing your mind costs; when each has to be decided
      is its own trigger.

  REG011:
    level: warn
    title: an entry in the root register does not say which products it binds
    prevents: >
      A silence that is two different statements. Under `products/<p>/` the directory
      answers the question, which is why the field is left off there and `REG008` reports an
      entry contradicting it. At the root nothing answers it: an entry with no `products:`
      binds every product by rule, and that is indistinguishable from an entry nobody asked
      the question about. The first repository to run into this had twenty entries at the
      root, a product register whose prose said none of them were that product's, and a
      manifest listing all of them as its own -- three artefacts, three answers, and no
      check able to say which was meant. `products: [all]` is the statement and absence is
      the gap, the same distinction `entries: {}` already buys against an absent
      `entries:`. The reserved word rather than a list of every product, because a list says
      the same thing until somebody adds a product and then quietly says less.

      Not asked before there are products to name: a repository at day one has a register
      and no manifest anywhere, which is the state the register exists for -- it fills up
      before the products do -- and a question with no available answers is not a finding.

  REG012:
    level: warn
    title: a decision does not say what it leaves open
    prevents: >
      An open question that no register holds and no count includes. A `DEC` in a real
      repository declared in its prose that one thing remained explicitly open -- the
      reusable semantic context -- and that question lived nowhere: not in a register, not
      in any tally of what is undecided, findable only by somebody reading the decision end
      to end. `leaves_open: []` is the answer when a decision settles everything it touched,
      and it is a different statement from the field being absent, which is the same
      distinction `entries: {}` and `products: [all]` already buy. At `warn` and not in the
      schema, so a repository written against an earlier version keeps validating while it
      catches up. An id named there that no register declares is reported too: the open half
      of a decision is only open if somebody can find it.

  REG013:
    level: warn
    title: an entry at the root binds one product and belongs beside it
    prevents: >
      A register that answers the question and still files the entry in the wrong place.
      `FRAMEWORK.md` says the root keeps what belongs to no single product, and `REG008`
      says an entry belonging to one goes in that product's register -- the doctrine was
      written twice and enforced nowhere, because `REG008` only looks inside
      `products/<p>/` and at the root there is no directory to contradict. So `REG011` went
      green on seventeen entries at the root that each bind one product, and green there
      means the question was answered, not that the answer puts the entry where it belongs.
      A check that a field is filled in is not a check that the value is right, and the two
      are close enough to be mistaken for each other.

      At `warn`, which is the level for a debt somebody may be carrying on purpose: it stays
      visible until it is paid, and it does not stop a migration halfway. Only when the
      product has a directory, because an entry naming a product with no register anywhere
      has nowhere to be moved to -- that is `REG006`, and it is about the product.

  REG014:
    level: warn
    title: a decision leaves something open that nobody has registered
    prevents: >
      A debt that reads exactly like a silence. `leaves_open` had two states -- a list of
      ids, or absent -- and a real repository needed a third four times in one week: the
      decision did settle less than everything, and what it left has no entry yet, usually
      because the register it was in was withdrawn and never reimported. Written as absence
      it produced the finding for "nobody looked", word for word, on decisions where
      somebody had looked and said so.

      `[unregistered]` is that third state, alone or beside the ids that do exist, and it is
      the same distinction `entries: {}` and `products: [all]` were introduced to buy.
      Reported at `warn` because it is still a question nobody can find: nothing ranks it by
      cost to reverse and no count of what is open includes it. What it buys is that the
      repository can tell the difference between a debt somebody has accepted and a question
      nobody asked -- and `product.index.yaml` carries `open_unregistered` for the same
      reason, since a question with no entry cannot appear in a view built from registers.

  # ── STACK ──────────────────────────────────────────────────────────────────
  STK001:
    level: warn
    title: a stack entry contradicts what its status claims
    prevents: >
      With three values there was no way to file the ordinary case -- a tool tried in a
      proof of concept, not in use, that nobody decided against -- so a real repository
      wrote two of them as `ruled-out` with no decision to name, and this check reported
      documents whose only fault was that the vocabulary was short. `dropped` is that state.
      `ruled-out` still claims a decision and still has to name it; `dropped` with a
      `decided_in` is reported the other way, because a decision filed as an accident is a
      reason nobody will find.

      The document going back to being the thing it replaced. `chosen` means somebody
      decided, so it has to name the `DEC`; `unratified` means nobody did, so it must not;
      and a `decided_in` pointing at a decision that does not exist or was never accepted
      says a choice was made when the record of it is missing. Without this the schema
      accepts `status: chosen` with nothing behind it, which is exactly the ambiguity the
      artifact exists to remove.

  XP005:
    level: warn
    title: a product carries commitments and has no risk register
    prevents: >
      The exposure living only in the sentence that created it. Promising something before
      it exists is the ordinary case in the projects this framework is written for, and it
      is supposed to leave two marks: a risk somebody owns, and an entry in the open
      register. In a real repository one product carried eleven commitments -- eight of them
      recorded as already delivered, on capabilities the same documents say are not built --
      and had no `RSK.md` at all, so the first mark had nowhere to be. Nothing could see it
      until the commitments became readable: both registers were markdown tables, and a
      check cannot join two tables it cannot read.

  # ── Attestation ────────────────────────────────────────────────────────────
  VER001:
    level: warn
    title: verified_code names a repository no code map declares
    prevents: >
      An attestation pointing at a repository this project cannot resolve. Either nobody
      recorded where that code lives, so the commit cannot be checked, or the key is a typo
      and a repository that really was measured has no entry -- and both read as a complete
      attestation.

  VER002:
    level: warn
    title: a release relevant repository carries no commit in verified_code
    prevents: >
      An attestation that covers part of the system and reads as covering all of it. That
      is the failure the single `verified_against` hash had once the code was split across
      repositories, and it is the whole reason the field became a map. It fires only against
      repositories that declared themselves `release_relevant`, so a project that has not
      marked any is not measured against a list it never wrote.

  VER003:
    level: warn
    title: a shared release relevant repository names no product that uses it
    prevents: >
      A component of the substrate shipping unmeasured while every report reads as complete.
      A repository in `PLATFORM.md` is used by some products and not others, and only
      `used_by` says which: without it no evaluation can be required to attest it, so the
      hole is silent. Requiring it of every product instead would ask one product's
      evaluation to account for a component it does not ship.

  # ── Across products ────────────────────────────────────────────────────────
  XP001:
    level: warn
    title: more than one glossary
    prevents: >
      The glossary is where the complementarity between products is either defined or
      lost. Two of them means the same concept already has two names and nobody noticed.

  XP002:
    level: warn
    title: data contract consumer is not a known product
    prevents: >
      Either the consumer is external and belongs in prose, or it is a typo and the
      contract has no reader.

  XP003:
    level: warn
    title: product with no product brief
    prevents: >
      The definition of the product exists only in somebody's head or in a sales pitch.

  XP004:
    level: warn
    title: one repository declared as the code of more than one thing
    prevents: >
      Two descriptions of the same repository drifting apart. `code:` answers where the
      code is, and it exists on `product.yaml` and on `PLATFORM.md` because a repository
      two products sign in through belongs to the substrate and not to either of them. The
      failure it guards is not the duplication itself but what follows: the entries are
      written on the same day and agree, and then one of them is corrected.

  FW001:
    level: warn
    title: the repository was written against a different version of the framework
    prevents: >
      A team reading a finding as their own mistake when the rules moved underneath them,
      or the reverse. Those need opposite responses: one is a migration, the other is a
      repair, and guessing wrong at it a few times is how a validator stops being read.
      It warns rather than blocking, because the day the registry moves is exactly when a
      project most needs to run the validator and see what it says.

  FW002:
    level: info
    title: the repository does not say which framework version it was written against
    prevents: >
      The same confusion, one step earlier. Every repository that predates this check is
      in this state and none of them is broken, so it reports at `info` and stays there:
      it becomes worth raising the first time a version bump costs somebody an afternoon
      of looking for a mistake that was not theirs.

  ICG001:
    level: info    # the first `info` in this catalog, and the reason is below
    title: signals no impact classification has ever considered
    prevents: >
      A cycle re-reading the whole log and guessing which signals are new, and the older
      failure underneath it: a signal quietly never looked at by anyone. `LOG` is
      append-only, so a row can never be marked handled and triage state cannot live
      there. It lives in the `ICG` instead, where every candidate examined appears in
      `routing`, including the ones routed `not-a-candidate`. This check is the question
      "which signals has nobody looked at", which before the `ICG` existed had no answer
      and was settled by guessing.
    why_info: >
      Untriaged signals are the state every repository is in before its first cycle, and
      every repository written before the `ICG` type existed is in it for all of them. That
      is not a fault, it is work not yet done, and a warning that fires on correct
      documents on day one is a warning people learn to scroll past. It reports at `info`
      and stays there until a project has reason to raise it, which is the framework's rule
      everywhere else: one line in the project's `framework.yaml`, the first time somebody
      opens a cycle and finds a signal from four months ago nobody had ever read.

  CHG001:
    level: warn
    title: change contract declaring AI impact without citing an EVR
    prevents: >
      A change to a model, a prompt or a retrieval index called done with nobody having
      measured what it did. It reads the `ICG` the change names in `icg` and the candidate
      it names in `derives_from`, so the routing is a field lookup rather than a phrase
      matched in prose. It fires only at `status: verified`, because the evaluation report
      follows the build and demanding it sooner would forbid the order the framework
      prescribes. A `CHG` with no `icg` is skipped: that gap is real and is not this check.

  CHG002:
    level: warn
    title: change contract declaring architecture impact without citing a DEC
    prevents: >
      The architecture moving with the reason written nowhere. Same lookup, and it fires
      from `approved` onwards rather than at `verified`, because the reshaping happens
      before the change is authorized: a decision record should already exist by the time
      anybody is allowed to build.

  CHG003:
    level: warn
    title: authorized change contract that names no impact classification
    prevents: >
      The two checks above being stepped around by leaving a field out. They read what a
      change touches from the `ICG` it names in `icg`, and a `CHG` with no `icg` clears
      both without being looked at. The direction is what makes it worth a check of its
      own: they question whoever filled the field in and say nothing to whoever did not, so
      the output is not silence, it is a green report. It fires from `approved` onwards and
      not before, because writing a change proposal ahead of its triage is the normal order
      and a `draft` with no classification yet is not a defect. There is no exemption for a
      technical change: one that touches nothing structural is classified `routing: none`,
      which is what `none` is for, and a field that excused a `CHG` from classification
      would be a way around the way around.

# ON THE PROSE COUPLED CHECKS. There are none left. REG002 and REG003 used to read the body
