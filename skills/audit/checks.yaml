# Check catalog and default severities
#
# Every check the validator knows how to run is listed here, with what it costs to be
# wrong. Turning one on is editing one line, which is the point: the rule the framework
# gives itself is to add a check when the failure it prevents has already happened once,
# and that rule is unaffordable if each check is a commit of code.
#
# Levels:
#   error   printed and blocks: the validator exits 1
#   warn    printed, does not block
#   off     not run at all
#
# A project overrides any of these in `framework.yaml` at its own root:
#
#     checks:
#       LC002: error        # we have been bitten by a stale living document
#       XP003: off          # we only have one product
#
# WHY ALMOST EVERYTHING STARTS AT `warn`. Twelve checks turned on before the artifacts
# exist are a factory built before the product: they slow you down without having
# prevented anything yet, and the predictable reaction is to turn them all off at once.
# Two are `error` on day one, and they are the two `SKILLS.md §9` names: front matter that
# parses, and front matter that means something.

stale_days: 90        # after how long a living document counts as unreviewed

checks:

  # ── Front matter ───────────────────────────────────────────────────────────
  FM001:
    level: error
    title: front matter missing or unparseable
    prevents: >
      A file with no front matter is invisible to everything else here: no class, no
      status, no place in the graph. It reads as prose to an agent, and prose has no
      maintenance regime.

  FM002:
    level: error
    title: front matter does not validate against the type's schema
    prevents: >
      The wrong `lifecycle` on a type is the expensive one: an immutable declared living
      invites somebody to edit it, and a living one declared immutable freezes a document
      that has to stay current. Also catches a `status` outside its enumeration, a missing
      `scope` on a decision, and a required field left holding its template placeholder.

  FM003:
    level: warn
    title: unknown artifact_type
    prevents: >
      A typo in `artifact_type` silently exempts a document from every type specific
      check. It is not an error because a new template legitimately arrives before the
      registry knows about it.

  # ── Sections ───────────────────────────────────────────────────────────────
  SEC001:
    level: warn
    title: mandatory section marker missing
    prevents: >
      A `CHG` with no "what must NOT change" is the most expensive defect in the
      framework: an agent optimises what you asked for and breaks what you did not name.
      Checked on the `<!-- section: id -->` markers, not on headings, so rewording or
      translating a title does not break it.

  # ── Maintenance regime ─────────────────────────────────────────────────────
  LC001:
    level: warn
    title: living document without last_review
    prevents: >
      Without the field there is no way to notice the document has gone stale, and a stale
      living document is worse than an absent one because it gets read as current.

  LC002:
    level: warn
    title: living document not reviewed for longer than stale_days
    prevents: >
      The same failure, arrived at slowly. Raise this to `error` the first time a decision
      is taken on a document nobody had reread.

  LC003:
    level: warn
    title: immutable document carrying last_review
    prevents: >
      An immutable is not reviewed, it is superseded. The field suggests a maintenance
      regime the document does not have, and invites the edit that breaks it.

  LC004:
    level: warn
    title: last_review is not an instant
    prevents: >
      A half filled `2026-07-29 HH:MM` presented as midnight would make a document that
      was never reviewed look reviewed. Also catches the template placeholder surviving
      into a real repository.

  # ── Identity and references ────────────────────────────────────────────────
  ID001:
    level: warn
    title: duplicate id
    prevents: >
      Two documents with one id means every reference to it is ambiguous, and the
      traceability chain silently picks one.

  REF001:
    level: warn
    title: derives_from points at something that does not exist
    prevents: >
      A broken chain reads as an absent one. The document appears to descend from nothing,
      which is exactly what an undocumented decision looks like.

  REF002:
    level: warn
    title: supersedes points at something that does not exist

  REF003:
    level: warn
    title: superseded document still carries a live status
    prevents: >
      Two documents both claiming to be current, one of which was replaced. An agent
      reading the old one decides on a decision that was already overturned.

  REF004:
    level: warn
    title: cycle in the supersedence chain

  # ── Discipline ─────────────────────────────────────────────────────────────
  RLM001:
    level: warn
    title: release manifest with an empty rollback.target
    prevents: >
      The manifest is useless at the one moment it exists for.

  RLM002:
    level: warn
    title: rollback procedure declared untested
    prevents: >
      An untested rollback procedure is not a procedure, it is an intention.

  OD001:
    level: warn
    title: no open register in the repository
    prevents: >
      Without `OPEN.md` an agent has no way to know what has not been decided, and will
      fill the gap with a plausible assumption and implement it with conviction. It is the
      single most damaging thing an agent does in a documented repository.

  OD002:
    level: warn
    title: open decision already closed by a DEC that derives from it
    prevents: >
      The register says something is open that is decided, so an agent stops to ask
      permission for a choice already made. Only a `DEC` that names the entry in
      `derives_from` counts as closing it: a `DEC` cites an open entry for three different
      reasons and treating all three as closure would make this warning fire constantly,
      which teaches people to dismiss it.

  OD003:
    level: warn
    title: high cost to reverse and no default in force
    prevents: >
      The most expensive combination there is. It has to be decided even on incomplete
      information, because the cost of waiting exceeds the cost of getting it wrong.

  OD004:
    level: warn
    title: open register with no structured entries
    prevents: >
      OD002 and OD003 having nothing to read while the register looks full. Both used to
      match prose in the body -- `### OD-NNN`, and a line saying the cost to reverse -- so
      renaming that label or translating it switched them off without a word. Reporting
      nothing then read as "no high-cost decision is outstanding", which is the answer
      somebody was hoping for. The two fields they need live in `entries:` now, and their
      absence is a finding rather than a silence.

  OD005:
    level: warn
    title: an entry of the open register is not filled in enough to be read
    prevents: >
      The register's own instructions call `Default in force` mandatory, and until this only
      `OD003` looked at it and only on a high cost entry: a medium one with no default
      passed, and that is the field the whole file is built around. Also catches a `decided`
      entry naming no `closed_by`, which leaves the reasoning to be found again, a
      `depends_on` pointing at an entry the register does not declare, and an `OD` with no
      cost to reverse, which is what orders the file. `KI-` entries are exempt from the
      default and the cost: those are properties of a choice and a known issue is not one.

  # ── STACK ──────────────────────────────────────────────────────────────────
  STK001:
    level: warn
    title: a stack entry contradicts what its status claims
    prevents: >
      The document going back to being the thing it replaced. `chosen` means somebody
      decided, so it has to name the `DEC`; `unratified` means nobody did, so it must not;
      and a `decided_in` pointing at a decision that does not exist or was never accepted
      says a choice was made when the record of it is missing. Without this the schema
      accepts `status: chosen` with nothing behind it, which is exactly the ambiguity the
      artifact exists to remove.

  # ── Attestation ────────────────────────────────────────────────────────────
  VER001:
    level: warn
    title: verified_code names a repository no code map declares
    prevents: >
      An attestation pointing at a repository this project cannot resolve. Either nobody
      recorded where that code lives, so the commit cannot be checked, or the key is a typo
      and a repository that really was measured has no entry -- and both read as a complete
      attestation.

  VER002:
    level: warn
    title: a release relevant repository carries no commit in verified_code
    prevents: >
      An attestation that covers part of the system and reads as covering all of it. That
      is the failure the single `verified_against` hash had once the code was split across
      repositories, and it is the whole reason the field became a map. It fires only against
      repositories that declared themselves `release_relevant`, so a project that has not
      marked any is not measured against a list it never wrote.

  VER003:
    level: warn
    title: a shared release relevant repository names no product that uses it
    prevents: >
      A component of the substrate shipping unmeasured while every report reads as complete.
      A repository in `PLATFORM.md` is used by some products and not others, and only
      `used_by` says which: without it no evaluation can be required to attest it, so the
      hole is silent. Requiring it of every product instead would ask one product's
      evaluation to account for a component it does not ship.

  # ── Across products ────────────────────────────────────────────────────────
  XP001:
    level: warn
    title: more than one glossary
    prevents: >
      The glossary is where the complementarity between products is either defined or
      lost. Two of them means the same concept already has two names and nobody noticed.

  XP002:
    level: warn
    title: data contract consumer is not a known product
    prevents: >
      Either the consumer is external and belongs in prose, or it is a typo and the
      contract has no reader.

  XP003:
    level: warn
    title: product with no product brief
    prevents: >
      The definition of the product exists only in somebody's head or in a sales pitch.

  XP004:
    level: warn
    title: one repository declared as the code of more than one thing
    prevents: >
      Two descriptions of the same repository drifting apart. `code:` answers where the
      code is, and it exists on `product.yaml` and on `PLATFORM.md` because a repository
      two products sign in through belongs to the substrate and not to either of them. The
      failure it guards is not the duplication itself but what follows: the entries are
      written on the same day and agree, and then one of them is corrected.

  FW001:
    level: warn
    title: the repository was written against a different version of the framework
    prevents: >
      A team reading a finding as their own mistake when the rules moved underneath them,
      or the reverse. Those need opposite responses: one is a migration, the other is a
      repair, and guessing wrong at it a few times is how a validator stops being read.
      It warns rather than blocking, because the day the registry moves is exactly when a
      project most needs to run the validator and see what it says.

  FW002:
    level: info
    title: the repository does not say which framework version it was written against
    prevents: >
      The same confusion, one step earlier. Every repository that predates this check is
      in this state and none of them is broken, so it reports at `info` and stays there:
      it becomes worth raising the first time a version bump costs somebody an afternoon
      of looking for a mistake that was not theirs.

  ICG001:
    level: info    # the first `info` in this catalog, and the reason is below
    title: signals no impact classification has ever considered
    prevents: >
      A cycle re-reading the whole log and guessing which signals are new, and the older
      failure underneath it: a signal quietly never looked at by anyone. `LOG` is
      append-only, so a row can never be marked handled and triage state cannot live
      there. It lives in the `ICG` instead, where every candidate examined appears in
      `routing`, including the ones routed `not-a-candidate`. This check is the question
      "which signals has nobody looked at", which before the `ICG` existed had no answer
      and was settled by guessing.
    why_info: >
      Untriaged signals are the state every repository is in before its first cycle, and
      every repository written before the `ICG` type existed is in it for all of them. That
      is not a fault, it is work not yet done, and a warning that fires on correct
      documents on day one is a warning people learn to scroll past. It reports at `info`
      and stays there until a project has reason to raise it, which is the framework's rule
      everywhere else: one line in the project's `framework.yaml`, the first time somebody
      opens a cycle and finds a signal from four months ago nobody had ever read.

  CHG001:
    level: warn
    title: change contract declaring AI impact without citing an EVR
    prevents: >
      A change to a model, a prompt or a retrieval index called done with nobody having
      measured what it did. It reads the `ICG` the change names in `icg` and the candidate
      it names in `derives_from`, so the routing is a field lookup rather than a phrase
      matched in prose. It fires only at `status: verified`, because the evaluation report
      follows the build and demanding it sooner would forbid the order the framework
      prescribes. A `CHG` with no `icg` is skipped: that gap is real and is not this check.

  CHG002:
    level: warn
    title: change contract declaring architecture impact without citing a DEC
    prevents: >
      The architecture moving with the reason written nowhere. Same lookup, and it fires
      from `approved` onwards rather than at `verified`, because the reshaping happens
      before the change is authorized: a decision record should already exist by the time
      anybody is allowed to build.

  CHG003:
    level: warn
    title: authorized change contract that names no impact classification
    prevents: >
      The two checks above being stepped around by leaving a field out. They read what a
      change touches from the `ICG` it names in `icg`, and a `CHG` with no `icg` clears
      both without being looked at. The direction is what makes it worth a check of its
      own: they question whoever filled the field in and say nothing to whoever did not, so
      the output is not silence, it is a green report. It fires from `approved` onwards and
      not before, because writing a change proposal ahead of its triage is the normal order
      and a `draft` with no classification yet is not a defect. There is no exemption for a
      technical change: one that touches nothing structural is classified `routing: none`,
      which is what `none` is for, and a field that excused a `CHG` from classification
      would be a way around the way around.

# ON THE PROSE COUPLED CHECKS. There are none left. OD002 and OD003 used to read the body
# of `OPEN.md` -- the `### OD-NNN` headings and the "Cost to reverse" and "Default in force"
# lines inside each entry -- which is the fragility the section markers removed, one level
# down: at the level of fields inside an entry rather than sections inside a file. Rewording
# or translating the register switched both off, silently, and reporting nothing read as "no
# high-cost decision is outstanding".
#
# They read `entries:` in the front matter now, and `OD004` reports a register that does not
# carry it, because the absence has to be louder than the silence it used to produce. The
# body keeps the prose: `OPEN.md` is where somebody decides something, and the alternatives
# and consequences that make an entry decidable are not fields.
